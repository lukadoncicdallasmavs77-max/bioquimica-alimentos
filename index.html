const TPOS=[
["Metabolismo Ativo, Perdas vs Desperdício e Ciclo de Vida do Fruto",`<p>Frutas e hortaliças colhidas <b>permanecem organismos vivos</b>, mantendo metabolismo celular ativo, trocas gasosas respiratórias ininterruptas, transpiração cuticular e síntese hormonal após o desprendimento da planta-mãe. <i>Fruta colhida não desliga o motor</i>: ela continua respirando e oxidando as próprias reservas carbonadas internas até o esgotamento se o ambiente não for rigorosamente gerenciado.</p>`+tb(["Conceito (FAO)","Onde e quando ocorre","Causas primárias","Impacto na cadeia"],[["[[Perdas de alimentos]]","Etapas preliminares: campo, colheita, seleção, beneficiamento e transporte interestadual","Infraestrutura precária, embalagens rudimentares (caixas de madeira ásperas) e ausência de refrigeração","25,4% a até 50% de descarte antes mesmo de chegar à gôndola"],["[[Desperdício de alimentos]]","Fases terminais: gôndola do varejo, serviços de alimentação coletiva (UAN) e domicílio","Descarte comportamental por exigência estética, compras excessivas e validade expirada","Elevado volume de descarte de produtos perfeitamente aptos ao consumo"]])+`<h3>Os 4 estádios fenológicos do fruto</h3>`+tb(["Estádio fenológico","Processos fisiológicos e celulares determinantes"],[["1. [[Formação]]","Polinização e fecundação dos órgãos florais; murchamento de pétalas e rápida expansão do ovário fecundado"],["2. [[Crescimento]]","Multiplicação e hipertrofia celular aceleradas até atingir tamanho e massa finais máximos; acúmulo de amido e ácidos livres"],["3. [[Maturação]]","Degradação de clorofila, síntese de novos pigmentos (carotenoides e antocianinas), amolecimento péctico, queda de acidez, polimerização de taninos e síntese de voláteis aromáticos"],["4. [[Senescência]]","Ruptura irreversível da homeostase metabólica celular, perda de integridade de biomembranas e morte celular programada"]])+`<p class=n>Relação superfície/volume: folhosas ([[alface]]) possuem altíssima área exposta e grande densidade de estômatos, perdendo água e murchando em horas; frutos volumosos ([[melancia]]) possuem cutícula cerosa espessa e baixa área proporcional de transpiração.</p>`+pg([["Confundir perda com desperdício na cadeia produtiva.","Perda ocorre antes do varejo (campo e transporte); desperdício ocorre no supermercado, restaurante e casa do consumidor."],["Achar que fruta ou hortaliça colhida 'morre' no momento em que é destacada da planta.","Permanece 100% viva, respirando, transpirando e consumindo suas próprias reservas de açúcar."],["Acreditar que comer fruta verde ou senescente fornece a mesma densidade nutricional da madura.","Frutos verdes têm excesso de ácidos e taninos; senescentes perdem mais de 50% da vitamina C por ação da ascorbato oxidase."]]),["Hortifrúti colhido continua vivo: respira, transpira e consome reservas até senescer","FAO: perda ocorre do campo ao transporte; desperdício ocorre no varejo e no prato do consumidor"],"O tomate botanicamente é fruto verdadeiro carnoso, mas na culinária é manipulado como legume salada.",[["Diferencie os conceitos de perda e desperdício de alimentos estabelecidos pela FAO.","Perdas ocorrem do campo ao transporte rodoviário por falhas logísticas; desperdício ocorre no varejo, UANs e domicílio por descarte comportamental.","Até 50% dos vegetais em países em desenvolvimento são perdidos antes de chegarem à gôndola de venda."],["Quais são os quatro estádios fenológicos sucessivos do ciclo de vida dos frutos?","1) Formação (polinização/fecundação), 2) Crescimento (hipertrofia), 3) Maturação (transformações químicas) e 4) Senescência (morte celular).","A maturação reúne o declínio de acidez, degradação da clorofila, perda de adstringência e síntese de voláteis."],["Por que hortaliças folhosas murcham muito mais rápido que tubérculos e frutos volumosos?","Porque possuem altíssima razão superfície/volume, cutícula delgada e grande densidade estomática, maximizando a taxa de transpiração.","Tubérculos e melancias têm baixa área superficial proporcional e cutícula espessa, minimizando a perda d'água."]]],
["Classificação Fisiológica: Climatéricos vs Não-Climatéricos",`<p>A classificação fisiológica respiratória é a diretriz mestre que governa o momento de colheita, a logística de transporte e a gestão de estoques de hortifrúti.</p>`+tb(["Classificação fisiológica","Comportamento pós-colheita","Cinética respiratória e etileno","Exemplos de alimentos"],[["[[Frutos climatéricos]]","<b>Continuam amadurecendo plenamente</b> após desprendidos da planta-mãe","Ascensão conspícua na respiração celular ([[climatério respiratório]]) e síntese autocatalítica de etileno","Banana, abacate, manga, mamão papaia, maçã, pera, tomate, goiaba, maracujá, pêssego, melão cantaloupe, kiwi, ameixa, caqui"],["[[Frutos não-climatéricos]]","<b>Não continuam o amadurecimento</b> após a colheita; entram direto em senescência","Respiração decai de forma contínua e monotônica; ausência de pico de respiração ou de etileno","Frutas cítricas (laranja, limão, tangerina), morango, uva, abacaxi, melancia, cacau, caju, cereja, amora, figo, carambola"]])+`<h3>Aplicações logísticas e culinárias</h3><p>Frutos climatéricos podem e devem ser colhidos no estádio <b>verde-maduro ou 'de vez'</b> (maturidade fisiológica), resistindo ao impacto mecânico do transporte rodoviário e completando o amadurecimento na despensa ou mediante aplicação exógena de etileno em câmaras de maturação. Já os não-climatéricos devem obrigatoriamente ser colhidos no <b>ponto ótimo de consumo</b>: colheu morango ou uva verde, perdeu o alimento, pois ele não ganha açúcar nem perde acidez fora do pé.</p><p class=w2><b>Incompatibilidade de armazenamento em câmaras:</b> nunca armazene frutos climatéricos em amadurecimento ativo (banana, mamão, maçã) no mesmo cômodo fechado que hortaliças verdes sensíveis (alface, couve, brócolis). O gás etileno liberado pelos climatéricos induz a transcrição acelerada da enzima <b>[[clorofilase]]</b> nos folhosos, amarelando e destruindo o lote em 24 a 48 horas.</p>`+pg([["Regra de ouro: achar que morango ou uva verde amadurecem na fruteira da cozinha.","Não-climatéricos não amadurecem fora da planta; colhidos verdes apenas murcham, desidratam e apodrecem azedos."],["Acreditar que embrulhar banana verde no jornal é simpatia sem efeito biológico.","Funciona comprovadamente: o papel aprisiona o gás etileno expelido pelo fruto, acelerando a respiração climatérica."],["Achar que uva com sabor alcoólico na geladeira está 'amadurecendo demais'.","A uva é não-climatérica; o sabor de etanol decorre de fermentação anaeróbica por escassez de oxigênio na embalagem plástica."]]),["Climatéricos amadurecem fora do pé (banana, abacate, mamão, maçã, tomate) com pico respiratório e de etileno","Não-climatéricos não amadurecem fora da planta (citros, morango, uva, abacaxi); colheu verde, perdeu o fruto"],"O etileno das frutas climatéricas amarela hortaliças verdes vizinhas por ativar a clorofilase.",[["Qual é a diferença fisiológica fundamental entre frutos climatéricos e não-climatéricos?","Climatéricos apresentam pico respiratório e síntese autocatalítica de etileno pós-colheita, amadurecendo fora do pé; não-climatéricos têm respiração decrescente e não amadurecem desprendidos da planta.","Por isso, climatéricos podem ser colhidos verdes de vez e não-climatéricos exigem colheita no ponto ideal de consumo."],["Por que embrulhar abacate ou banana verde em papel jornal acelera seu amadurecimento?","A folha de jornal aprisiona o gás etileno emitido pelo próprio fruto, elevando a concentração do hormônio e disparando a respiração climatérica.","O etileno gasoso concentrado estimula de forma autocatalítica a sua própria produção e ativa pectinases e amilases."],["O que ocorre quando se estocam caixas de mamão maduro juntas com caixas de brócolis fresco em câmara fria hermética?","O etileno exalado pelos mamões induz a expressão acelerada da enzima clorofilase no brócolis, destruindo a clorofila e amarelando o vegetal em 24-48h.","Para evitar perdas severas, deve-se manter câmaras separadas ou utilizar exaustores com filtros de permanganato de potássio."]]],
["Respiração Celular, Taxa Respiratória e Atmosferas (AC e AM)",`<p>A [[taxa respiratória]] (TR) é o índice metabólico primordial que determina a velocidade de deterioração e a vida de prateleira de frutas e hortaliças colhidas.</p>`+tb(["Reagentes da respiração aeróbica","Produtos gerados","Impacto prático na conservação"],[["Glicose / Sacarose (C6H12O6)","Dióxido de carbono (CO₂)","Consumo contínuo de reservas carbonadas; perda direta de matéria seca e doçura"],["Oxigênio molecular (6 O₂)","Água celular (6 H₂O)","Manutenção do turgor tecidual e respiração mitocondrial"],["Vias glicolítica e Krebs","[[Calor vital]] (673 kcal)","Energia térmica liberada para o ambiente que precisa ser removida pelos compressores frigoríficos"]])+`<h3>A regra térmica do Q10 e pré-resfriamento</h3><p>A velocidade das reações respiratórias enzimáticas varia exponencialmente com a temperatura: a cada <b>redução de 10 °C</b> na temperatura ambiente, a taxa respiratória decai em <b>2 a 3 vezes</b> (Q10 = 2,0 a 3,0). Por isso, produtos de respiração extremamente alta (> 60 mg CO2/kg·h a 5 °C: aspargo, milho doce, espinafre e cogumelo) exigem [[hidroresfriamento]] imediato na colheita (água a 0 °C) para retirar o calor de campo acumulado.</p><h3>Composição gasosa e limites de segurança (AC e AM)</h3>`+tb(["Gás atmosférico","Ar ambiente normal","Faixa ideal de conservação","Limite crítico de risco / Perigo sanitário"],[["Oxigênio (O₂)","21%","1,5% a 5,0%","Abaixo de <b>2,0% (anóxia)</b>: colapso mitocondrial e fermentação anaeróbica (etanol/acetaldeído); risco de germinação letal de <i>[[Clostridium botulinum]]</i>"],["Dióxido de carbono (CO₂)","0,03%","1,0% a 5,0%","Acima de <b>5% a 10%</b>: citotoxicidade direta, desintegração de biomembranas, acidificação citoplasmática e necrose tecidual interna"],["Nitrogênio (N₂)","78%","90% a 95%","Gás inerte de preenchimento em Atmosfera Controlada (AC)"]])+pg([["Achar que retirar 100% do oxigênio de vegetais frescos (vácuo total) é a melhor técnica.","Tirar todo o O₂ força o vegetal vivo à fermentação alcoólica com off-flavors e cria risco letal de botulismo."],["Acreditar que desligar a ventilação de câmaras frias economiza energia sem prejuízo.","Sem ventilação o calor vital acumula-se entre os frutos empilhados, acelerando a respiração e cozinhando o lote."],["Dizer que maçãs e aspargos têm a mesma taxa respiratória sob refrigeração.","Maçã tem respiração baixa (5-10 mg CO2/kg·h) e dura meses; aspargo tem respiração extrema (> 60 mg) e estraga em dias."]]),["Respiração aeróbica libera calor vital e consome açúcar; cada 10 °C a menos derruba a taxa em 2 a 3x (Q10)","O₂ abaixo de 2% causa fermentação anaeróbica com etanol e risco grave de Clostridium botulinum"],"A Atmosfera Controlada (AC) com O₂ baixo (1-2%) conserva maçãs por até um ano em câmara hermética.",[["Qual a importância do conceito de 'calor vital' no dimensionamento de câmaras frias de hortifrúti?","É a energia térmica liberada pela respiração celular aeróbica dos tecidos vegetais vivos que deve ser computada e retirada continuamente pelos compressores.","Se o calor vital não for removido por ventilação adequada, a temperatura do lote sobe, disparando a respiração e cozinhando os frutos."],["O que ocorre quando a concentração de oxigênio em torno de vegetais embalados cai abaixo de 2%?","Ocorre anóxia mitocondrial com migração forçada para fermentação anaeróbica (produzindo etanol e acetaldeído) e risco de botulismo (*C. botulinum*).","A ausência de O₂ em vegetais frescos embalados é perigo sanitário crítico regulamentado pela Anvisa."],["Como a temperatura influencia a taxa respiratória vegetal segundo o coeficiente Q10?","A redução de 10 °C na temperatura ambiente diminui a atividade enzimática respiratória em duas a três vezes (Q10 = 2 a 3).","Resfriar o vegetal funciona como um freio na queima de suas reservas internas de açúcares."]]],
["Dinâmica do Etileno e Alterações Bioquímicas do Amadurecimento",`<p>O [[etileno]] (C2H4) é o fitormônio gasoso mais simples da natureza, ativo em concentrações microscópicas (< 0,01 a 0,1 ppm), regulando amadurecimento, desverdecimento e senescência.</p>`+tb(["Etapa do Ciclo de Yang","Enzima catalisadora","Cofatores e regulação"],[["L-Metionina → SAM","SAM-sintetase","Ativação do aminoácido com consumo de 1 molécula de ATP"],["SAM → ACC","[[ACC-sintase]]","<b>Etapa limitante e regulatória chave</b>; estimulada por injúrias mecânicas, calor e estresse"],["ACC → Etileno (C2H4)","[[ACC-oxidase]]","<b>Depende estritamente de O₂</b>; inibida pelo frio (< 10 °C) e por CO₂ elevado (> 2%)"]])+`<h3>Controle tecnológico do etileno</h3><p>O bloqueio da ação do etileno apoia-se em duas ferramentas consagradas na tecnologia pós-colheita: o <b>[[1-MCP]] (1-metilciclopropeno / SmartFresh)</b>, antagonista competitivo gasoso que se liga irreversivelmente com afinidade 10x maior aos receptores proteicos de etileno da membrana vegetal; e sachês de <b>permanganato de potássio (KMnO4)</b>, sal oxidante que reage com o etileno do ar e o quebra em etilenoglicol e CO₂.</p><h3>As 5 grandes transformações bioquímicas do amadurecimento</h3>`+tb(["Parâmetro de qualidade","Enzimas envolvidas","Mecanismo e alteração físico-química"],[["[[Degradação da clorofila]]","[[Clorofilase]] e Mg-desquelatase","Remoção do fitol e magnésio central gerando feofitina marrom; abertura do anel expõe carotenoides"],["[[Síntese de pigmentos]]","Fitonassintetases e carotenogênese","Síntese de licopeno (tomate), β-caroteno (manga, mamão) e antocianinas (maçã, morango, uva)"],["[[Amolecimento da textura]]","PME e [[poligalacturonase]] (PG)","Desesterificação e hidrólise da pectina da lamela média; solubilização das paredes celulares"],["[[Açúcares e doçura]]","Amilases e glicosidases","Hidrólise do amido insolúvel em glicose, frutose e sacarose; aumento dos sólidos solúveis (°Brix)"],["[[Acidez e aroma]]","Desidrogenases e descarboxilases","Consumo respiratório de ácidos cítrico e málico (eleva o Ratio SST/AT); síntese de voláteis aromáticos (ésteres)"]])+pg([["Achar que o etileno precisa de altas concentrações para agir.","Frações mínimas de ppm (< 0,1 ppm) já disparam o amadurecimento ou deterioração de um armazém inteiro."],["Acreditar que o 1-MCP destrói o etileno do ar.","O 1-MCP liga-se irreversivelmente aos receptores celulares da fruta; quem destrói o gás no ar é o permanganato de potássio."],["Dizer que a goiaba verde amarra a boca por ser ácida.","A adstringência vem dos taninos solúveis livres que precipitam a saliva; ao amadurecer, os taninos polimerizam e deixam de amarrar."]]),["Ciclo de Yang: Metionina → SAM → ACC (ACC-sintase) → Etileno (ACC-oxidase dependente de O₂)","1-MCP bloqueia os receptores celulares de etileno; permanganato de potássio oxida o gás no ar"],"Aspargos deitados sofrem geotropismo negativo: curvam-se para cima e sintetizam lignina dura como madeira.",[["Descreva a via biossintética do etileno nas plantas superiores (Ciclo de Yang).","L-metionina é ativada em SAM pela SAM-sintetase; a ACC-sintase cliva SAM em ACC (etapa limitante); a ACC-oxidase cliva ACC liberando etileno na presença de O₂.","Injúrias mecânicas e calor estimulam a ACC-sintase; a ACC-oxidase exige oxigênio e é inibida por CO₂."],["Qual a diferença de mecanismo entre o 1-metilciclopropeno (1-MCP) e o permanganato de potássio (KMnO4)?","O 1-MCP liga-se aos receptores celulares bloqueando a transdução do sinal hormonal; o permanganato de potássio atua como oxidante no ar destruindo o etileno gasoso.","O 1-MCP age no tecido vegetal; o KMnO4 age na atmosfera da embalagem ou câmara frigorífica."],["Quais modificações enzimáticas são responsáveis pelo amolecimento e perda de adstringência de frutos climatéricos?","A pectinametilesterase (PME) e a poligalacturonase (PG) solubilizam as pectinas da lamela média amolecendo a polpa; a polimerização de taninos elimina a adstringência.","Ao mesmo tempo, as amilases convertem amido insolúvel em açúcares solúveis simples (°Brix)."]]],
["Escurecimento Enzimático, Desordens Fisiológicas e Boas Práticas",`<p>O [[escurecimento enzimático]] e as desordens fisiológicas térmicas constituem as maiores fontes de perdas e depreciação comercial em frutas e hortaliças no pré-preparo e varejo.</p>`+tb(["Etapa do escurecimento enzimático","Enzima e cossubstrato","Reação química e produto"],[["1. Hidroxilação monofenólica (cresolase)","[[Polifenoloxidase]] (PPO, íons Cu²⁺) + O₂","Monofenol incolor é hidroxilado em <i>o</i>-difenol"],["2. Desidrogenação difenólica (catecolase)","Polifenoloxidase (PPO) + O₂","<i>o</i>-difenol é oxidado em <i>o</i>-quinona reativa"],["3. Polimerização não enzimática secundária","Espontânea (sem enzima)","<i>o</i>-quinonas condensam-se entre si e com aminoácidos gerando [[melaninas]] insolúveis marrons"]])+`<h3>Controle culinário e industrial da PPO</h3><p>No vegetal íntegro, a PPO está confinada nos plastídeos e os compostos fenólicos no vacúolo. O corte ou pancada rompe as membranas e coloca a enzima em contato com os fenóis e o O₂ do ar. Estratégias consagradas de inibição: <b>calor</b> (branqueamento > 70 °C desnatura a PPO); <b>acidificação</b> (ácido cítrico do limão joga o pH para < 3,5, inativando a enzima); <b>agentes redutores</b> (vitamina C reduz quinonas de volta a difenóis incolores); e <b>exclusão de O₂</b> (imersão em água ou vácuo).</p><h3>Desordens Fisiológicas Térmicas e Nutricionais</h3>`+tb(["Desordem fisiológica","Faixa térmica / Causa","Mecanismo celular e sintomas visuais"],[["[[Chilling Injury]] (Injúria pelo frio)","Temperaturas baixas de <b>5 °C a 15 °C</b> (acima do congelamento) em frutos tropicais (banana, mamão, tomate)","Transição de fase dos lipídeos de membrana de cristalino fluido para gel rígido; perda de seletividade extravasa PPO sobre fenóis (casca de banana preta acinzentada)"],["[[Freezing Injury]] (Congelamento)","Temperaturas inferiores a <b>0 °C a -2 °C</b> (ponto crioscópico)","Macrocristais de gelo laceram mecanicamente as paredes celulares e membranas; alface descongelada desmancha em pasta aquosa translúcida"],["[[Podridão estilar do tomate]] (BER)","Deficiência localizada de cálcio nos tecidos em rápido crescimento","Falta de Ca²⁺ enfraquece a pectina parietal da lamela média ('caixa de ovos'); colapso necrótico achatado preto no fundo do fruto"],["[[Solanina em batatas]]","Exposição à luz em gôndolas de supermercado","A radiação estimula a síntese de clorofila (casca verde) e do glicoalcaloide termoestável solanina (inibidor tóxico da acetilcolinesterase)"]])+`<h3>Boas Práticas Pós-Colheita e Processamento Mínimo</h3><p>Colheita nas primeiras horas da manhã (menor calor de campo e máxima turgidez); substituição de caixas de madeira ásperas por caixas plásticas higienizáveis com cantos arredondados; e calibragem rigorosa da <b>centrifugação de folhosas</b> (remover água livre externa sem expulsar a seiva celular nem rasgar tecidos).</p>`+pg([["Regra prática de cozinha: colocar banana na geladeira para conservar mais tempo.","Banana sofre Chilling Injury abaixo de 10 °C: a membrana lipídica colapsa e a PPO oxida os fenóis, deixando a casca preta."],["Achar que podridão estilar (fundo preto do tomate) é fungo contagioso.","É desordem nutricional por carência de cálcio que desamarra a pectina da parede celular."],["Acreditar que cozinhar batata esverdeada destrói a solanina tóxica.","A solanina é um glicoalcaloide termoestável que resiste à fervura e fritura; descarte ou descasque profundamente."]]),["PPO plastidial oxida fenóis vacuolares na presença de O₂; limão inativa por pH < 3,5 e vitamina C redutora","Chilling Injury (5-15 °C) em tropicais colapsa membranas lipídicas; Freezing Injury (< 0 °C) perfura células com gelo"],"Centrifugar salada higienizada é obrigatório: folha molhada apodrece; mas centrifugação bruta rasga a folha.",[["Explique o mecanismo bioquímico do escurecimento enzimático catalisado pela polifenoloxidase (PPO).","A PPO plastidial com íons Cu²⁺ catalisa a hidroxilação de monofenóis e oxidação a o-quinonas na presença de O₂; as quinonas polimerizam em melaninas marrons.","A reação só ocorre quando cortes ou injúrias rompem plastídeos e vacúolos, expondo a enzima aos compostos fenólicos e ao oxigênio."],["Por que espremer suco de limão fresco sobre maçã cortada ou guacamole impede o escurecimento?","O ácido cítrico reduz o pH abaixo de 3,5 inativando a conformação da PPO; simultaneamente, a vitamina C atua como redutor revertendo quinonas a difenóis incolores.","Essa dupla ação ataca a enzima pela acidez e neutraliza quimicamente os intermediários reativos."],["Qual a diferença entre Chilling Injury e Freezing Injury em produtos hortícolas?","Chilling ocorre acima do congelamento (5-15 °C) por enrijecimento de membranas lipídicas em tropicais; Freezing ocorre abaixo de 0 °C por cristais de gelo que perfuram as paredes.","No Chilling há manchas necróticas e perda de aroma; no Freezing há sinérese completa com perda total de turgor."]]]];

[[4],"Um comprador adquire 50 caixas de mangas 'Tommy Atkins' no ponto verde de vez e as estoca em câmara fria ajustada a 3 °C por três semanas. Ao retirar os lotes para o setor de corte à temperatura ambiente (25 °C), nota que as cascas apresentam manchas marrons deprimidas com aspecto de encharcamento hídrico, polpa amolecida e perda completa do aroma característico. Qual fenômeno fisiológico ocorreu?",["Injúria por congelamento (Freezing Injury) por cristalização de água","Injúria pelo frio (Chilling Injury) desencadeada por temperatura abaixo do limite crítico da espécie tropical (10 °C a 13 °C), desorganizando membranas lipídicas","Contaminação biológica anaeróbica por Clostridium botulinum","Aceleração prematura do ciclo de Yang pelo frio"],1,"Trata-se de [[Chilling Injury]]: mangas são de origem tropical e sofrem dano por frio abaixo de 10-12 °C. O colapso das membranas liberou enzimas PPO sobre fenóis vacuolares, manifestando necrose ao retornar à temperatura ambiente."],
[[4],"Em uma residência, a alface fresca foi encostada na placa fria do fundo do refrigerador doméstico, onde a temperatura atinge -2 °C. Horas depois, a cozinheira retira as folhas e constata que elas ficaram escuras, com consistência de pasta aquosa translúcida e desmancham ao toque. Por que as folhosas não recuperam a crocância após esse evento?",["Ocorreu Injúria por Congelamento (Freezing Injury): macrocristais de gelo laceraram mecanicamente as paredes celulares e membranas plasmáticas, expulsando a água celular sem possibilidade de restauração da turgidez","A alface realizou síntese excessiva de lignina tornando-se lenhosa","O etileno converteu a clorofila em solanina na folha","O frio destruiu as mitocôndrias da alface por glicólise anaeróbica"],0,"Trata-se de [[Freezing Injury]]: temperaturas abaixo de 0 °C formam cristais de gelo que rasgam mecanicamente as paredes celulares e tonoplastos. Ao descongelar, toda a água intracelular extravasa e a folha perde a pressão de turgor."],
[[4],"Um produtor de tomate em cultivo protegido relata que 35% de seus frutos estão apresentando uma grande mancha circular preta achatada e seca no ápice distal (pólo oposto ao pedúnculo), apesar da irrigação estar regular e da ausência de pragas foliares. Qual a causa do distúrbio e a correção adequada?",["Infecção por vírus do mosaico do tomateiro; exige queima da lavoura","Podridão apical ou estilar (Blossom-End Rot), causada por deficiência localizada de cálcio nas células do ápice em rápido crescimento; requer correção de cálcio e balanceamento iônico do solo","Excesso de fertilização fosfatada que cristalizou em fitato no fundo do fruto","Injúria por calor pelo sol incidindo diretamente no fruto"],1,"Trata-se de [[podridão estilar do tomate]] (BER): o cálcio é transportado lentamente pelo xilema via transpiração. Em fases de crescimento rápido, a falta de $Ca^{2+}$ impede a formação da rede de pectina parietal, gerando necrose celular localizada."],
[[4],"Um cozinheiro rala maçãs e peras cruas para uma sobremesa e nota que a polpa escurece intensamente em menos de 3 minutos. Em outra bancada, o chef escalda as fatias de maçã em água fervente a 90 °C por 2 minutos antes de triturá-las, obtendo um purê claro que se mantém límpido por dias. Qual a justificativa bioquímica do contraste?",["A água fervente dissolveu todos os compostos fenólicos da maçã no caldo","O aquecimento a 90 °C provocou a desnaturação térmica irreversível da polifenoloxidase (PPO), impedindo a oxidação enzimática dos fenóis em quinonas","O cozimento a quente estimulou a síntese de antocianinas vermelhas protetoras","A fervura eliminou o oxigênio celular por fotossíntese reversa"],1,"A [[polifenoloxidase]] (PPO) é uma proteína enzimática termossensível. O tratamento térmico (branqueamento acima de 70-80 °C) desnatura irreversivelmente seu sítio catalítico, paralisando a oxidação de fenólicos."],
[[3],"Uma agroindústria de maçãs 'Gala' aplica gás 1-metilciclopropeno (1-MCP) na dosagem de 1 ppm por 24 horas no interior de câmaras frias herméticas recém-carregadas. Meses depois, as maçãs mantêm firmeza de polpa de 16 libras e taxas respiratórias extremamente baixas, mesmo quando expostas a teores residuais de etileno. Qual o mecanismo molecular desse efeito?",["O 1-MCP quebra as moléculas de glicose impedindo a respiração celular","O 1-MCP possui afinidade 10 vezes maior que o etileno pelos receptores proteicos de membrana, ligando-se irreversivelmente e bloqueando a transcrição de pectinases e amilases","O 1-MCP atua como sal oxidante destruindo a pectinametilesterase da casca","O composto sequestra o íon cobre da polifenoloxidase"],1,"O [[1-MCP]] mimetiza a estrutura do etileno e liga-se de forma irreversível e com altíssima afinidade aos receptores hormonais da membrana celular, impedindo que o etileno exógeno ou endógeno ative a expressão de enzimas degradativas."],
[[3],"Um produtor de aspargos verdes colhe hastes frescas túrgidas e macias e as transporta deitadas horizontalmente em caixas rasas secas a 24 °C por 3 dias. Ao preparar o vegetal, o cliente reclama que as hastes encurvaram para cima como anzóis e ficaram duras como pedaços de madeira. Qual a base fisiológica dessa deterioração?",["O aspargo sofreu ataque de bactérias pectinolíticas que endureceram o caule","As pontas meristemáticas mantiveram crescimento ativo com geotropismo negativo, curvando-se contra a gravidade e ativando a rota fenilpropanoide de lignificação das paredes celulares","A desidratação superficial converteu o amido em sacarose dura","Ocorreu acúmulo de solanina no caule por falta de refrigeração"],1,"Aspargos mantêm crescimento meristemático vigoroso pós-colheita; quando deitados, respondem à gravidade curvando-se para cima e ativando a rota de lignificação parietal, tornando as hastes fibrosas e lenhosas."],
[[2],"Uma rede de lanchonetes compra alfaces e cenouras picadas higienizadas e armazena os sacos plásticos totalmente fechados sem microporos a 28 °C no estoque seco. Dois dias depois, ao abrir as embalagens, os funcionários sentem odor fétido e pungente similar a vinagre e cachaça, e o vegetal apresenta textura gosmenta. Qual o colapso respiratório ocorrido?",["A respiração aeróbica elevou o teor de O2 para 50% causando combustão interna","O consumo de oxigênio pelas células vegetais reduziu o O2 para < 1%, forçando o tecido à respiração anaeróbica fermentativa com acúmulo de etanol e acetaldeído, além de favorecer bactérias anaeróbicas","A cenoura sintetizou licopeno em excesso que fermentou em meio aquoso","As células sofreram Chilling Injury precoce"],1,"Em embalagens herméticas sem permeabilidade adequada sob temperatura alta, o vegetal consome todo o oxigênio ($O_2 < 1\%$). Sob anóxia, as células migram para a fermentação anaeróbica gerando etanol, acetaldeído e off-flavors."],
[[1],"Um tecnólogo de alimentos projeta uma câmara frigorífica mista para um entreposto atacadista e sugere armazenar bananas em climatério, mamões papaia maduros, caixas de alface crespa e maços de brócolis na mesma antecâmara a 14 °C para economizar espaço físico. Qual a crítica técnica obrigatória a esse projeto?",["A temperatura de 14 °C congelará as folhas de alface em poucas horas","O etileno gasoso liberado intensamente pelas frutas climatéricas (banana e mamão) provocará o rápido desverdecimento e senescência das hortaliças folhosas, induzindo a enzima clorofilase e amarelando alfaces e brócolis em 24 a 48 horas","As hortaliças verdes liberarão oxigênio que queimará a casca do mamão","Não há qualquer problema, pois vegetais folhosos não possuem receptores hormonais"],1,"Folhosas verdes e brócolis são hipersensíveis ao [[etileno]]. Quando expostos ao etileno exalado por frutos climatéricos, sofrem desverdecimento acelerado por degradação enzimática da clorofila, inviabilizando sua comercialização."],
[[4],"Na gôndola de um supermercado, vários quilos de batatas inglesas permanecem sob iluminação fluorescente intensa por 10 dias. O lote desenvolve tonalidade verde-clara na casca e na polpa subepidérmica, e os consumidores relatam sabor acentuadamente amargo e queimação bucal após o consumo. Qual o risco toxicológico desse alimento?",["As batatas foram contaminadas com cloreto de cálcio que precipitou na casca","A radiação luminosa estimulou simultaneamente a síntese de clorofila (verde) e do glicoalcaloide termoestável solanina, substância amarga e neurotóxica inibidora da acetilcolinesterase que resiste ao cozimento comum","O amido da batata sofreu adoçamento induzido pelo frio","O esverdeamento é inofensivo e indica aumento de vitamina C"],1,"A exposição de batatas à luz estimula a síntese de clorofila e do glicoalcaloide tóxico [[solanina]]. Por ser termoestável, a solanina não é degradada pela fervura e pode causar intoxicações gastrointestinais e neurológicas severas."],
[[0],"Em uma Unidade de Alimentação e Nutrição (UAN), o nutricionista observa que a alface sanitizada e lavada em água clorada apodrece no fundo das bandejas plásticas na geladeira em menos de 24 horas. Ao auditar o pré-preparo, constata que as cozinheiras pulam a etapa de centrifugação na secadora de saladas para ganhar tempo. Qual a correção técnica obrigatória?",["Substituir o hipoclorito de sódio por vinagre puro","Tornar mandatória a secagem por centrifugação mecânica calibrada das folhas, eliminando a lâmina de água livre superficial que favorece a rápida multiplicação bacteriana e fúngica sob refrigeração","Aquecer a alface a 70 °C antes de refrigerar","Armazenar a alface mergulhada em água com gelo"],1,"A permanência de água residual de lavagem cria microambientes com atividade de água superficial máxima, favorecendo a proliferação acelerada de microrganismos deteriorantes. A centrifugação calibrada é Ponto Crítico de Controle no pré-preparo de folhosas."]
