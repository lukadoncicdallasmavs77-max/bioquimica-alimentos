<script>
// ===== CONTEÚDO (base: slides da aula + livro) =====
const T=[
["O que é vitamina",`<p>O termo surgiu em <b>1912</b> com Casimir Funk (<i>vita</i> + <i>amina</i>). [[Vitaminas]] são compostos orgânicos e bioativos, necessários em <b>microquantidades</b>, que o corpo não sintetiza em quantidade suficiente e que atuam como [[coenzimas]] no crescimento e no metabolismo. Não fornecem calorias.</p><div class=w><table><tr><th></th><th>Lipossolúveis (A, D, E, K)</th><th>Hidrossolúveis (B e C)</th></tr><tr><td>Absorção</td><td>Junto com gorduras</td><td>Fração hidrofílica do alimento</td></tr><tr><td>Estoque</td><td>Fígado e tecido adiposo</td><td>Quase nulo (exceto B12)</td></tr><tr><td>Excreção</td><td>Fezes/bile</td><td>Urina</td></tr><tr><td>Toxicidade</td><td>Maior risco em excesso</td><td>Rara</td></tr></table></div><p class=n>Regra de ouro: nenhum alimento isolado fornece todas as vitaminas. O escorbuto (Cartier, 1536; Lind, 1753) mostrou que a falta de um único composto destrói tecidos.</p>`,["Vitaminas: orgânicas, em microquantidades e atuando como coenzimas","Lipo: estocadas, risco de excesso. Hidro: urina (B12 é exceção)"],"Hidrossolúveis quase não são estocadas, mas a B12 é a exceção.",[["Cite 3 características de uma vitamina.","Orgânica e bioativa, necessária em microquantidades, não sintetizada em quantidade suficiente e com função de [[coenzima]]."],["Por que a toxicidade é mais rara nas hidrossolúveis?","Quase não são armazenadas e o excesso sai pela urina. As lipossolúveis ficam no fígado e no tecido adiposo."],["O que o escorbuto ensinou?","Que a ausência de um único composto em microquantidades (hoje, a vitamina C) pode destruir tecidos."]]],
["Lipossolúveis: A, D, E, K",`<p>A matriz oleosa protege essas vitaminas; a presença de antioxidantes no alimento as resguarda da degradação.</p><div class=w><table><tr><th>Vit.</th><th>Química e fontes</th><th>Funções</th><th>Perdas</th></tr><tr><td>A</td><td>Retinoides: retinol (CH₂OH), retinal (CHO), ácido retinoico (COOH). Fígado, leite; β-caroteno em cenoura, brócolis, agrião</td><td>Atividade de retinoide; 6 µg de β-caroteno = 1 µg de retinol (3,33 UI)</td><td>Oxidação, luz UV, calor, Fe²⁺ e Cu²⁺ (duplas conjugadas)</td></tr><tr><td>D</td><td>D2 (ergocalciferol): cogumelos e leveduras. D3 (colecalciferol): peixes gordurosos, fígado, gema</td><td>UVB + 7-dehidrocolesterol → D3 → fígado (25-OH) → rim (1,25-di-OH, [[calcitriol]])</td><td>Oxidação e isomerização; mais estável que a A</td></tr><tr><td>E</td><td>Tocoferóis e tocotrienóis (α, β, γ, δ). Óleos vegetais (α e γ), castanhas, cereais integrais</td><td>Antioxidante: interrompe a [[peroxidação lipídica]]; regenerada pela vitamina C</td><td>Oxigênio, luz, metais; relativamente estável ao calor</td></tr><tr><td>K</td><td>K1 filoquinona (vegetais), K2 menaquinona (fermentados, microbiota), K3 menadiona (sintética)</td><td>Coagulação; fixação de Ca no osso; evita Ca em vasos (K2: tecidos extra-hepáticos, maior meia-vida)</td><td>Fotossensível; estável ao calor e O₂</td></tr></table></div><p class=n>Meio alcalino destrói especificamente E e K. Para minimizar perdas: vácuo ou atmosfera modificada, abrigo da luz, controle de tempo × temperatura, matriz lipídica e evitar [[pró-oxidantes]].</p>`,["A: sensível a O₂, UV, calor e metais; 6 µg β-caroteno = 1 µg retinol","E interrompe a peroxidação lipídica e é regenerada pela vitamina C"],"A luz solar gera D3 na pele, nunca D2. E e K caem em meio alcalino.",[["Como o corpo forma e ativa a D3?","UVB converte o 7-dehidrocolesterol em D3; o fígado forma 25-OH-D e o rim forma o [[calcitriol]]."],["Qual a origem de D2 e D3?","D2 é vegetal/fúngica (cogumelos, leveduras); D3 é animal (peixes gordurosos, fígado, gema) e formada na pele."],["Por que a vitamina E aumenta a vida de prateleira?","Por ser antioxidante, interrompe a [[peroxidação lipídica]]."],["Diferencie K1, K2 e K3.","K1: vegetal, coagulação. K2: fermentados e microbiota, ossos, maior meia-vida. K3: sintética."]]],
["Hidrossolúveis: complexo B",`<p>Três grupos: <b>liberadoras de energia</b> (B1, B2, B3, B5, B7), <b>hematopoiéticas</b> (B9, B12) e <b>outras</b> (B6 e C). Têm baixo peso molecular e não fornecem calorias.</p><div class=w><table><tr><th>Vit.</th><th>Forma/coenzima</th><th>Função</th><th>Estabilidade e dicas</th></tr><tr><td>B1 tiamina</td><td>Pirofosfato de tiamina</td><td>Descarboxilação (glicólise, Krebs)</td><td>Cereais integrais, carne suína</td></tr><tr><td>B2 riboflavina</td><td>FMN, FAD</td><td>Transporte de elétrons</td><td>Fotossensível (leite em garrafa transparente); resiste à pasteurização</td></tr><tr><td>B3 niacina</td><td>NAD⁺, NADP⁺</td><td>Oxirredução; formada do triptofano</td><td>Muito estável; falta causa pelagra</td></tr><tr><td>B5 pantotênico</td><td>Coenzima A</td><td>Síntese e oxidação de ácidos graxos</td><td>Onipresente</td></tr><tr><td>B6 piridoxina</td><td>Piridoxal fosfato</td><td>Transaminação; hemoglobina</td><td>Estável ao calor e ácido, instável à luz; perda de 3% (pasteurizado) e 5% (UHT)</td></tr><tr><td>B7 biotina</td><td>Biocitina</td><td>Carboxilações (piruvato carboxilase)</td><td>Estável a calor, luz, O₂, pH 5–8; [[avidina]] da clara crua a inativa; perde por lixiviação</td></tr><tr><td>B9 ác. fólico</td><td>Tetra-hidrofolato</td><td>Unidades de 1 carbono; DNA e RNA</td><td>Falta: [[anemia megaloblástica]] e defeitos do tubo neural</td></tr><tr><td>B12 cobalamina</td><td>Ciano- ou metilcobalamina (Co)</td><td>Formação de células sanguíneas</td><td>Estável em pH 4–6; destruída por luz, ácidos, bases; fontes animais</td></tr></table></div>`,["Energia: B1, B2, B3, B5, B7. Sangue: B9 e B12. Outras: B6 e C","Avidina inativa a biotina; B2 e B12 são sensíveis à luz"],"Clara de ovo crua: a [[avidina]] deixa a biotina indisponível.",[["Qual vitamina a [[avidina]] inativa?","A biotina (B7), quando a clara está crua."],["Qual a deficiência de niacina e o papel do triptofano?","Pelagra (dermatite, diarreia e demência); a niacina pode ser formada do triptofano."],["Por que embalagem transparente prejudica o leite?","A riboflavina é fotossensível e a luz a degrada, embora resista à pasteurização."],["Por que suplementar B9 antes e no início da gestação?","Sua falta causa defeitos do tubo neural e [[anemia megaloblástica]]."]]],
["Vitamina C",`<p>O ácido ascórbico é oxidado de duas formas:</p><div class=w><table><tr><th>Via</th><th>Produto</th><th>Causas</th></tr><tr><td>Reversível</td><td>[[Dehidroascórbico]] (perda parcial)</td><td>Íons metálicos, calor, luz, pH acima de 6,0</td></tr><tr><td>Irreversível</td><td>Ácido 2,3-dicetogulônico (perda de atividade)</td><td>Íons metálicos, baixa umidade</td></tr></table></div><p>Fontes (mg/100 g): goiaba 200, brócolis 150, limão 80, couve-flor 60, morango 60, laranja 50. Regenera a vitamina E.</p><p class=n>Pós-colheita: a [[ascorbato oxidase]] aumenta durante o armazenamento a 20 °C e a vitamina C cai.</p>`,["C oxida reversivelmente a dehidroascórbico e irreversivelmente a dicetogulônico","Armazenar fruta ativa enzimas que consomem a C"],"Acima de pH 6,0 a oxidação da C acelera.",[["O que ocorre na oxidação da vitamina C?","Reversível: ao [[dehidroascórbico]] (metais, calor, luz, pH acima de 6). Irreversível: ao 2,3-dicetogulônico, sem atividade."],["Por que a C cai na fruta armazenada?","A [[ascorbato oxidase]] fica ativa e consome a vitamina."],["Que relação a C tem com a E?","Regenera a vitamina E."]]],
["Perdas e conservação",`<p>Fatores: calor, luz, oxigênio e <b>[[lixiviação]]</b>. A perda começa na produção (cultivar, clima, maturação), piora na pós-colheita (enzimas oxidativas e hidrolíticas) e continua no varejo (oscilação térmica e luz UV).</p><div class=w><table><tr><th>Processo</th><th>Mecanismo</th><th>Mais afetadas</th></tr><tr><td>Secagem</td><td>Mais área exposta ao O₂</td><td>Lipossolúveis e C</td></tr><tr><td>Cocção úmida/branqueamento</td><td>Lixiviação</td><td>Todas as hidrossolúveis</td></tr><tr><td>Calor extremo</td><td>Degradação térmica</td><td>Complexo B (esterilização &gt; pasteurização)</td></tr><tr><td>pH/aditivos</td><td>Meio alcalino, bicarbonato (SO₂ também interfere)</td><td>E e K</td></tr></table></div><h3>Como minimizar perdas (hidrossolúveis)</h3><ul><li>Pouca água no cozimento; evitar cortes muito pequenos</li><li>Evitar reaquecimentos e guardar comida já cozida</li><li>Pouco tempo de aquecimento nos processados</li><li>Sem bicarbonato para manter o verde</li><li>Embalagem opaca, longe de calor extremo</li></ul><p class=n><b>Três mandamentos:</b> a solubilidade dita a regra; calor, O₂, UV e pH controlam a estabilidade; a variedade alimentar é inegociável.</p>`,["Cocção úmida: lixiviação das hidrossolúveis","Secagem: oxidação de lipossolúveis e C"],"Esterilização comercial prejudica mais o complexo B que a pasteurização.",[["Por que a cocção úmida atinge todas as hidrossolúveis?","Pela [[lixiviação]]: a água as solubiliza e arrasta."],["Por que secar prejudica lipossolúveis e C?","Aumenta a área exposta ao O₂ e favorece a oxidação."],["Cite 4 práticas para reduzir perdas de hidrossolúveis.","Pouca água, evitar reaquecimento e guarda após cozimento, sem bicarbonato, embalagem opaca, cortes maiores."],["Quais são os 3 mandamentos?","Solubilidade dita a regra; calor, O₂, UV e pH controlam a estabilidade; variedade alimentar é inegociável."]]]];
const G={"vitaminas":["Compostos orgânicos em microquantidades, essenciais, de dependência externa.",0],"coenzimas":["Moléculas derivadas de vitaminas que ajudam enzimas (FAD, NAD⁺, CoA).",0],"calcitriol":["Forma ativa da D: 1,25-di-hidroxivitamina D, formada no rim.",1],"peroxidação lipídica":["Oxidação em cadeia de lipídeos; a vitamina E a interrompe.",1],"pró-oxidantes":["Fe²⁺ e Cu²⁺ aceleram a oxidação das vitaminas.",1],"avidina":["Proteína da clara crua que se liga à biotina no intestino.",2],"anemia megaloblástica":["Falta de B9 (ou B12) impede a síntese de DNA e a divisão celular.",2],"dehidroascórbico":["Forma oxidada reversível da vitamina C.",3],"ascorbato oxidase":["Enzima que degrada a vitamina C na fruta armazenada.",3],"lixiviação":["Solubilização e arraste de vitaminas pela água de cozimento.",4]};
const F=[[0,"Quem criou o termo vitamina e quando?","Casimir Funk, 1912 (vita + amina)."],[0,"Qual hidrossolúvel é estocada?","A B12."],[1,"Conversão do β-caroteno?","6 µg de β-caroteno = 1 µg de retinol."],[1,"Vitamina que o meio alcalino destrói?","E e K."],[1,"Qual vitamina regenera a E?","A vitamina C."],[2,"Coenzimas da B2?","FMN e FAD."],[2,"Deficiência de B3?","Pelagra (3 D)."],[2,"Vitamina inativada pela avidina?","Biotina (B7)."],[3,"Forma reversível da oxidação da C?","Ácido dehidroascórbico."],[3,"Fonte de C mais rica da tabela?","Goiaba, 200 mg/100 g."],[4,"Mecanismo da perda na cocção úmida?","Lixiviação."],[4,"Processo mais crítico para o complexo B?","Calor extremo (esterilização)."]];
const M=[[[0],"Qual característica separa as vitaminas hidrossolúveis?",["Estoque no fígado","Excreção urinária e quase nenhum estoque","Absorção com gorduras","Maior risco de toxicidade"],1,"Hidrossolúveis são excretadas na urina; B12 é a exceção ao estoque."],[[1],"6 µg de β-caroteno equivalem a:",["1 µg de retinol","6 µg de retinol","3 µg de retinol","10 µg de retinol"],0,"A taxa é 6:1 (1 µg = 3,33 UI)."],[[1],"Qual forma de D é produzida na pele?",["D2","D3","K2","25-OH apenas"],1,"UVB sobre o 7-dehidrocolesterol gera D3."],[[1,4],"Qual par é destruído por meio alcalino?",["A e D","E e K","B1 e B2","C e B12"],1,"Meio alcalino e bicarbonato destroem E e K."],[[2],"A clara crua prejudica qual vitamina?",["B6","Biotina","B12","Niacina"],1,"A avidina inativa a biotina."],[[2],"Falta de B9 causa:",["Pelagra","Escorbuto","Anemia megaloblástica","Raquitismo"],2,"Sem B9 não há síntese de DNA nem divisão celular."],[[3,1],"Qual vitamina regenera a E?",["B6","K","C","A"],2,"A vitamina C regenera a E oxidada."],[[3,4],"Por que a fruta armazenada perde C?",["Lixiviação","A ascorbato oxidase a consome","Falta de luz","Pasteurização"],1,"Enzimas ativas após a colheita consomem a C."],[[4,2],"Leite em garrafa transparente perde qual vitamina?",["B3","B5","B2","B7"],2,"A riboflavina é fotossensível."],[[4],"Qual processo causa lixiviação?",["Secagem","Cocção úmida","Embalagem a vácuo","Refrigeração"],1,"A água solubiliza e arrasta as hidrossolúveis."]];

// ===== ETAPA 1: aprofundamento, glossário, feedback, simulado =====
const X=[`<h3>Aprofundando</h3><p>As [[lipossolúveis]] vêm associadas à fração lipídica e são absorvidas junto com os lipídeos da dieta; ficam estocadas no tecido adiposo e no fígado, o que explica o risco de acúmulo. As [[hidrossolúveis]] acompanham a fração aquosa, têm baixo peso molecular, exigem suprimento diário e o excesso sai pela urina.</p><p>O teor de vitaminas de um alimento depende da variedade/cultivar, do clima, da maturação, das práticas agrícolas e, nos animais, da ração, e ainda sofre as perdas da pós-colheita, do processamento e do varejo (último tópico).</p>`,`<h3>Aprofundando</h3><p><b>Vitamina A.</b> Os [[retinoides]] têm anel β-ionona e cadeia com duplas ligações conjugadas, o ponto vulnerável: a oxidação e os [[radicais livres]] atacam essa cadeia, e a luz UV, o calor e metais como Fe²⁺ e Cu²⁺ aceleram a degradação. Vegetais não têm retinol pronto (a tabela mostra 0 na cenoura), e sim [[carotenoides]] como o β-caroteno, convertidos em retinol na taxa de 6 µg para 1 µg.</p><p><b>Vitamina D.</b> D2 e D3 são esteróis que diferem na cadeia lateral. A exposição excessiva à luz degrada a molécula (oxidação e [[isomerização]]), mas ela é mais estável que a A.</p><p><b>Vitamina E.</b> Sua ação antioxidante vem de doar um hidrogênio fenólico e um elétron aos radicais, o que interrompe a [[peroxidação lipídica]]. É sensível a O₂ e luz e relativamente estável ao calor; por isso contribui com a estabilidade oxidativa (shelf life) dos óleos.</p><p><b>Vitamina K.</b> A [[filoquinona]] (K1) é vegetal, a [[menaquinona]] (K2) vem da microbiota e de fermentados e a [[menadiona]] (K3) é sintética. A K1 se relaciona mais à coagulação e a K2 ao metabolismo ósseo, com maior meia-vida; ambas evitam a deposição de Ca nos vasos.</p>`,`<h3>Aprofundando</h3><p><b>B1 ([[tiamina]]).</b> Coenzima das descarboxilações da glicólise e do ciclo de Krebs. Como hidrossolúvel, sofre lixiviação e é degradada por UV e por [[sulfitos]] (dióxido de enxofre).</p><p><b>B2 ([[riboflavina]]).</b> Origem de FMN e FAD, essenciais ao transporte de elétrons. É fotossensível: a luz a converte em [[lumiflavina]], o que explica a perda no leite em garrafa transparente. Resiste à pasteurização e dá a cor amarelada do leite; meio alcalino e bicarbonato a degradam.</p><p><b>B3 ([[niacina]]).</b> Forma NAD⁺ e NADP⁺ e pode ser sintetizada a partir do [[triptofano]], então depende da qualidade proteica da dieta; sua falta causa [[pelagra]]. É uma das vitaminas mais estáveis (calor, luz, ácidos, álcalis).</p><p><b>B6.</b> O piridoxal fosfato atua em transaminações e na síntese da hemoglobina. O [[piridoxal]] reage com grupos NH das proteínas e perde a atividade; é estável ao calor e em meio ácido, mas instável à luz em meio neutro ou alcalino (leite pasteurizado perde 3%, UHT 5%).</p><p><b>B7, B9 e B12.</b> A [[biotina]] é cofator de carboxilases, como a piruvato carboxilase, e é estável ao calor, à luz e ao O₂. O tetra-hidrofolato (B9) transfere unidades de um carbono para a síntese de DNA e RNA. A [[cobalamina]] contém cobalto, é destruída pela luz e é a exceção ao “quase nenhum estoque” dos hidrossolúveis.</p>`,`<h3>Aprofundando</h3><p>O ácido ascórbico é muito polar e, por isso, muito solúvel em água, o que o deixa vulnerável à lixiviação no pré-preparo de frutas e hortaliças. Íons metálicos (Cu²⁺ e Fe²⁺), calor, luz, condições levemente alcalinas (acima de pH 6,0) e enzimas como a ascorbato oxidase aceleram sua oxidação a [[dehidroascórbico]], que ainda pode ser regenerado; a hidrólise seguinte forma o ácido 2,3-dicetogulônico, sem atividade.</p><p>Na pós-colheita, a atividade da [[ascorbato oxidase]] cresce com os dias de estocagem a 20 °C enquanto o teor de C despenca. A vitamina C também regenera a vitamina E oxidada.</p>`,`<h3>Aprofundando</h3><p>A estabilidade de cada vitamina depende de combinações de pH, oxigênio, metais, luz e temperatura. As lipossolúveis tendem a acompanhar a estabilidade dos lipídeos que as carregam (daí a importância da [[matriz lipídica]] e de evitar pró-oxidantes); as hidrossolúveis sofrem principalmente por lixiviação, calor e pH.</p><p>Na prática: o [[branqueamento]] e a fervura arrastam hidrossolúveis para a água; o [[bicarbonato de sódio]] mantém o verde, mas degrada vitaminas como E, K e riboflavina; a [[esterilização comercial]] causa mais perdas que a [[pasteurização]] (no leite, a B6 perde cerca de 3% na pasteurização e 5% no UHT). Pensar no mecanismo (área exposta, solubilidade, pH, luz) ajuda a prever qual vitamina cai em cada processo.</p>`];

o; sensível à luz; fontes animais; pode ser estocada.",2],"piridoxal":["Forma da B6 do leite; pouco estável ao calor.",2],"sulfitos":["Aditivos que preservam a vitamina C, mas degradam a tiamina.",2],"bicarbonato de sódio":["Alcaliniza o meio: degrada a riboflavina e acelera a oxidação da vitamina C.",4],"branqueamento":["Cocção rápida em água quente; causa lixiviação de hidrossolúveis.",4],"pasteurização":["Tratamento térmico brando; perde menos vitaminas que a esterilização.",4],"esterilização comercial":["Calor intenso; maior perda de vitaminas, sobretudo do complexo B.",4],"fotossensível":["Que se degrada pela luz.",4]});

const TM=[
["O que são minerais e como classificar",`<p>[[Minerais]] são elementos inorgânicos essenciais que não geram energia e não contêm C, H, O e N; permanecem nas cinzas mesmo após a queima da matéria orgânica. Atuam em três pilares: <b>estrutural</b> (tecidos e atividade muscular), <b>osmótico</b> (equilíbrio ácido-básico) e <b>enzimático</b> (catalisadores e componentes de compostos orgânicos).</p>`+tb(["","[[Macroelementos]]","[[Microelementos]]","[[Elementos-traço]]"],[["Demanda","Ordem de gramas (> 100 mg/dia)","Ordem de miligramas (< 100 mg/dia)","µg/ng (de 1–100 mg a < 1 mg/dia, ultratraço)"],["Exemplos","Na, K, Mg, Ca","Fe, Zn, Cu, Mn","Cr, Mo, Co, Se"]])+`<p class=n>Na e K são exceções: têm altíssima absorção natural.</p><h3>Quanto ingerir</h3><p>A [[EAR]] é a necessidade média estimada (atende 50% da população); a [[RDA]] (ou RNI) é a ingestão recomendada, que cobre 97–98%; o [[UL]] é o nível máximo de ingestão tolerável. A gama aceitável fica entre a RDA e o UL: abaixo há risco de déficit; acima, risco de excesso.</p><h3>Aprofundando</h3><p>Na curva da [[homeostase]] há três zonas: deficiente (risco de déficit), segura e adequada, e tóxica (risco de excesso). O Mg da clorofila e o Fe do grupo heme ilustram nutrientes ligados a moléculas orgânicas, mas alguns elementos dependem criticamente da dose para virar venenos sistêmicos: cádmio (nefrotóxico), chumbo (reduz o QI infantil), mercúrio e alumínio (neurotóxicos) e arsênio (carcinogênico).</p><p>Nos alimentos, Na⁺, K⁺, Cl⁻ e F⁻ aparecem como íons livres e muito solúveis; a maioria dos outros minerais está em complexos fracos, [[quelato]]s ou ânions com oxigênio (iodeto, iodato, fosfatos). Essa forma química define reatividade, solubilidade, absorção e estabilidade no processamento. Um quelato é um complexo em anel entre um íon metálico e um ligante multidentado (oxalato, glicina, EDTA), mais estável que os complexos não quelatos.</p>`+pg([["Achar que minerais fornecem energia.","Não geram energia nem contêm C, H, O e N; ficam nas cinzas."],["Achar que macro, micro e traço se diferenciam pela importância.","Diferenciam-se pela quantidade necessária (gramas, mg, µg); todos são essenciais."],["Confundir EAR com RDA.","EAR atende 50% da população; RDA/RNI atende 97–98%; UL é o limite máximo tolerado."]]),["Minerais: inorgânicos, sem energia, ficam nas cinzas; pilares estrutural, osmótico e enzimático","EAR (50%) < RDA (97–98%) < UL; a dose define o risco de déficit ou de excesso"],"Na e K são macroelementos, mas com altíssima absorção natural: não generalize a baixa absorção para todos os minerais.",[["Defina mineral e cite os três pilares funcionais.","Elemento inorgânico essencial, sem energia e sem C, H, O e N, que fica nas cinzas. Pilares: estrutural (tecidos e atividade muscular), osmótico (equilíbrio ácido-básico) e enzimático (catalisadores e compostos orgânicos).","Por serem inorgânicos, não são combustível do metabolismo: são estrutura, reguladores osmóticos e cofatores."],["Classifique macro, micro e elementos-traço por demanda, com exemplos.","Macro: > 100 mg/dia (Na, K, Mg, Ca). Micro: < 100 mg/dia (Fe, Zn, Cu, Mn). Traço: µg/ng, ultratraço < 1 mg/dia (Cr, Mo, Co, Se).","A classificação é pela quantidade necessária, não pela essencialidade."],["Diferencie [[EAR]], [[RDA]]/RNI e [[UL]].","EAR: necessidade média estimada (50%). RDA/RNI: ingestão recomendada que cobre 97–98%. UL: nível máximo de ingestão tolerável.","A faixa aceitável fica entre a RDA e o UL: abaixo há risco de déficit e acima, de excesso."],["Por que a dose importa para cádmio, chumbo, mercúrio, alumínio e arsênio?","Esses elementos viram tóxicos conforme a dose: cádmio é nefrotóxico, chumbo reduz o QI infantil, mercúrio e alumínio são neurotóxicos e o arsênio é carcinogênico.","Acima do limiar seguro da [[homeostase]], o organismo entra na zona de risco de excesso."]]],
["Teor mineral nos alimentos e fome oculta",`<p>O teor mineral depende da origem do alimento.</p>`+tb(["Origem","O que define o teor"],[["Vegetal","Captação de água e nutrientes do solo (pH, espécie/forma), transporte das raízes às outras partes e composição final: genética, fertilidade do solo e ambiente. F, Se e I não são essenciais para a maioria das plantas"],["Animal","Varia menos: mecanismos homeostáticos ([[homeostase]]) regulam a concentração nos tecidos essenciais. Carnes: ↑ Fe (exceção: terneiros), ↓ Ca (exceção: ossos). Leite: ↑ Ca, ↓ Fe"]])+`<h3>Fome oculta</h3><p>A [[fome oculta]] ocorre quando o consumo calórico é suficiente, mas a dieta carece de micronutrientes essenciais (Fe, Zn, I e vitamina A). Cerca de 2 bilhões de pessoas sofrem com deficiência de ferro ou zinco, e 733 milhões estão no mapa da fome (SOFI, 2024), incluindo 14,3 milhões de brasileiros. As consequências são redução do crescimento, QI diminuído, produtividade reduzida e cegueira (a aula cita 7 milhões de mortes infantis por ano).</p><h3>Aprofundando</h3><p>O pH do solo muda o que a planta consegue captar: pH mais alto diminui a disponibilidade de Fe, Zn, Mn e Ni e aumenta a de Mo e Se. Clima, manejo agrícola, composição do solo e maturação também alteram o teor. Depois da colheita, as perdas por [[lixiviação]] no cozimento e no branqueamento atingem os minerais solúveis que não estão complexados.</p>`+pg([["Dizer que a fome oculta é falta de calorias.","Ocorre com consumo calórico suficiente; faltam micronutrientes (Fe, Zn, I, vitamina A)."],["Achar que o teor mineral animal varia tanto quanto o vegetal.","Varia menos, pela regulação homeostática; nos vegetais depende de solo, genética e ambiente."],["Dizer que carne é pobre em ferro e leite é rico.","Carnes são ricas em Fe e pobres em Ca (exceção: ossos); o leite é rico em Ca e pobre em Fe."]]),["Vegetais: teor depende de solo (pH), genética e ambiente; animais: homeostase regula e o teor varia menos","Fome oculta: calorias suficientes, micronutrientes em falta (Fe, Zn, I, vitamina A)"],"Teor alto na tabela não garante valor nutricional: veja o próximo tópico.",[["Que fatores determinam a composição mineral de um alimento vegetal?","Captação de água e nutrientes do solo (pH, espécie/forma), transporte das raízes para o restante da planta, genética e fertilidade do solo e do ambiente.","A planta só leva ao alimento o que o solo disponibiliza e o que sua genética permite captar; o pH do solo muda a disponibilidade de Fe, Zn, Mn e Mo."],["Por que os minerais variam menos nos alimentos de origem animal?","Porque mecanismos homeostáticos regulam a concentração dos nutrientes nos tecidos essenciais.","O animal mantém seus níveis internos; por isso carnes têm mais Fe (exceto terneiros) e menos Ca (exceto ossos), e o leite tem mais Ca e menos Fe."],["O que é [[fome oculta]] e quais as consequências?","É o consumo calórico suficiente com dieta pobre em micronutrientes (Fe, Zn, I, vitamina A). Causa redução do crescimento, QI diminuído, produtividade reduzida e cegueira.","Não é fome de calorias, e sim carência de micronutrientes essenciais ao crescimento, à cognição e à visão."]]],
["Biodisponibilidade: facilitadores e inibidores",`<p>O teor total não garante o valor nutricional: a [[biodisponibilidade]] é o percentual ingerido que foi efetivamente absorvido e utilizado, e varia de menos de 1% a 90%, conforme a forma solúvel, o pH e as reações de hidrólise na digestão.</p>`+tb(["Facilitadores","Inibidores"],[["Ácidos orgânicos (ascórbico, cítrico, láctico); proteínas (aminoácidos aceleram o fluxo e formam quelatos estáveis: até +15% de absorção de Fe e Zn); [[ferro heme]] (mioglobina da carne)","[[Fitato]]s, [[oxalatos]] e [[taninos]]: formam complexos insolúveis com Ca, Fe e Zn que o corpo não consegue quebrar"]])+`<p class=n>Fator X, a [[microbiota]]: aumenta a bioacessibilidade do Fe (1,3 a 1,8x), mas pode reduzir a de Zn, Cu e Mn no cólon (complexos insolúveis ZnS e CuS, sequestro microbiano).</p><h3>Exemplos da aula (base seca, mg/100 g: teor → disponível, perda)</h3>`+tb(["Alimento","Ferro","Zinco","Cálcio"],[["Lentilha","5,3 → 1,7 (67,9%)","2,3 → 2,1 (8,7%)","48,4 → 28,5 (41,1%)"],["Castanha de caju","5,4 → 2,8 (48,1%)","3,0 → 1,6 (46,7%)","24,1 → 6,9 (71,4%)"],["Amêndoa","2,5 → 0,05 (98,0%)","1,5 → 0,03 (98,0%)","132,4 → 15,3 (88,4%)"],["Noz","2,1 → 0,06 (97,1%)","1,8 → 0,21 (88,3%)","73,1 → 5,5 (92,5%)"],["Milho","0,75 → 0,24 (68,0%)","0,76 → 0,63 (17,1%)","14,5 → 7,5 (48,3%)"],["Castanha do Brasil","2,2 → 0,64 (68,0%)","2,4 → 0,50 (79,2%)","170,3 → 32,6 (80,9%)"]])+`<h3>Aprofundando</h3><p>O [[fitato]] (hexafosfato de mio-inositol) é um quelante multidentado: cada grupo fosfato liga o mineral e forma um complexo forte e insolúvel, a “gaiola” que sequestra o mineral e impede a absorção. O “resgate” vem do [[ácido ascórbico]], forte agente redutor e quelante: forma complexos mais fracos, solúveis e facilmente dissociáveis, protege o ferro das interações inibitórias e o leva ao enteócito (ele também reduz Fe³⁺ a Fe²⁺). Os taninos podem reduzir a biodisponibilidade do ferro em até 50%.</p><p>Na comparação por porção, a couve tem cerca de 42,7% de [[bioacessibilidade]] do cálcio (328 mg, ~0,2 porção de leite), o leite desnatado 29,9% (72,4 mg) e o espinafre só 0,13% (352 porções para igualar o leite, por ser rico em oxalato). A necessidade de cálcio do adulto é de 700–1200 mg/dia.</p>`+pg([["Achar que o teor da tabela nutricional é o que o corpo aproveita.","O teor total não garante valor nutricional; vale a biodisponibilidade (de menos de 1% a 90%)."],["Comparar alimentos só pelo teor de mineral.","Amêndoa e noz perdem 97–98% do ferro após a digestão; a lentilha perde só 8,7% do zinco."],["Dizer que o ácido ascórbico atrapalha a absorção do ferro.","Ele é o “resgate”: reduz e quela o Fe, formando complexos solúveis que passam ao enteócito."]]),["Biodisponibilidade (< 1% a 90%) ≠ teor total; fitato, oxalato e tanino formam complexos insolúveis com Ca, Fe e Zn","Ácido ascórbico, proteínas (+15% Fe/Zn) e ferro heme facilitam; a microbiota ↑ Fe e pode ↓ Zn, Cu e Mn"],"Teor alto com inibidores presentes significa pouca disponibilidade: olhe sempre a % de perda.",[["Por que a tabela nutricional pode enganar quanto aos minerais?","Porque o teor total não garante valor nutricional: importa a [[biodisponibilidade]], o percentual absorvido e utilizado, que varia de menos de 1% a 90% conforme forma solúvel, pH e hidrólise na digestão.","Dois alimentos com o mesmo teor podem entregar quantidades muito diferentes, como amêndoa e castanha de caju para o ferro."],["Cite facilitadores e inibidores da absorção de minerais.","Facilitadores: ácidos orgânicos (ascórbico, cítrico, láctico), proteínas (até +15% de Fe/Zn) e [[ferro heme]]. Inibidores: [[fitato]]s, [[oxalatos]] e [[taninos]].","Os inibidores formam complexos insolúveis com Ca, Fe e Zn; os facilitadores formam quelatos solúveis ou aceleram o fluxo."],["Explique a “gaiola do fitato” e o “resgate” do ácido ascórbico.","O [[fitato]] prende o mineral em complexo forte, multidentado e insolúvel. O [[ácido ascórbico]], redutor e quelante, forma complexos mais fracos, solúveis e dissociáveis, protegendo o Fe e permitindo sua passagem ao enteócito.","Cada grupo fosfato do fitato se liga ao metal; o ascórbico compete por ele e o mantém solúvel."],["Qual o papel da [[microbiota]] na absorção de minerais?","Aumenta a bioacessibilidade do Fe (1,3 a 1,8x), mas pode reduzir a de Zn, Cu e Mn no cólon, por complexos insolúveis (ZnS, CuS) e sequestro microbiano.","O efeito é duplo: ajuda um mineral e compete por outros."]]],
["Processamento e estratégias contra a fome oculta",`<p>O processamento muda a oferta de minerais nos dois sentidos.</p>`+tb(["Intervenção","Efeito"],[["[[Fermentação]]","Hidrolisa (quebra) fitatos e taninos e libera minerais: aumenta drasticamente a biodisponibilidade"],["Cocção/aquecimento","Pode diminuir a bioacessibilidade (ex.: fórmulas enterais) pela degradação térmica do ácido ascórbico, que desfaz o “resgate”. Na cocção úmida de leguminosas, as fibras solúveis reduzem a biodisponibilidade dos minerais, mas a perda de agentes quelantes pode aumentar a do pouco mineral disponível"],["Moagem","Lixiviação catastrófica: do trigo integral à farinha branca perdem-se 76% do Fe e 78% do Zn (retirados com farelo e gérmen)"]])+`<h3>Três estratégias globais</h3>`+tb(["Estratégia","Onde","Método","Exemplos no Brasil"],[["[[Biofortificação]]","Campo","Melhoramento genético convencional ou engenharia genética na semente","Embrapa: milho pró-vitamina A, feijão BRS Aracê rico em Fe/Zn"],["[[Fortificação]]","Fábrica","Adição tecnológica de nutrientes pós-colheita","Flocos de aveia e farinhas fortificadas com ferro (lei brasileira)"],["[[Suplementação]]","Prato (clínica)","Pílulas ou pós para grupos suscetíveis","Cápsulas de vitamina e mineral"]])+`<h3>Aprofundando</h3><p>Nos cereais, os minerais se concentram no farelo, no gérmen e nas camadas externas do endosperma; por isso a moagem os remove junto com o farelo. A [[lixiviação]] no cozimento e no branqueamento também atinge os minerais solúveis não complexados, e a cocção em meio ácido pode reduzir a solubilidade de alguns minerais no lúmen. O ciclo de valor resume tudo: origem (solo e semente, com biofortificação e genética), modulação (fábrica e cozinha, com fermentação reduzindo fitatos e fortificação), bioacessibilidade (intestino, com o resgate dos quelatos e a flora) e impacto global (homeostase atingida).</p>`+pg([["Achar que todo processamento piora a biodisponibilidade.","A fermentação a aumenta; a moagem e a cocção podem reduzi-la. Avalie os dois lados."],["Confundir biofortificação, fortificação e suplementação.","Biofortificação: no campo (genética); fortificação: na fábrica (adição); suplementação: no prato (pílulas ou pós)."],["Dizer que a farinha branca equivale à integral em minerais.","A moagem retira farelo e gérmen: perda de 76% do Fe e 78% do Zn."]]),["Fermentação hidrolisa fitatos e taninos; moagem tira farelo e gérmen (perde 76% do Fe e 78% do Zn)","Biofortificação (campo), fortificação (fábrica), suplementação (prato/clínica)"],"A cocção úmida tem dois lados: pode reduzir a biodisponibilidade (fibras solúveis, perda da vitamina C) e também reduzir agentes quelantes.",[["Como a [[fermentação]] melhora a oferta de minerais?","Hidrolisa (quebra) fitatos e taninos, liberando minerais e aumentando muito a biodisponibilidade.","Sem o fitato “gaiola” e sem taninos, Ca, Fe e Zn deixam de formar complexos insolúveis."],["Por que a cocção pode reduzir a biodisponibilidade, e qual a ressalva?","O aquecimento degrada termicamente o ácido ascórbico (como em fórmulas enterais), desfazendo o “resgate”. Ressalva: na cocção úmida de leguminosas as fibras solúveis reduzem a biodisponibilidade, mas a redução de agentes quelantes pode aumentar a do pouco mineral disponível.","Sem a vitamina C como resgate, o ferro volta a ser sequestrado pelos inibidores."],["O que a moagem faz com os minerais do trigo?","Transformar trigo integral em farinha branca remove farelo e gérmen, onde estão os minerais: perda de 76% do ferro e 78% do zinco.","Nos cereais, os minerais se concentram no farelo, no gérmen e nas camadas externas do endosperma."],["Diferencie [[biofortificação]], [[fortificação]] e [[suplementação]], com exemplos do Brasil.","Biofortificação: no campo, por melhoramento genético (Embrapa: milho pró-vitamina A, feijão BRS Aracê). Fortificação: na fábrica, adição de nutrientes (farinhas e flocos de aveia com ferro, por lei). Suplementação: no prato, pílulas ou pós para grupos suscetíveis.","Os três atuam em pontos diferentes da cadeia: semente, indústria e indivíduo."]]],
["Papel tecnológico e cor da carne",`<p>Além da nutrição, os minerais têm usos tecnológicos.</p>`+tb(["Mineral","Papel tecnológico"],[["Ca","Modificador de textura: formação de géis e amaciamento da carne (marinação)"],["Al","Fermento ácido (sulfato e fosfato de alumínio e sódio): age na mistura e no forno, na panificação"],["S","[[Sulfitos]]/SO₂: inibem o escurecimento enzimático (agente redutor de quinonas) e são antimicrobianos; atenção a indivíduos asmáticos (ANVISA)"],["Cu","Catalisador purificador: remove [[mercaptanas]] e H₂S (odor de ovo podre) como CuS insolúvel, melhorando o sensorial de destilados como a cachaça"],["Na/K","Modificadores diretos de sabor"]])+`<h3>A cor da carne</h3>`+tb(["Fase","Pigmento","O que acontece"],[["1. Púrpura","[[Desoximioglobina]]","Estado natural, sem O₂ (carne recém-cortada ou a vácuo)"],["2. Vermelho brilhante","[[Oximioglobina]]","Oxigenação: o Fe liga-se ao O₂; é a cor associada ao “fresco”"],["3. Marrom","[[Metamioglobina]]","Oxidação contínua: degradação do ferro, sinal de envelhecimento ou manuseio inadequado"]])+`<h3>Aprofundando</h3><p>O ferro do grupo heme da [[mioglobina]] muda de estado conforme o oxigênio disponível: sem O₂ a carne é púrpura; ao contato com o ar o ferro liga-se ao O₂ e forma o vermelho brilhante; com a oxidação contínua o pigmento escurece. Por isso a vácuo a carne se mantém púrpura e a carne exposta ao ar escurece com o tempo. Os sulfitos agem como redutores de quinonas, e o cobre remove compostos de enxofre por formar sulfeto insolúvel.</p>`+pg([["Achar que o vermelho brilhante é a cor da carne sem oxigênio.","Sem O₂ a carne é púrpura (desoximioglobina); o vermelho vem da oximioglobina, formada no contato com o ar."],["Confundir oximioglobina com metamioglobina.","Oximioglobina: Fe ligado ao O₂ (vermelho, fresco). Metamioglobina: ferro oxidado (marrom)."],["Achar que sulfito é inofensivo para todos.","Exige atenção em indivíduos sensíveis (asma), segundo a ANVISA."]]),["Ca texturiza, Al fermenta, S (SO₂) protege, Cu purifica (CuS), Na e K dão sabor","Cor da carne: desoximioglobina (púrpura) → oximioglobina (vermelho) → metamioglobina (marrom)"],"O alumínio é fermento ácido, mas também consta entre as ameaças tóxicas dependentes da dose.",[["Qual o papel do cobre em destilados como a cachaça?","Catalisador purificador: remove [[mercaptanas]] e H₂S (odor de ovo podre e enxofre) ao formar CuS insolúvel, melhorando o sensorial.","O sulfeto de cobre precipita e retira os compostos de enxofre do destilado."],["Quais as funções do enxofre ([[sulfitos]]/SO₂) e que cuidado ele exige?","Inibe o escurecimento enzimático (agente redutor de quinonas) e é antimicrobiano; exige atenção em indivíduos sensíveis, como asmáticos (ANVISA).","Ao reduzir quinonas, o SO₂ impede a formação de pigmentos escuros, mas pode desencadear crise em sensíveis."],["Descreva as três fases da cor da carne.","Fase 1: púrpura ([[desoximioglobina]]), sem O₂. Fase 2: vermelho brilhante ([[oximioglobina]]), Fe ligado ao O₂, cor de fresco. Fase 3: marrom ([[metamioglobina]]), ferro oxidado, envelhecimento ou manuseio inadequado.","A oxigenação leva da fase 1 à 2, e a oxidação contínua da 2 à 3."],["Que papéis tecnológicos têm Ca, Al e Na/K?","Ca modifica a textura (géis, amaciamento na marinação); o Al, como sulfato ou fosfato de alumínio e sódio, é fermento ácido (age na mistura e no forno); Na e K modificam diretamente o sabor.","São usos tecnológicos além da nutrição."]]]];

const GMN={"minerais":["Elementos inorgânicos essenciais, sem energia nem C, H, O e N; ficam nas cinzas.",0],"ear":["Necessidade média estimada: atende 50% da população.",0],"rda":["Ingestão recomendada (RNI): atende 97–98% da população.",0],"ul":["Nível máximo de ingestão tolerável.",0],"homeostase":["Equilíbrio em que o nutriente fica na faixa segura e adequada, entre o déficit e o excesso.",0],"quelato":["Complexo em anel entre um íon metálico e um ligante multidentado; mais estável.",0],"macroelementos":["Minerais necessários em gramas (> 100 mg/dia): Na, K, Mg, Ca.",0],"microelementos":["Minerais necessários em miligramas (< 100 mg/dia): Fe, Zn, Cu, Mn.",0],"elementos-traço":["Necessários em µg/ng: Cr, Mo, Co, Se.",0],"fome oculta":["Calorias suficientes, mas dieta carente de micronutrientes (Fe, Zn, I, vitamina A).",1],"lixiviação":["Perda de solúveis arrastados pela água de cozimento ou branqueamento.",1],"biodisponibilidade":["Percentual do nutriente ingerido que é absorvido e utilizado.",2],"bioacessibilidade":["Fração do mineral liberada da matriz e disponível para absorção.",2],"fitato":["Hexafosfato de mio-inositol: quelante forte que forma complexos insolúveis com Ca, Fe e Zn.",2],"oxalatos":["Inibidores que formam complexos insolúveis com Ca e Fe.",2],"taninos":["Polifenóis que reduzem a biodisponibilidade do ferro.",2],"ferro heme":["Ferro da mioglobina da carne; facilitador da absorção.",2],"microbiota":["Flora intestinal: aumenta a bioacessibilidade do Fe, mas pode reduzir a de Zn, Cu e Mn.",2],"ácido ascórbico":["Redutor e quelante que “resgata” o Fe do fitato.",2],"fermentação":["Hidrolisa fitatos e taninos e libera minerais.",3],"biofortificação":["Aumento do nutriente na semente por melhoramento genético (no campo).",3],"fortificação":["Adição tecnológica de nutrientes ao alimento na indústria.",3],"suplementação":["Pílulas ou pós para grupos suscetíveis.",3],"mioglobina":["Proteína muscular com ferro heme que liga o O₂ e define a cor da carne." const FMN=[[0,"Defina mineral e cite seus três pilares funcionais.","Elemento inorgânico essencial, sem energia e sem C, H, O e N (fica nas cinzas). Pilares: estrutural, osmótico (ácido-básico) e enzimático."],[0,"Compare EAR, RDA/RNI e UL.","EAR: necessidade média (50%). RDA/RNI: cobre 97–98%. UL: limite máximo tolerado; entre RDA e UL fica a gama aceitável."],[0,"Como se classificam macro, micro e elementos-traço por demanda?","Macro: > 100 mg/dia (Na, K, Mg, Ca). Micro: < 100 mg/dia (Fe, Zn, Cu, Mn). Traço: µg/ng (Cr, Mo, Co, Se)."],[1,"O que é fome oculta?","Consumo calórico suficiente com dieta carente de micronutrientes (Fe, Zn, I, vitamina A)."],[1,"Por que o teor mineral varia menos em alimentos animais que em vegetais?","Mecanismos homeostáticos regulam a concentração nos tecidos; nos vegetais o teor depende de solo, genética e ambiente."],[2,"Cite facilitadores e inibidores da absorção de minerais.","Facilitadores: ácidos orgânicos, proteínas (+15% Fe/Zn) e ferro heme. Inibidores: fitatos, oxalatos e taninos."],[2,"Como o ácido ascórbico “resgata” o ferro do fitato?","É redutor e quelante: forma complexos mais fracos, solúveis e dissociáveis, protegendo o Fe e levando-o ao enteócito."],[2,"Qual o duplo efeito da microbiota sobre os minerais?","Aumenta a bioacessibilidade do Fe (1,3 a 1,8x), mas pode reduzir a de Zn, Cu e Mn no cólon (ZnS, CuS, sequestro)."],[3,"O que a moagem faz com os minerais do trigo?","Trigo integral → farinha branca: perda de 76% do Fe e 78% do Zn (farelo e gérmen)."],[3,"Diferencie biofortificação, fortificação e suplementação.","Biofortificação: campo (genética). Fortificação: fábrica (adição). Suplementação: prato/clínica (pílulas ou pós)."],[4,"Quais são as 3 fases da cor da carne?","Púrpura (desoximioglobina) → vermelho brilhante (oximioglobina, Fe ligado ao O₂) → marrom (metamioglobina, Fe oxidado)."],[4,"Qual a função do cobre na cachaça?","Remove mercaptanas e H₂S formando CuS insolúvel, melhorando o sensorial."]];

const TBIO=[
["Conceituação, Classificação e Compostos Fenólicos",`<p>[[Compostos bioativos]] são substâncias químicas da matriz alimentar que não atendem à definição clássica de nutrientes essenciais (como carboidratos, lipídeos e proteínas), mas atuam modulando processos metabólicos e celulares, exercendo efeitos promotores de saúde e diminuindo o risco de doenças crônico-degenerativas (doenças cardiovasculares, câncer, diabetes e inflamação crônica).</p><p>Metabólitos secundários de plantas, os [[compostos fenólicos]] desempenham papel crucial na defesa vegetal contra pragas e radiação UV, adaptação ao meio e sustentação estrutural. Sensorialmente, contribuem para cores amarela, vermelha e azul, amargor, [[adstringência]], estabilidade oxidativa e aromas característicos (defumado, baunilha).</p>`+tb(["Classe química","Esqueleto carbônico","Exemplos principais","Fontes alimentares"],[["[[Ácidos hidroxibenzóicos]]","C6-C1","Ácido gálico, protocatecuico, vanílico, siríngico","Berries, cebola, chá, sementes, cascas"],["[[Ácidos hidroxicinâmicos]]","C6-C3","Ácido cafeico, ferúlico, p-cumárico, clorogênico","Café, maçã, pera, cereais integrais, tomate"],["[[Flavonoides]]","C6-C3-C6","Quercetina, catequinas, hesperidina, antocianinas","Frutas cítricas, maçã, cacau, soja, uvas"],["[[Estilbenos]]","C6-C2-C6","trans-Resveratrol","Uvas roxas, vinho tinto, amendoim"],["[[Taninos]]","Polímeros fenólicos","Taninos hidrolisáveis e proantocianidinas condensadas","Frutas verdes (caqui, banana), chás, vinhos"],["[[Ligninas]]","(C6-C3)n","Polímeros de sustentação da parede celular","Hastes vegetais, aspargos, farelos"]])+`<p class=n>Localização celular: compostos solúveis ficam no [[vacúolo]] aquoso; fenólicos ligados ([[bound PCs]]) ligam-se covalentemente à [[pectina]], [[celulose]] e hemicelulose da parede celular.</p><h3>Aprofundando</h3><p>Quimicamente, os fenólicos possuem ao menos um anel aromático benzênico ligado a um ou mais grupos hidroxila (-OH). Nos cereais e leguminosas, expressiva fração dos fenólicos encontra-se na forma ligada (bound PCs), exigindo hidrólise ácida, alcalina ou fermentativa para liberação. Já nas frutas e hortaliças carnosas, predominam formas solúveis no vacúolo (ácidos livres ou esterificados a quinatos, como o [[ácido clorogênico]] do café e da maçã).</p>`+pg([["Achar que compostos bioativos são nutrientes essenciais calóricos.","Bioativos são não nutrientes; atuam modulando vias biológicas e expressão gênica sem fornecer calorias de combustão."],["Achar que todos os fenólicos de um vegetal estão livres para extração em água.","Parte expressiva está ligada covalentemente à parede celular (bound PCs), exigindo clivagem enzimática ou fermentativa."],["Confundir ácidos hidroxibenzóicos (C6-C1) com hidroxicinâmicos (C6-C3).","Hidroxibenzóicos têm 1 carbono na cadeia lateral (gálico); hidroxicinâmicos são fenilpropanoides com 3 carbonos (cafeico, ferúlico)."]]),["Bioativos: metabólitos secundários não nutrientes promotores de saúde","Fenólicos: anel aromático com hidroxilas; solúveis no vacúolo e ligados na parede celular"],"A adstringência vem da precipitação de proteínas salivares por taninos livres.",[["O que são compostos bioativos e qual sua relevância biológica?","Substâncias da matriz alimentar (não nutrientes essenciais) que modulam vias metabólicas e expressão gênica, promovendo saúde e prevenindo doenças crônicas.","Atuam como antioxidantes, moduladores de sinalização celular e anti-inflamatórios sem meta de calorias na dieta."],["Diferencie os dois grandes grupos de ácidos fenólicos quanto à estrutura e exemplos.","Ácidos hidroxibenzóicos (C6-C1, ex: ácido gálico e vanílico) e hidroxicinâmicos (C6-C3, ex: ácido cafeico, ferúlico e p-cumárico).","A diferença reside no comprimento da cadeia lateral ligada ao anel benzênico fenólico."],["Onde os compostos fenólicos se localizam na célula vegetal e o que são bound PCs?","Os solúveis acumulam-se no vacúolo aquoso; os bound PCs estão ligados covalentemente à celulose, hemicelulose e pectina da parede celular.","Para absorver bound PCs, é necessária hidrólise fermentativa da parede celular no cólon."]]],
["Flavonoides e Estilbenos (Resveratrol)",`<p>Os [[flavonoides]] constituem o maior grupo de polifenóis da dieta, estruturados sobre o esqueleto do anel flavana <b>C6-C3-C6</b> (dois anéis benzênicos A e B unidos por um anel heterocíclico oxigenado C).</p>`+tb(["Subclasse","Compostos de destaque","Características e fontes"],[["[[Flavonas]]","Apigenina, luteolina","Anel C insaturado com carbonila; salsa, aipo, pimentão"],["[[Flavonóis]]","Quercetina, caempferol, miricetina","Hidroxila no C3; cebola roxa, maçã, brócolis, alcaparras"],["[[Flavanonas]]","Naringenina, hesperidina","Anel C saturado; característica de frutas cítricas (laranja, limão)"],["[[Flavanóis]] (flavan-3-ois)","Catequina, epicatequina, epigalocatequina-galato (EGCG)","Sem carbonila no C4; chá verde, cacau, maçã, vinho tinto"],["[[Isoflavonas]]","Genisteína, daidzeína","Anel B ligado no C3 (fitoestrógenos); soja e derivados"],["[[Antocianinas]]","Cianidina, delfinidina, pelargonidina, malvidina","Glicosídeos de cátion flavílio; cor vermelha a azul sensível ao pH; berries, uvas, repolho roxo"]])+`<h3>Dinâmica da cor das antocianinas com o pH</h3><p>Em pH extremamente ácido (1,0 a 3,0), predomina o <b>cátion flavílio vermelho-brilhante</b>. Em pH neutro (cerca de 6,0 a 7,0), ocorre hidratação formando pseudobase carbinol incolor. Em pH alcalino (7,5 a 8,0), desprotona-se em <b>base quinoidal azul-arroxeada</b>.</p><h3>Resveratrol (Estilbeno C6-C2-C6)</h3><p>O [[resveratrol]] (<i>trans</i>-3,5,4'-triidroxi-<i>trans</i>-estilbeno, C14H12O3) é produzido pela videira como fitoalexina em resposta ao estresse fúngico e radiação solar. Concentra-se na casca de uvas roxas, vinho tinto, amendoim e mirtilo.</p>`+tb(["Ação biológica","Mecanismo molecular evidenciado"],[["Antioxidante e anti-inflamatório","Neutraliza radicais livres e inibe a via inflamatória do NF-κB"],["Cardioprotetor","Estimula a eNOS e aumenta a biodisponibilidade de óxido nítrico endotelial"],["Metabólico e antidiabético","Ativa a proteína quinase ativada por AMP (AMPK) melhorando a sensibilidade à insulina"],["Neuroprotetor e antitumoral","Reduz o estresse oxidativo neuronal e modula genes de proliferação celular e apoptose"]])+pg([["Achar que todas as antocianinas mantêm a cor vermelha em qualquer alimento.","A cor varia drasticamente com o pH: vermelho em meio ácido, incolor em neutro e azul em alcalino."],["Afirmar que o anel B das isoflavonas está no C2 como nos demais flavonoides.","Nas isoflavonas o anel B migra para o carbono C3, conferindo analogia conformacional ao 17β-estradiol."],["Achar que o resveratrol está na polpa da uva branca na mesma quantidade da roxa.","Concentra-se na casca das uvas escuras, onde a síntese de fitoalexinas é estimulada pelo sol e fungos."]]),["Flavonoides: esqueleto C6-C3-C6 (anel flavana); antocianinas mudam de cor com o pH (vermelho a azul)","Resveratrol: estilbeno C6-C2-C6 de uvas roxas e vinho; cardioprotetor e ativador de AMPK"],"O vinho tinto tem mais resveratrol que o branco porque fermenta em contato com as cascas.",[["Qual é a estrutura química base dos flavonoides e cite 3 subclasses com exemplos?","Esqueleto C6-C3-C6 (anel flavana). Subclasses: flavonóis (quercetina), flavanonas (naringenina) e isoflavonas (genisteína).","Variações no anel heterocíclico C (saturação, carbonila e hidroxilas) definem as subclasses e suas reatividades."],["Como o pH influencia a coloração das antocianinas nos alimentos?","Em pH ácido (1 a 3) formam o cátion flavílio vermelho vivo; em pH neutro ficam incolores e em pH alcalino formam base quinoidal azul.","Essa sensibilidade ao pH explica o uso de extratos de repolho roxo como indicador natural de acidez."],["Quais são as principais fontes e ações biológicas do trans-resveratrol?","Fontes: casca de uvas roxas, vinho tinto e amendoim. Ações: cardioprotetora (óxido nítrico), ativadora de AMPK e antioxidante via NF-κB.","É sintetizado pela videira como fitoalexina de defesa contra infecções fúngicas e radiação UV."]]],
["Digestão, Absorção e Biotransformação de Fenólicos",`<p>A absorção de compostos fenólicos depende criticamente do tamanho molecular, do estado de glicosilação e da solubilidade na matriz.</p>`+tb(["Segmento do TGI","Eventos fisiológicos e enzimáticos"],[["[[Estômago]]","Absorção rápida de ácidos fenólicos simples livres (ácido cafeico, ferúlico, p-cumárico) e isoflavonas agliconas"],["[[Intestino delgado]]","Hidrólise de glicosídeos por lactase-florizina hidrolase (LPH) na borda em escova ou β-glicosidases citosólicas; absorção ativa e paracelular"],["[[Intestino grosso / Microbiota]]","Compostos complexos (taninos condensados, proantocianidinas e bound PCs) são fermentados e clivados por bactérias colônicas em metabólitos fenólicos bioativos menores"],["[[Fígado (Fase II)]]","Biotransformação por sulfatação (SULT), glicuronidação (UGT) e metilação (COMT), gerando conjugados hidrossolúveis eliminados na urina e bile"]])+`<h3>O papel central da microbiota colônica</h3><p>Estima-se que mais de <b>90% a 95%</b> dos polifenóis ingeridos na dieta não são absorvidos no intestino delgado e chegam intactos ao cólon. Lá, enzimas bacterianas promovem desmetilação, desidroxilação e clivagem do anel heterocíclico, convertendo estruturas poliméricas maciças em ácidos fenólicos simples de alta absorção sistêmica.</p>`+pg([["Achar que todos os polifenóis são absorvidos no duodeno como monossacarídeos.","Mais de 90% chegam ao cólon intactos para serem fermentados pela microbiota em metabólitos ativos."],["Acreditar que os compostos fenólicos circulam no sangue na sua forma original da fruta.","Circulam quase que integralmente conjugados no fígado como glicuronídeos, sulfatos e derivados metilados."],["Dizer que o estômago é impermeável a qualquer composto fenólico.","Ácidos fenólicos de baixo peso molecular e agliconas sofrem absorção gástrica rápida."]]),["Fenólicos livres absorvem no estômago e jejuno; formas complexas exigem hidrólise colônica pela microbiota","Fígado realiza reações de Fase II: sulfatação, glicuronidação e metilação para conjugação hidrossolúvel"],"A forma que exerce efeito sistêmico no organismo muitas vezes é o metabólito bacteriano ou conjugado hepático.",[["Qual a importância da microbiota intestinal na biodisponibilidade de polifenóis?","A microbiota cliva polifenóis complexos e insolúveis (90-95% da ingestão) em metabólitos menores e bioacessíveis.","Sem a ação enzimática das bactérias colônicas, polímeros como taninos e proantocianidinas seriam excretados sem aproveitamento."],["O que ocorre na biotransformação hepática de Fase II dos compostos fenólicos?","Ocorrem reações de sulfatação (SULT), glicuronidação (UGT) e metilação (COMT), aumentando a solubilidade aquosa.","Essas conjugações preparam a molécula para transporte plasmático e excreção renal e biliar controladas."],["Como as formas glicosiladas de flavonoides são absorvidas no intestino delgado?","Precisam ser desprovidas do açúcar por enzimas como a LPH (lactase florizina hidrolase) ou β-glicosidases antes da captação do aglicona.","A porção hidrofílica de glicose impede a difusão direta através da bicamada lipídica do enterócito."]]],
["Aminas Bioativas: Biogênicas e Poliaminas",`<p>[[Aminas bioativas]] são bases orgânicas nitrogenadas de baixo peso molecular que possuem um ou mais grupos amino (NH2/NH3+), apresentando carga positiva no pH da maioria dos alimentos. São essenciais à vida celular, mas podem induzir toxicidade aguda em concentrações elevadas.</p>`+tb(["Categoria","Subgrupo","Aminas principais","Origem / Precursor"],[["[[Aminas biogênicas]]","Diaminas","Putrescina, cadaverina","Descarboxilação de ornitina e lisina (marcadores de deterioração proteica)"],["[[Aminas biogênicas]]","Aromáticas","Tiramina, feniletilamina, triptamina, sinefrina","Descarboxilação de tirosina, fenilalanina e triptofano"],["[[Aminas biogênicas]]","Neurotransmissores","Histamina, serotonina, dopamina","Descarboxilação bacteriana de histidina, 5-HTP e dopa"],["[[Poliaminas]]","Fisiológicas","Espermidina, espermina, agmatina","Formadas na célula a partir da putrescina; essenciais na replicação celular e síntese de DNA e RNA"]])+`<h3>Destoxificação intestinal e síndromes toxicológicas</h3><p>Em indivíduos saudáveis, as enzimas do enterócito <b>[[MAO]] (monoamina oxidase)</b> e <b>[[DAO]] (diamina oxidase)</b> degradam oxidativamente as aminas da dieta em aldeídos inofensivos e amônia. Porém, sob alta concentração de aminas ou inibição enzimática, ocorrem quadros clínicos graves:</p>`+tb(["Quadro clínico","Causa bioquímica alimentar","Manifestações clínicas"],[["[[Efeito queijo]] (crise hipertensiva)","Ingestão de [[tiramina]] (queijos maturados, embutidos, vinhos) por pacientes usando medicamentos inibidores de MAO (IMAO)","A tiramina atinge a circulação e desloca noradrenalina: crise hipertensiva severa, cefaleia e risco de AVC"],["[[Escombrotoxicose]] (intoxicação por histamina)","Ingestão de peixes escombrídeos deteriorados (atum, cavala, sardinha) ou fermentados (tucupi, queijos) com [[histamina]] > 50 mg/kg","Rubor facial, cefaleia pulsátil, hipotensão, taquicardia, queimação bucal, diarreia e broncoespasmo"]])+pg([["Achar que putrescina e cadaverina são poliaminas.","São diaminas alifáticas formadas por descarboxilação de ornitina e lisina."],["Acreditar que a histamina do peixe é destruída pelo cozimento culinário.","A histamina é termoestável: uma vez produzida por bactérias no peixe mal refrigerado, não é inativada pelo fogo."],["Confundir o mecanismo da tiramina com o da histamina.","Histamina causa vasodilatação e hipotensão (ação alérgeno-símile); tiramina causa vasoconstrição e pico hipertensivo."]]),["Aminas biogênicas vêm da descarboxilação de aminoácidos; poliaminas (espermidina/espermina) regulam o DNA","Enterócito destoxifica por MAO e DAO; falhas geram efeito queijo (tiramina) e escombrotoxicose (histamina)"],"Peixe escombrídeo deteriorado acumula histamina termoestável que resiste a grelhar, assar e fritar.",[["Diferencie aminas biogênicas de poliaminas quanto à estrutura e funções biológicas.","Biogênicas: descarboxilação de aminoácidos livres (histamina, tiramina). Poliaminas: estruturas lineares maiores (espermidina, espermina) essenciais ao ciclo celular.","Biogênicas atuam como neurotransmissores ou toxinas em excesso; poliaminas regulam a síntese de DNA e RNA."],["Explique a fisiopatologia do 'efeito queijo' associado à tiramina.","Pacientes sob inibidores de MAO (IMAO) não degradam a tiramina de queijos e embutidos; ela cai na circulação e força liberação massiva de noradrenalina.","O acúmulo sistêmico de catecolaminas deflagra vasoconstrição arterial aguda e hipertensão perigosa."],["Como ocorre a escombrotoxicose por ingestão de pescados?","Bactérias em peixes mal refrigerados descarboxilam a histidina em histamina termoestável; ao ingerir, a DAO é saturada, gerando hipotensão e rubor.","Por ser termoestável, o cozimento mata as bactérias mas preserva a histamina intacta no filé."]]],
["Carotenoides, Fitoesteróis e Ácidos Graxos Ômega-3",`<p>Compostos bioativos lipídicos e lipossolúveis desempenham funções estruturais, ópticas e de modulação imunometabólica de alta relevância clínica.</p>`+tb(["Composto","Classificação estrutural","Fontes de destaque","Mecanismo de ação / Efeito biológico"],[["[[Licopeno]]","[[Caroteno]] acíclico (C40 puro hidrocarboneto)","Tomate cozido, melancia, goiaba vermelha","Potente sequestrador de radicais livres de oxigênio singlete; sem atividade de provitamina A; reduz risco de câncer de próstata"],["[[β-Caroteno]]","Caroteno bicíclico (dois anéis β-ionona)","Cenoura, abóbora, manga, mamão, folhas verdes","100% de atividade de provitamina A (clivagem central em 2 retinóis; 6 µg = 1 µg retinol); antioxidante celular"],["[[Luteína e Zeaxantina]]","[[Xantofilas]] (derivados di-hidroxilados C40)","Gema de ovo, milho, couve, espinafre","Filtram a luz azul e depositam-se seletivamente na mácula lútea; reduzem risco de degeneração macular (DMRI) e catarata"],["[[Fitoesteróis]]","Esteróis vegetais (β-sitosterol, campesterol, estigmasterol)","Óleos vegetais, oleaginosas, sementes, abacate","Competem com o colesterol nas micelas mistas e pelo carreador NPC1L1; diminuem absorção de colesterol em 7-12% (1,5–3 g/dia) e reduzem LDL"],["[[EPA]] e [[DHA]]","Ácidos graxos poli-insaturados ômega-3 de cadeia longa","Peixes de água fria (salmão, sardinha), óleo de peixe, microalgas","Precursores de resolvinas, protectinas e maresinas (pró-resolução inflamatória); ativam PPAR-α e GPR120; reduzem triglicerídeos em 15–30%"]])+`<h3>Absorção de carotenoides e sinergismo com gordura</h3><p>Carotenoides são estritamente lipossolúveis e exigem a presença de lipídeos da dieta para formar emulsões com sais biliares em micelas mistas. O cozimento do tomate com azeite de oliva multiplica a biodisponibilidade do licopeno, promovendo a isomerização da forma <i>trans</i> para formas <i>cis</i>, que são muito mais solúveis nas micelas de absorção.</p>`+pg([["Achar que o licopeno do tomate fornece vitamina A ao organismo.","O licopeno não tem anel β-ionona fechado; possui potente ação antioxidante, mas zero atividade de provitamina A."],["Acreditar que os fitoesteróis reduzem o colesterol por serem absorvidos e agirem no fígado.","Agem no lúmen intestinal por competição física de incorporação micelar e no transportador NPC1L1; são pouquíssimo absorvidos (< 5%)."],["Confundir as funções do EPA com as do DHA.","DHA (22:6) é estrutural no cérebro e retina; EPA (20:5) é o precursor primário de mediadores anti-inflamatórios e redutor de triglicerídeos."]]),["Carotenos (licopeno/β-caroteno) vs Xantofilas oxigenadas (luteína/zeaxantina que protegem a mácula da retina)","Fitoesteróis competem na micela reduzindo LDL; Ômega-3 (EPA/DHA) gera resolvinas pró-resolução da inflamação"],"Cozinhar o tomate com óleo favorece a isomerização trans-cis e aumenta a absorção do licopeno.",[["Diferencie carotenos de xantofilas, citando exemplos e funções biológicas de cada.","Carotenos são hidrocarbonetos puros C40 (licopeno, β-caroteno); xantofilas contêm átomos de oxigênio (luteína, zeaxantina).","Carotenos atuam como provitamina A e antioxidantes; luteína e zeaxantina protegem a mácula da retina contra degeneração."],["Qual o mecanismo molecular pelo qual os fitoesteróis diminuem o colesterol LDL plasmático?","Competem com o colesterol pela incorporação nas micelas mistas e pelo transportador NPC1L1 no enterócito, reduzindo sua absorção em 7 a 12%.","Com menor entrada de colesterol dietético, o fígado capta mais LDL da circulação sanguínea para compensar."],["Como o EPA e o DHA atuam na modulação da resposta inflamatória e saúde cardiovascular?","Originam mediadores especializados pró-resolução da inflamação (resolvinas, protectinas, maresinas), ativam PPAR-α e reduzem triglicerídeos em 15-30%.","DHA integra as membranas sinápticas cerebrais e da retina, enquanto o EPA reduz marcadores pró-inflamatórios e risco arrítmico."]]]];

o absorvidos (< 5%), atuam localmente"]])+`</section>`;
}

// ===== FISIOLOGIA E BIOQUÍMICA POST MORTEM DA CARNE (ALM018 - UFMG) =====
const TMOR=[
["Conceituação Legal, Músculo vs Carne e Mecanismo da Contração",`<p>Na legislação brasileira (RIISPOA/MAPA), denomina-se <b>carne de açougue</b> a parte muscular esquelética comestível de animais de produção abatidos sob fiscalização veterinária oficial (SIF). Há uma distinção biológica indispensável: o [[músculo]] representa o tecido vivo, contrátil, homeostático e fisiologicamente estéril; a [[carne de açougue]] é o produto final resultante de uma rigorosa e complexa sequência de transformações físico-químicas e enzimáticas pós-abate. <i>Víscera não vira carne</i>: constituída de musculatura lisa sem sarcômeros, sofre autólise desordenada e exige congelamento imediato.</p>`+tb(["Estrutura anatômica","Composição tecidual","Função e comportamento"],[["[[Epimísio]]","Tecido conjuntivo fibroso denso","Envolve todo o músculo e conecta-se aos tendões e ossos"],["[[Perimísio]]","Tecido conjuntivo rico em colágeno","Agrupa feixes secundários de fibras musculares; define o grão da carne"],["[[Endomísio]]","Fina bainha conjuntiva","Individualiza cada fibra celular muscular em contato com o sarcolema"],["[[Sarcômero]]","Miofibrilas (linhas Z, banda I, banda A)","Unidade contrátil delimitada entre duas linhas Z; filamentos finos e grossos"]])+`<h3>O mecanismo molecular da contração e relaxamento</h3><p>Os filamentos finos contêm <b>actina F</b>, <b>tropomiosina</b> e o complexo de <b>troponina</b> (T, I e C). Os filamentos grossos são agregados de <b>miosina</b> com cabeças globulares dotadas de atividade ATPásica ativada por Mg²⁺. O [[cálcio]] é o gatilho absoluto da contração: liberado do [[retículo sarcoplasmático]], liga-se à troponina C, deslocando a fita de tropomiosina e liberando o sítio ativo da actina. As cabeças da miosina conectam-se formando pontes cruzadas e hidrolisam ATP, disparando o <i>power stroke</i> que encurta o sarcômero.</p><p class=n><b>Alerta de ouro:</b> relaxar consome tanta energia biológica quanto contrair! O relaxamento é um processo <b>estritamente ativo</b> no qual bombas de Ca²⁺-ATPase ([[SERCA]]) consomem ATP para recaptar o cálcio livre do sarcoplasma de volta para o retículo sarcoplasmático.</p>`+pg([["Achar que músculo é sinônimo de carne.","Músculo é o tecido vivo do animal; carne é o resultado de glicólise anaeróbica, queda do pH e maturação."],["Acreditar que o relaxamento muscular é um recuo passivo elástico sem gasto de energia.","Relaxar consome ATP continuamente para bombear o cálcio de volta ao retículo pela bomba SERCA."],["Dizer que carne fresca tem sangue circulante.","A sangria regulamentar esgota todo o sangue; o líquido vermelho da bandeja é exsudato com mioglobina."]]),["Músculo vivo é estéril; a carne nasce após a glicólise anaeróbica e a resolução do rigor mortis","Contração e relaxamento exigem ATP; o cálcio livre destrava a troponina e mantém a actomiosina unida"],"O jejum pré-abate (12 a 24h) evita a ruptura do trato digestório e o derramamento fecal na carcaça.",[["Diferencie biologicamente músculo vivo de carne de açougue.","Músculo é o tecido contrátil vivo, homeostático e estéril; carne é o produto pós-morte após glicólise, queda de pH e maturação.","A carne só atinge maciez e palatabilidade após a quebra proteolítica das ancoragens do rigor mortis."],["Descreva o papel do cálcio e do ATP no ciclo de contração e relaxamento muscular.","O cálcio destrava a troponina e permite a ligação actina-miosina; o ATP fornece energia para a tração e é consumido pela SERCA no relaxamento.","Sem ATP celular, o cálcio não pode ser recaptado e as cabeças de miosina não conseguem se desligar."],["Por que o jejum pré-abate de 12 a 24 horas é compulsório na indústria frigorífica?","Para promover o esvaziamento gastrintestinal, diminuindo a tensão visceral e evitando a ruptura mecânica e contaminação fecal.","A massa muscular profunda do animal saudável é estéril; a contaminação microbiológica decorre do manejo higiênico inadequado."]]],
["Glicólise Anaeróbica, Queda do pH e Rigor Mortis",`<p>A transformação do músculo em carne inicia-se na sangria, quando a interrupção circulatória corta o fornecimento de oxigênio tecidual. Sem oxigênio, a cadeia mitocondrial cessa e as células musculares operam exclusivamente em <b>[[glicólise anaeróbica]]</b> para tentar regenerar ATP.</p>`+tb(["Fase bioquímica","O que ocorre no tecido muscular","Parâmetros físicos e químicos"],[["[[Sangria e anóxia]]","Cessa o fluxo de O₂ e nutrientes; ativação forçada da glicogênio fosforilase","Glicogênio é quebrado em glicose e convertido em ácido lático"],["[[Queda do pH]]","Acúmulo de ácido lático no músculo sem depuração hepática (ausência de circulação)","O pH despenca do fisiológico 7,2–7,4 para a faixa ácida de <b>5,5 a 5,8</b>"],["[[Esgotamento de ATP]]","Esgotam-se as reservas de glicogênio e creatina-fosfato; síntese de ATP zera","A miosina trava de forma irreversível na actina gerando [[actomiosina]]"],["[[Rigor mortis]] pleno","Pontes cruzadas permanentes sem ATP; encurtamento máximo dos sarcômeros","Pico absoluto de dureza mecânica e rigidez cadavérica"]])+`<h3>Cinética do rigor mortis por espécie</h3><p>O tempo necessário para a instalação e resolução do rigor varia conforme o metabolismo de cada animal: aves e coelhos levam de <b>1 a 3 horas</b>; suínos levam de <b>4 a 12 horas</b> (média de 6 a 8 h); e bovinos e ovinos demandam de <b>12 a 24 horas</b> a 7 °C.</p><p class=w2><b>Proibição da desossa pré-rigor:</b> se a carcaça bovina for desossada prematuramente enquanto ainda possui ATP e cálcio livre, o músculo perde a oposição mecânica dos ossos e contrai-se violentamente sem limite, sofrendo encurtamento extremo que torna a carne incomestível e dura como pedra.</p>`+pg([["Achar que assar carne logo após o abate (4 a 6 horas) resulta em carne macia.","Nas primeiras horas a carne bovina está no auge do rigor mortis (actomiosina travada sem ATP), ficando extremamente dura."],["Acreditar que a queda de pH após a morte é prejudicial à carne.","A acidificação para 5,5–5,8 é o obstáculo fisiológico de Leistner que impede a proliferação de bactérias patogênicas."],["Achar que a célula no rigor mortis gasta energia para ficar dura.","A rigidez do rigor mortis é mantida pela ausência total de ATP, impedindo o desligamento miosina-actina."]]),["Sangria corta o O₂; glicólise anaeróbica acumula ácido lático e o pH desaba de 7,2 para 5,5-5,8","Sem ATP, a miosina trava na actina formando actomiosina: instala-se o rigor mortis pleno"],"Desossar carcaça bovina antes de 24h provoca contração desimpedida e dureza extrema.",[["Qual é a causa bioquímica da queda do pH muscular post mortem e qual sua relevância sanitária?","A glicólise anaeróbica gera ácido lático que se acumula sem circulação, reduzindo o pH para 5,5–5,8 (barreira bactericida natural).","Esse pH ácido constitui o obstáculo fisiológico de Leistner, inibindo o desenvolvimento de patógenos na carcaça."],["Como se instala o rigor mortis a nível molecular?","O esgotamento de glicogênio e creatina-fosfato zera o ATP; sem ATP, as cabeças de miosina travam na actina (actomiosina irreversível).","Sem energia, as bombas de cálcio também paralisam e os sarcômeros consolidam encurtamento rígido."],["Por que um boi abatido às 8h da manhã não pode ter sua carne assada ao meio-dia?","O músculo bovino leva de 15 a 24 horas para completar o rigor mortis; às 4h pós-abate a carne está no pico máximo de dureza mecânica.","A carne só adquire maciez após a ação proteolítica das calpaínas durante a maturação refrigerada."]]],
["Resolução do Rigor: Calpaínas, Calpastatina e Maturação",`<p>A maturação da carne (resolução do rigor mortis) compreende as modificações bioquímicas pós-rigor que determinam o relaxamento lento e o amolecimento estrutural do tecido muscular após 3 a 4 dias sob refrigeração.</p>`+tb(["Sistema proteolítico","Localização e cofator","Alvos e mecanismo de clivagem"],[["[[Calpaínas]] (μ e m)","Citosólicas; dependem de íons Ca²⁺ livres e pH 5,5–5,8","<b>Não degradam actina e miosina</b>; clivam titina, nebulina, desmina e a linha Z, soltando os sarcômeros"],["[[Catepsinas]] (B, D, H, L)","Lisossomais ácidas; liberadas no citosol com a acidificação","Clivam proteínas miofibrilares e podem atuar sobre filamentos contráteis em maturações prolongadas"],["[[Calpastatina]]","Inibidor endógeno específico da calpaína","Liga-se à calpaína impedindo sua ação proteolítica; regula a velocidade e extensão do amaciamento"]])+`<h3>O papel da genética e do sexo: Nelore vs. Angus</h3><p>Bovinos zebuínos (<i>Bos indicus</i>, como Nelore) e machos não castrados expressam teores naturalmente mais elevados de <b>calpastatina</b>. A calpastatina inibe a atividade das calpaínas, retardando ou bloqueando a fragmentação das linhas Z; por isso, a carne de Nelore inteiro é naturalmente mais firme do que a de novilhos taurinos castrados (Angus), exigindo maturações mais longas.</p>`+tb(["Modalidade de maturação","Condições operacionais","Características do produto"],[["[[Wet Aging]] (a úmido)","Embalagem com barreira plástica a vácuo, -1 °C a 2 °C por 14 a 28 dias","Sem perda de peso por evaporação; preserva a suculência e a cor fresca"],["[[Dry Aging]] (a seco)","Carcaça/cortes com osso expostos a 0 °C a 4 °C, umidade 75–85% por 30 a 60 dias","Concentração intensa de precursores de flavour por perda hídrica; notas amendoadas"]])+pg([["Pegadinha clássica: dizer que as calpaínas digerem a actina e a miosina.","As calpaínas clivam apenas as âncoras estruturais (titina, desmina e linha Z), sem hidrolisar actina e miosina."],["Achar que carne maturada é carne estragada por bactérias.","A maturação ocorre a -1 °C a 2 °C sob vácuo por enzimas endógenas estéreis do próprio músculo, sem ação microbiana."],["Dizer que macho inteiro Nelore tem carne macia sem necessidade de maturação.","Zebuínos e machos não castrados têm excesso de calpastatina, exigindo manejo e maturação rigorosos para amaciar."]]),["Calpaínas clivam a linha Z e a titina (não degradam actina/miosina); a calpastatina inibe a calpaína","Wet aging (vácuo a frio) e Dry aging (a seco com osso e ventilação) transformam a textura da carne"],"Amaciantes vegetais (papaína do mamão, bromelina do abacaxi) clivam tanto colágeno quanto miofibrilas.",[["Qual é a pegadinha de prova sobre a ação das calpaínas na maturação cárnea?","As calpaínas NÃO degradam actina e miosina; elas clivam apenas proteínas estruturais (linha Z, titina, desmina).","Ao romper essas âncoras da linha Z, os sarcômeros perdem a sustentação rígida e a carne amolece."],["Por que a carne de bovinos Nelore não castrados tende a ser mais dura que a de Angus castrados?","Animais zebuínos e machos inteiros produzem alta concentração de calpastatina, que inibe a calpaína amaciante.","Com a calpaína inibida pela calpastatina, a proteólise da linha Z e a elevação do MFI ocorrem de forma muito lenta."],["Diferencie os métodos de maturação Wet Aging e Dry Aging.","Wet Aging ocorre em embalagem a vácuo a -1 a 2 °C sem dessecação; Dry Aging é a seco (0 a 4 °C, UR 75-85%), concentrando sabor por evaporação.","No Dry Aging há quebra de peso por dessecação externa, mas desenvolvem-se aromas amendoados complexos."]]],
["Qualidade Sensorial: Cor da Carne, Mioglobina, CRA e Flavour",`<p>A cor e a suculência são os dois atributos de compra mais decisivos para o consumidor de carnes frescas.</p>`+tb(["Pigmento","Estado do ferro heme","Ligante no 6º sítio","Aparência visual e ocorrência"],[["[[Desoximioglobina]]","Fe²⁺ (ferroso, reduzido)","Sem ligante (vazio)","Vermelho-púrpura escuro; carnes recém-cortadas ou embaladas a vácuo"],["[[Oximioglobina]]","Fe²⁺ (ferroso, oxigenado)","Oxigênio molecular (O₂)","Vermelho-brilhante atraente; floresce após 15 a 30 min de contato com o ar ([[bloom]])"],["[[Metamioglobina]]","Fe³⁺ (férrico, oxidado)","Molécula de água (H₂O)","Marrom-carmim opaco; oxidação por luz e oxigênio após esgotamento de NADH"]])+`<h3>O mito do 'sangue' na bandeja e a CRA</h3><p>O animal sofre sangria total no abatedouro com drenagem completa do sangue circulante. O líquido avermelhado que exsuda na bandeja é apenas <b>água celular rica em mioglobina hidrossolúvel, eletrólitos e vitaminas</b>, decorrente da redução transitória da [[Capacidade de Retenção de Água]] (CRA). A CRA é mínima no ponto isoelétrico das proteínas musculares (<b>pI entre 5,0 e 5,2</b>), onde as cargas positivas e negativas se igualam e os filamentos se aproximam, expulsando a água para fora.</p><h3>Origem bioquímica do aroma de carne assada (Flavour)</h3><p>A carne crua possui apenas sabor suave, levemente salino e metálico. O aroma de carne assada surge durante a cocção culinária quando precursores acumulados na maturação (a [[hipoxantina]] no teor ideal de <b>1,5 a 2,0 µmol/g</b> e a ribose livre oriunda da hidrólise do ATP em IMP) reagem com aminoácidos via <b>Reação de Maillard</b> e degradação de Strecker, liberando centenas de voláteis sulfurados e heterocíclicos.</p>`+pg([["Achar que o líquido vermelho na embalagem é sangue sujo do animal.","É exsudato aquoso celular composto de água, proteínas sarcoplasmáticas, eletrólitos e mioglobina."],["Acreditar que mancha marrom de metamioglobina significa carne podre por bactérias.","A metamioglobina é oxidação química inorgânica do ferro heme que precede qualquer deterioração microbiana."],["Achar que carne fresca crua já tem aroma de churrasco.","O aroma de carne assada só nasce na chapa quente pela reação de Maillard entre ribose, hipoxantina e aminoácidos."]]),["Ciclo da mioglobina: desoximioglobina (púrpura) → oximioglobina (vermelho vivo) → metamioglobina (marrom)","CRA é mínima no ponto isoelétrico (pH 5,0-5,2); o líquido da bandeja é água com mioglobina, não sangue"],"No vácuo a carne fica roxa; ao abrir a embalagem, espere 15 min que o oxigênio faz o bloom vermelho.",[["Quais são os 3 estados químicos da mioglobina e que cores conferem à carne?","Desoximioglobina (Fe²⁺ sem O₂, púrpura), oximioglobina (Fe²⁺ com O₂, vermelho vivo) e metamioglobina (Fe³⁺ oxidado, marrom).","A transição de desoxi para oxi chama-se bloom; a perda de elétrons do ferro leva à metamioglobina."],["Por que o líquido vermelho na bandeja do supermercado não é sangue?","Porque o sangue foi drenado na sangria do abatedouro; o líquido é exsudato aquoso celular com mioglobina e eletrólitos.","Decorre do colapso parcial da Capacidade de Retenção de Água (CRA) quando o pH aproxima-se do pI proteico."],["Como a maturação gera os precursores do aroma (flavour) de carne assada?","O ATP residual é clivado em inosina monofosfato (IMP), ribose livre e hipoxantina (1,5 a 2,0 µmol/g).","No calor da cocção, a ribose e os aminoácidos reagem via Maillard e Strecker, gerando compostos aromáticos voláteis."]]],
["Carnes Anômalas (PSE e DFD) e Tecnologias de Manejo Pré-Abate",`<p>O estresse e as falhas de manejo ante mortem acarretam anomalias metabólicas que causam severas perdas econômicas e tecnológicas à cadeia da carne.</p>`+tb(["Anomalia cárnea","Espécie mais afetada","Tipo de estresse ante mortem","Mecanismo bioquímico","Características físicas e destino"],[["[[Carne PSE]] (Pale, Soft, Exudative)","Suínos (gene Halotano/PSS) e perus","Estresse agudo rápido (brigas na rampa, choques elétricos, calor > 38 °C)","Glicólise hiperacelerada com carcaça quente: pH desaba para < 5,4 aos 45 min; calor + acidez desnatura miosina","Pálida, flácida e muito exsudativa; água expulsa dispersa a luz; rejeitada para presunto cozido"],["[[Carne DFD]] (Dark, Firm, Dry)","Bovinos e ovinos","Estresse crônico prolongado (viagens longas, jejum > 24h, brigas no curral)","Esgotamento prévio de glicogênio: sem ácido lático, pH final após 24h fica alto (> 6,0–6,2) com alta CRA","Escura (cor de fígado), firme, seca e pegajosa; perde barreira ácida e apodrece rápido por Pseudomonas"]])+`<h3>Abate humanitário e insensibilização oficial</h3><p>Para assegurar o bem-estar animal e a inocuidade sanitária, métodos humanitários de insensibilização (atordoamento) são compulsórios: pistola pneumática ou dardo cativo com concussão cerebral para bovinos; eletronarcose ou asfixia gradual por CO₂ para suínos e aves. A sangria deve ser executada imediatamente nos grandes vasos cervicais (jugulares e carótidas), retirando 50% a 60% do sangue total.</p><h3>Biotecnologia: Carne Cultivada em Biorreatores</h3><p>A produção de [[carne cultivada]] (<i>cultured meat</i>) realiza-se em 4 etapas: 1) Biópsia e isolamento de células-tronco satélites miogênicas; 2) Proliferação celular em meio nutriente dentro de biorreatores; 3) Diferenciação em miotubos sobre suportes tridimensionais (<i>scaffolds</i>) comestíveis de colágeno ou polissacarídeos; e 4) Processamento e estruturação física da biomassa proteica.</p>`+pg([["Regra prática de ouro: confundir estresse agudo com estresse crônico.","Estresse rápido e agudo gera PSE (carne pálida e aguada); estresse crônico prolongado gera DFD (carne escura de fígado e seca)."],["Achar que carne DFD é boa porque retém muita água.","Em pH > 6,0 ela perdeu a barreira ácida natural e apodrece em poucos dias por bactérias psicrotróficas."],["Acreditar que carne PSE pode ser usada normalmente para fazer presunto cozido fatiado.","A miosina desnaturada perde a capacidade de formar gel proteico coeso, desmanchando na fatiadora."]]),["Estresse rápido gera PSE (pH < 5,4 aos 45 min, carcaça quente, miosina desnaturada, aguada)","Estresse crônico gera DFD (glicogênio zerado, pH > 6,0, escura, atrai bactérias deteriorantes)"],"A medição compulsória do pH aos 45 min (pH1) e às 24h (pH24) detecta PSE e DFD no frigorífico.",[["Compare as anomalias PSE e DFD quanto ao tipo de estresse, cinética do pH e aspecto visual.","PSE: estresse agudo rápido, pH desaba (< 5,4) em carcaça quente, carne pálida, mole e exsudativa. DFD: estresse crônico, pH alto (> 6,0), carne escura, firme e seca.","No PSE a miosina desnatura e expele água; no DFD o pH alto longe do pI retém água e impede a oxigenação da mioglobina."],["Por que a carne PSE é rejeitada pela indústria para a fabricação de presunto cozido?","Porque o calor associado ao pH ácido precoce desnaturou as proteínas miofibrilares (miosina e actina).","Proteínas desnaturadas perdem a capacidade de extração por sal e não formam o gel necessário para manter as fatias coesas."],["Quais são as 4 etapas biotecnológicas para a produção de carne cultivada em laboratório?","1) Isolamento de células-tronco satélites; 2) Proliferação em biorreator; 3) Diferenciação em miotubos sobre scaffolds; 4) Estruturação final.","O grande desafio reside na reconstrução tridimensional de feixes musculares com marmoreio e tecido conectivo."]]]];

[[3],"Um cozinheiro adquire embalagem a vácuo de picanha maturada e, ao rompê-la, assusta-se com a cor roxa escura da carne e um odor ácido passageiro, acreditando que o produto está podre. O gastrônomo do restaurante pede calma e orienta aguardar 20 minutos sobre a bancada. O que acontecerá quimicamente com a carne nesse intervalo?",["O oxigênio atmosférico se ligará ao ferro ferroso (Fe²⁺) da desoximioglobina formando oximioglobina vermelho-brilhante (bloom) e os voláteis de confinamento evaporarão","As bactérias aeróbicas morrerão em contato com a luz UV","O ácido lático evaporará completamente elevando o pH para 7,4","A miosina gelatinizará transformando a peça em carne macia"],0,"A cor púrpura é típica da [[desoximioglobina]] na ausência de oxigênio. Após abertura e contato com o ar (15 a 30 minutos), ocorre o [[bloom]], convertendo o pigmento em [[oximioglobina]] vermelho-vivo."],
