<script>
// ===== CONTEÚDO (base: slides da aula + livro) =====
const T=[
["O que é vitamina",`<p>O termo surgiu em <b>1912</b> com Casimir Funk (<i>vita</i> + <i>amina</i>). [[Vitaminas]] são compostos orgânicos e bioativos, necessários em <b>microquantidades</b>, que o corpo não sintetiza em quantidade suficiente e que atuam como [[coenzimas]] no crescimento e no metabolismo. Não fornecem calorias.</p><div class=w><table><tr><th></th><th>Lipossolúveis (A, D, E, K)</th><th>Hidrossolúveis (B e C)</th></tr><tr><td>Absorção</td><td>Junto com gorduras</td><td>Fração hidrofílica do alimento</td></tr><tr><td>Estoque</td><td>Fígado e tecido adiposo</td><td>Quase nulo (exceto B12)</td></tr><tr><td>Excreção</td><td>Fezes/bile</td><td>Urina</td></tr><tr><td>Toxicidade</td><td>Maior risco em excesso</td><td>Rara</td></tr></table></div><p class=n>Regra de ouro: nenhum alimento isolado fornece todas as vitaminas. O escorbuto (Cartier, 1536; Lind, 1753) mostrou que a falta de um único composto destrói tecidos.</p>`,["Vitaminas: orgânicas, em microquantidades e atuando como coenzimas","Lipo: estocadas, risco de excesso. Hidro: urina (B12 é exceção)"],"Hidrossolúveis quase não são estocadas, mas a B12 é a exceção.",[["Cite 3 características de uma vitamina.","Orgânica e bioativa, necessária em microquantidades, não sintetizada em quantidade suficiente e com função de [[coenzima]]."],["Por que a toxicidade é mais rara nas hidrossolúveis?","Quase não são armazenadas e o excesso sai pela urina. As lipossolúveis ficam no fígado e no tecido adiposo."],["O que o escorbuto ensinou?","Que a ausência de um único composto em microquantidades (hoje, a vitamina C) pode destruir tecidos."]]],
["Lipossolúveis: A, D, E, K",`<p>A matriz oleosa protege essas vitaminas; a presença de antioxidantes no alimento as resguarda da degradação.</p><div class=w><table><tr><th>Vit.</th><th>Química e fontes</th><th>Funções</th><th>Perdas</th></tr><tr><td>A</td><td>Retinoides: retinol (CH₂OH), retinal (CHO), ácido retinoico (COOH). Fígado, leite; β-caroteno em cenoura, brócolis, agrião</td><td>Atividade de retinoide; 6 µg de β-caroteno = 1 µg de retinol (3,33 UI)</td><td>Oxidação, luz UV, calor, Fe²⁺ e Cu²⁺ (duplas conjugadas)</td></tr><tr><td>D</td><td>D2 (ergocalciferol): cogumelos e leveduras. D3 (colecalciferol): peixes gordurosos, fígado, gema</td><td>UVB + 7-dehidrocolesterol → D3 → fígado (25-OH) → rim (1,25-di-OH, [[calcitriol]])</td><td>Oxidação e isomerização; mais estável que a A</td></tr><tr><td>E</td><td>Tocoferóis e tocotrienóis (α, β, γ, δ). Óleos vegetais (α e γ), castanhas, cereais integrais</td><td>Antioxidante: interrompe a [[peroxidação lipídica]]; regenerada pela vitamina C</td><td>Oxigênio, luz, metais; relativamente estável ao calor</td></tr><tr><td>K</td><td>K1 filoquinona (vegetais), K2 menaquinona (fermentados, microbiota), K3 menadiona (sintética)</td><td>Coagulação; fixação de Ca no osso; evita Ca em vasos (K2: tecidos extra-hepáticos, maior meia-vida)</td><td>Fotossensível; estável ao calor e O₂</td></tr></table></div><p class=n>Meio alcalino destrói especificamente E e K. Para minimizar perdas: vácuo ou atmosfera modificada, abrigo da luz, controle de tempo × temperatura, matriz lipídica e evitar [[pró-oxidantes]].</p>`,["A: sensível a O₂, UV, calor e metais; 6 µg β-caroteno = 1 µg retinol","E interrompe a peroxidação lipídica e é regenerada pela vitamina C"],"A luz solar gera D3 na pele, nunca D2. E e K caem em meio alcalino.",[["Como o corpo forma e ativa a D3?","UVB converte o 7-dehidrocolesterol em D3; o fígado forma 25-OH-D e o rim forma o [[calcitriol]]."],["Qual a origem de D2 e D3?","D2 é vegetal/fúngica (cogumelos, leveduras); D3 é animal (peixes gordurosos, fígado, gema) e formada na pele."],["Por que a vitamina E aumenta a vida de prateleira?","Por ser antioxidante, interrompe a [[peroxidação lipídica]]."],["Diferencie K1, K2 e K3.","K1: vegetal, coagulação. K2: fermentados e microbiota, ossos, maior meia-vida. K3: sintética."]]],
["Hidrossolúveis: complexo B",`<p>Três grupos: <b>liberadoras de energia</b> (B1, B2, B3, B5, B7), <b>hematopoiéticas</b> (B9, B12) e <b>outras</b> (B6 e C). Têm baixo peso molecular e não fornecem calorias.</p><div class=w><table><tr><th>Vit.</th><th>Forma/coenzima</th><th>Função</th><th>Estabilidade e dicas</th></tr><tr><td>B1 tiamina</td><td>Pirofosfato de tiamina</td><td>Descarboxilação (glicólise, Krebs)</td><td>Cereais integrais, carne suína</td></tr><tr><td>B2 riboflavina</td><td>FMN, FAD</td><td>Transporte de elétrons</td><td>Fotossensível (leite em garrafa transparente); resiste à pasteurização</td></tr><tr><td>B3 niacina</td><td>NAD⁺, NADP⁺</td><td>Oxirredução; formada do triptofano</td><td>Muito estável; falta causa pelagra</td></tr><tr><td>B5 pantotênico</td><td>Coenzima A</td><td>Síntese e oxidação de ácidos graxos</td><td>Onipresente</td></tr><tr><td>B6 piridoxina</td><td>Piridoxal fosfato</td><td>Transaminação; hemoglobina</td><td>Estável ao calor e ácido, instável à luz; perda de 3% (pasteurizado) e 5% (UHT)</td></tr><tr><td>B7 biotina</td><td>Biocitina</td><td>Carboxilações (piruvato carboxilase)</td><td>Estável a calor, luz, O₂, pH 5–8; [[avidina]] da clara crua a inativa; perde por lixiviação</td></tr><tr><td>B9 ác. fólico</td><td>Tetra-hidrofolato</td><td>Unidades de 1 carbono; DNA e RNA</td><td>Falta: [[anemia megaloblástica]] e defeitos do tubo neural</td></tr><tr><td>B12 cobalamina</td><td>Ciano- ou metilcobalamina (Co)</td><td>Formação de células sanguíneas</td><td>Estável em pH 4–6; destruída por luz, ácidos, bases; fontes animais</td></tr></table></div>`,["Energia: B1, B2, B3, B5, B7. Sangue: B9 e B12. Outras: B6 e C","Avidina inativa a biotina; B2 e B12 são sensíveis à luz"],"Clara de ovo crua: a [[avidina]] deixa a biotina indisponível.",[["Qual vitamina a [[avidina]] inativa?","A biotina (B7), quando a clara está crua."],["Qual a deficiência de niacina e o papel do triptofano?","Pelagra (dermatite, diarreia e demência); a niacina pode ser formada do triptofano."],["Por que embalagem transparente prejudica o leite?","A riboflavina é fotossensível e a luz a degrada, embora resista à pasteurização."],["Por que suplementar B9 antes e no início da gestação?","Sua falta causa defeitos do tubo neural e [[anemia megaloblástica]]."]]],
["Vitamina C",`<p>O ácido ascórbico é oxidado de duas formas:</p><div class=w><table><tr><th>Via</th><th>Produto</th><th>Causas</th></tr><tr><td>Reversível</td><td>[[Dehidroascórbico]] (perda parcial)</td><td>Íons metálicos, calor, luz, pH acima de 6,0</td></tr><tr><td>Irreversível</td><td>Ácido 2,3-dicetogulônico (perda de atividade)</td><td>Íons metálicos, baixa umidade</td></tr></table></div><p>Fontes (mg/100 g): goiaba 200, brócolis 150, limão 80, couve-flor 60, morango 60, laranja 50. Regenera a vitamina E.</p><p class=n>Pós-colheita: a [[ascorbato oxidase]] aumenta durante o armazenamento a 20 °C e a vitamina C cai.</p>`,["C oxida reversivelmente a dehidroascórbico e irreversivelmente a dicetogulônico","Armazenar fruta ativa enzimas que consomem a C"],"Acima de pH 6,0 a oxidação da C acelera.",[["O que ocorre na oxidação da vitamina C?","Reversível: ao [[dehidroascórbico]] (metais, calor, luz, pH acima de 6). Irreversível: ao 2,3-dicetogulônico, sem atividade."],["Por que a C cai na fruta armazenada?","A [[ascorbato oxidase]] fica ativa e consome a vitamina."],["Que relação a C tem com a E?","Regenera a vitamina E."]]],
["Perdas e conservação",`<p>Fatores: calor, luz, oxigênio e <b>[[lixiviação]]</b>. A perda começa na produção (cultivar, clima, maturação), piora na pós-colheita (enzimas oxidativas e hidrolíticas) e continua no varejo (oscilação térmica e luz UV).</p><div class=w><table><tr><th>Processo</th><th>Mecanismo</th><th>Mais afetadas</th></tr><tr><td>Secagem</td><td>Mais área exposta ao O₂</td><td>Lipossolúveis e C</td></tr><tr><td>Cocção úmida/branqueamento</td><td>Lixiviação</td><td>Todas as hidrossolúveis</td></tr><tr><td>Calor extremo</td><td>Degradação térmica</td><td>Complexo B (esterilização &gt; pasteurização)</td></tr><tr><td>pH/aditivos</td><td>Meio alcalino, bicarbonato (SO₂ também interfere)</td><td>E e K</td></tr></table></div><h3>Como minimizar perdas (hidrossolúveis)</h3><ul><li>Pouca água no cozimento; evitar cortes muito pequenos</li><li>Evitar reaquecimentos e guardar comida já cozida</li><li>Pouco tempo de aquecimento nos processados</li><li>Sem bicarbonato para manter o verde</li><li>Embalagem opaca, longe de calor extremo</li></ul><p class=n><b>Três mandamentos:</b> a solubilidade dita a regra; calor, O₂, UV e pH controlam a estabilidade; a variedade alimentar é inegociável.</p>`,["Cocção úmida: lixiviação das hidrossolúveis","Secagem: oxidação de lipossolúveis e C"],"Esterilização comercial prejudica mais o complexo B que a pasteurização.",[["Por que a cocção úmida atinge todas as hidrossolúveis?","Pela [[lixiviação]]: a água as solubiliza e arrasta."],["Por que secar prejudica lipossolúveis e C?","Aumenta a área exposta ao O₂ e favorece a oxidação."],["Cite 4 práticas para reduzir perdas de hidrossolúveis.","Pouca água, evitar reaquecimento e guarda após cozimento, sem bicarbonato, embalagem opaca, cortes maiores."],["Quais são os 3 mandamentos?","Solubilidade dita a regra; calor, O₂, UV e pH controlam a estabilidade; variedade alimentar é inegociável."]]]];
const G={
"vitaminas":["Compostos orgânicos essenciais com alta atividade biológica requeridos na dieta humana em microquantidades (mg ou microgramas); não possuem valor calórico direto, mas atuam como coenzimas ou precursores em vias metabólicas vitais.",0],
"lipossolúveis":["Vitaminas solúveis em matrizes apolares e lipídios (A, D, E e K); absorvidas no intestino delgado junto com micelas mistas de gordura e ácidos biliares, são estocadas no fígado e tecido adiposo, com risco aumentado de hipervitaminose tóxica em megadoses.",0],
"hidrossolúveis":["Vitaminas solúveis em água (todas do complexo B e vitamina C); absorvidas prontamente no trato digestório alto, não possuem depósitos teciduais substanciais (com exceção da vitamina B12) e seus excessos são continuamente eliminados pela urina.",0],
"coenzimas":["Moléculas orgânicas não proteicas de baixo peso molecular, muitas vezes derivadas de vitaminas hidrossolúveis (como FAD, FMN, NAD+, NADP+, CoA e TPP), que se associam transitoriamente ou permanentemente a apoenzimas para viabilizar reações catalíticas vitais.",0],
"retinoides":["Família de compostos com atividade biológica de vitamina A contendo um anel beta-ionona e cadeia polienoica: retinol (álcool), retinal (aldeído, crítico para a rodopsina visual na retina) e ácido retinoico (hormônio de diferenciação celular epitelial).",1],
"carotenoides":["Pigmentos fitoquímicos lipofílicos amarelos, laranjas e vermelhos sintetizados por vegetais; atuam como antioxidantes naturais de membrana e alguns (com ao menos um anel beta-ionona não substituído) atuam como provitamina A.",1],
"provitamina a":["Carotenoides da dieta que podem ser enzimaticamente clivados na mucosa intestinal por carotenoides clivagem oxigenase (BCO1) gerando retinol; a taxa oficial de conversão é de 6 microgramas de beta-caroteno para 1 micrograma de retinol equivalente (3,33 UI).",1],
"calcitriol":["Forma hormonal ativa da vitamina D (1,25-di-hidroxivitamina D3) gerada após duas hidroxilações sequenciais: a primeira no fígado (25-hidroxilase) e a segunda no rim (1-alfa-hidroxilase); estimula a transcrição da calbindina e a absorção intestinal de Ca e fósforo.",1],
"tocoferol":["Forma de vitamina E mais abundante e ativa no plasma humano (alfa-tocoferol); atua como potente antioxidante lipofílico que quebra cadeias de radicais livres, doando um hidrogênio fenólico a radicais peroxila e protegendo membranas celulares e ácidos graxos poli-insaturados.",1],
"peroxidação lipídica":["Reação oxidativa radicalar em cadeia que degrada ácidos graxos poli-insaturados (PUFAs) nas membranas celulares e óleos alimentares, gerando hidroperóxidos lipídicos e aldeídos voláteis responsáveis pelo ranço oxidativo.",1],
"pró-oxidantes":["Metais de transição em estado de valência reduzida livre (especialmente Fe2+ e Cu2+) que catalisam a decomposição de peróxidos via reação de Fenton, gerando radicais hidroxila altamente destrutivos para vitaminas e lipídeos.",1],
"filoquinona":["Vitamina K1 natural de origem vegetal sintetizada nos tilacoides de folhosos verdes (espinafre, couve, brócolis); atua como cofator essencial para a enzima gama-glutamil carboxilase na ativação de fatores de coagulação sanguínea.",1],
"menaquinona":["Vitamina K2 sintetizada pela microbiota colônica humana e presente em alimentos fermentados (natto, queijos maturados); possui cadeia lateral isoprenoide mais longa, maior meia-vida plasmática e atua seletivamente na carboxilação da osteocalcina óssea.",1],
"menadiona":["Vitamina K3 sintética desprovida de cadeia lateral lipofílica; solúvel em água, possui cerca do dobro da atividade biológica das formas naturais por peso molar, sendo bioconvertida em menaquinona no organismo animal.",1],
"tiamina":["Vitamina B1; fosforilada intracelularmente em pirofosfato de tiamina (TPP), coenzima indispensável do complexo piruvato desidrogenase na glicólise aeróbica e da transcetolase na via das pentoses; sensível a calor, UV, pH alcalino e sulfitos alimentares.",2],
"riboflavina":["Vitamina B2; componente estrutural central das coenzimas de oxidorredução FMN e FAD que atuam na cadeia respiratória mitocondrial e ciclo de Krebs; possui coloração amarelo-esverdeada fluorescente, resistente ao calor de pasteurização mas extremamente fotossensível à luz UV.",2],
"niacina":["Vitamina B3 (ácido nicotínico e nicotinamida); precursora das coenzimas NAD+ e NADP+ centrais no metabolismo de carboidratos e lipídeos; pode ser sintetizada endogenamente a partir do aminoácido triptofano (60 mg Trp = 1 mg niacina); sua carência severa causa a pelagra.",2],
"ácido pantotênico":["Vitamina B5; componente estrutural indispensável da Coenzima A (CoA) e da proteína carreadora de acila (ACP), essenciais para o transporte de grupos acetil no ciclo de Krebs e na biossíntese/beta-oxidação de ácidos graxos; onipresente na dieta.",2],
"piridoxina":["Vitamina B6; sua forma coenzimática ativa piridoxal fosfato (PLP) atua em mais de 100 reações enzimáticas do metabolismo de aminoácidos (transaminação, descarboxilação e síntese de heme da hemoglobina); perde até 5% no processo UHT do leite.",2],
"biotina":["Vitamina B7; atua como carreador prostético de dióxido de carbono ligado covalentemente a enzimas carboxilases essenciais (piruvato carboxilase na gliconeogênese e acetil-CoA carboxilase na lipogênese); inativada no intestino pela avidina da clara crua.",2],
"avidina":["Glicoproteína tetramérica termolábil presente na clara de ovo crua que se liga com afinidade extraordinária (uma das mais fortes da natureza) à biotina alimentar, impedindo completamente sua absorção intestinal; desnaturada e inativada pelo cozimento térmico.",2],
"ácido fólico":["Vitamina B9 (folato); em sua forma coenzimática tetra-hidrofolato (THF) atua na transferência de unidades monocarbonadas essenciais para a biossíntese de nucleotídeos de DNA (timidilato) e divisão celular; sua deficiência causa defeitos do tubo neural fetal e anemia megaloblástica.",2],
"cobalamina":["Vitamina B12; molécula organometálica complexa contendo um átomo central de cobalto coordenada a anéis corrina, sintetizada exclusivamente por microrganismos e encontrada na dieta apenas em produtos de origem animal; essencial para a maturação de eritrócitos e bainha de mielina.",2],
"anemia megaloblástica":["Transtorno hematológico caracterizado pela presença de hemácias anormais de grande volume e imaturas na medula óssea e sangue periférico, decorrente do bloqueio na síntese de DNA celular provocado por carência grave de folato (B9) ou cobalamina (B12).",2],
"pelagra":["Doença nutricional carencial sistêmica causada pela deficiência crônica e grave de niacina (vitamina B3) ou de seu precursor triptofano na dieta; caracterizada classicamente pela tríade dos '3 Ds': dermatite bilateral simétrica fotossensível, diarreia aquosa e demência neurológica.",2],
"ácido ascórbico":["Vitamina C; potente antioxidante hidrossolúvel que atua como cofator redutor mantendo íons ferro e cobre na valência reduzida para hidroxilação de prolina e lisina na síntese de colágeno; atua ainda no resgate da vitamina E oxidada e melhora a absorção do ferro vegetal.",3],
"dehidroascórbico":["Forma oxidada reversível da vitamina C que se forma após a doação sequencial de dois elétrons; mantém atividade vitamínica e pode ser enzimaticamente reduzida de volta a ácido ascórbico pelas células via glutationa redutase.",3],
"ascorbato oxidase":["Enzima oxidorredutase vegetal contendo átomos de cobre que oxida ativamente o ácido ascórbico em presença de oxigênio molecular durante o armazenamento e maceração mecânica de frutas e vegetais, acelerando a perda do valor vitamínico.",3],
"lixiviação":["Mecanismo físico-químico preponderante de perda de nutrientes solúveis em água (como vitaminas hidrossolúveis e minerais) durante operações culinárias ou industriais que utilizam água abundante em ebulição ou branqueamento, onde os compostos são dissolvidos e descartados com a água.",4],
"bicarbonato de sódio":["Sal inorgânico alcalinizante (NaHCO3) utilizado empiricamente para preservar a cor verde viva de hortaliças cozidas; seu meio alcalino desestabiliza a ligação tiazólica da tiamina, oxida a vitamina C e destrói prontamente as vitaminas E e K.",4],
"branqueamento":["Tratamento térmico brando e rápido com água quente (85–95 °C) ou vapor aplicado a vegetais antes do congelamento ou desidratação; tem como objetivo principal inativar enzimas deteriorantes (polifenoloxidase, peroxidase, ascorbato oxidase) preservando vitaminas.",4],
"triptofano":["Aminoácido aromático essencial que atua como substrato precursor endógeno para a síntese da vitamina B3 (niacina) no fígado humano, requerendo a proporção estequiométrica de 60 mg de triptofano dietético para gerar 1 mg de equivalente de niacina.",2]

const X=[`<h3>Aprofundando</h3><p>As [[lipossolúveis]] vêm associadas à fração lipídica e são absorvidas junto com os lipídeos da dieta; ficam estocadas no tecido adiposo e no fígado, o que explica o risco de acúmulo. As [[hidrossolúveis]] acompanham a fração aquosa, têm baixo peso molecular, exigem suprimento diário e o excesso sai pela urina.</p><p>O teor de vitaminas de um alimento depende da variedade/cultivar, do clima, da maturação, das práticas agrícolas e, nos animais, da ração, e ainda sofre as perdas da pós-colheita, do processamento e do varejo (último tópico).</p>`,`<h3>Aprofundando</h3><p><b>Vitamina A.</b> Os [[retinoides]] têm anel β-ionona e cadeia com duplas ligações conjugadas, o ponto vulnerável: a oxidação e os [[radicais livres]] atacam essa cadeia, e a luz UV, o calor e metais como Fe²⁺ e Cu²⁺ aceleram a degradação. Vegetais não têm retinol pronto (a tabela mostra 0 na cenoura), e sim [[carotenoides]] como o β-caroteno, convertidos em retinol na taxa de 6 µg para 1 µg.</p><p><b>Vitamina D.</b> D2 e D3 são esteróis que diferem na cadeia lateral. A exposição excessiva à luz degrada a molécula (oxidação e [[isomerização]]), mas ela é mais estável que a A.</p><p><b>Vitamina E.</b> Sua ação antioxidante vem de doar um hidrogênio fenólico e um elétron aos radicais, o que interrompe a [[peroxidação lipídica]]. É sensível a O₂ e luz e relativamente estável ao calor; por isso contribui com a estabilidade oxidativa (shelf life) dos óleos.</p><p><b>Vitamina K.</b> A [[filoquinona]] (K1) é vegetal, a [[menaquinona]] (K2) vem da microbiota e de fermentados e a [[menadiona]] (K3) é sintética. A K1 se relaciona mais à coagulação e a K2 ao metabolismo ósseo, com maior meia-vida; ambas evitam a deposição de Ca nos vasos.</p>`,`<h3>Aprofundando</h3><p><b>B1 ([[tiamina]]).</b> Coenzima das descarboxilações da glicólise e do ciclo de Krebs. Como hidrossolúvel, sofre lixiviação e é degradada por UV e por [[sulfitos]] (dióxido de enxofre).</p><p><b>B2 ([[riboflavina]]).</b> Origem de FMN e FAD, essenciais ao transporte de elétrons. É fotossensível: a luz a converte em [[lumiflavina]], o que explica a perda no leite em garrafa transparente. Resiste à pasteurização e dá a cor amarelada do leite; meio alcalino e bicarbonato a degradam.</p><p><b>B3 ([[niacina]]).</b> Forma NAD⁺ e NADP⁺ e pode ser sintetizada a partir do [[triptofano]], então depende da qualidade proteica da dieta; sua falta causa [[pelagra]]. É uma das vitaminas mais estáveis (calor, luz, ácidos, álcalis).</p><p><b>B6.</b> O piridoxal fosfato atua em transaminações e na síntese da hemoglobina. O [[piridoxal]] reage com grupos NH das proteínas e perde a atividade; é estável ao calor e em meio ácido, mas instável à luz em meio neutro ou alcalino (leite pasteurizado perde 3%, UHT 5%).</p><p><b>B7, B9 e B12.</b> A [[biotina]] é cofator de carboxilases, como a piruvato carboxilase, e é estável ao calor, à luz e ao O₂. O tetra-hidrofolato (B9) transfere unidades de um carbono para a síntese de DNA e RNA. A [[cobalamina]] contém cobalto, é destruída pela luz e é a exceção ao “quase nenhum estoque” dos hidrossolúveis.</p>`,`<h3>Aprofundando</h3><p>O ácido ascórbico é muito polar e, por isso, muito solúvel em água, o que o deixa vulnerável à lixiviação no pré-preparo de frutas e hortaliças. Íons metálicos (Cu²⁺ e Fe²⁺), calor, luz, condições levemente alcalinas (acima de pH 6,0) e enzimas como a ascorbato oxidase aceleram sua oxidação a [[dehidroascórbico]], que ainda pode ser regenerado; a hidrólise seguinte forma o ácido 2,3-dicetogulônico, sem atividade.</p><p>Na pós-colheita, a atividade da [[ascorbato oxidase]] cresce com os dias de estocagem a 20 °C enquanto o teor de C despenca. A vitamina C também regenera a vitamina E oxidada.</p>`,`<h3>Aprofundando</h3><p>A estabilidade de cada vitamina depende de combinações de pH, oxigênio, metais, luz e temperatura. As lipossolúveis tendem a acompanhar a estabilidade dos lipídeos que as carregam (daí a importância da [[matriz lipídica]] e de evitar pró-oxidantes); as hidrossolúveis sofrem principalmente por lixiviação, calor e pH.</p><p>Na prática: o [[branqueamento]] e a fervura arrastam hidrossolúveis para a água; o [[bicarbonato de sódio]] mantém o verde, mas degrada vitaminas como E, K e riboflavina; a [[esterilização comercial]] causa mais perdas que a [[pasteurização]] (no leite, a B6 perde cerca de 3% na pasteurização e 5% no UHT). Pensar no mecanismo (área exposta, solubilidade, pH, luz) ajuda a prever qual vitamina cai em cada processo.</p>`];

ar aumenta muito e o oxigênio oxida as lipossolúveis e a C.","Cada prática ataca um fator: água (lixiviação), tempo e reaquecimento (calor), bicarbonato (pH), embalagem opaca (luz).","Eles resumem a aula: a solubilidade define o destino, os catalisadores definem a estabilidade e nenhuma matriz fornece tudo."]];

function AL(h){const seen=new Set([...h.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]));let inA=0;const ks=Object.keys(G).filter(k=>k.length>4).sort((a,b)=>b.length-a.length);const re=new RegExp("(?<![\\p{L}\\d])("+ks.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\p{L}\\d])","giu");return h.split(/(<[^>]+>)/).map(p=>{if(p[0]=="<"){if(/^<a[ >]/.test(p))inA=1;if(p=="</a>")inA=0;return p}if(inA)return p;return p.replace(re,m=>{const k=m.toLowerCase();if(seen.has(k))return m;seen.add(k);return `<a href="#" class="t" data-k="${k}">${m}</a>`})}).join("")}

const CL=[[[2],"Uma gestante de 8 semanas, vegetariana estrita, tem fadiga e hemograma com macrócitos. O médico prescreve suplementação antes de qualquer outro exame. Qual raciocínio explica o quadro e a urgência?",["Falta de B6: transaminação reduzida e risco de pelagra","Falta de B9: DNA com síntese prejudicada e risco de defeitos do tubo neural","Falta de B7: avidina bloqueando as carboxilações no intestino","Excesso de vitamina A: acúmulo lipossolúvel com toxicidade"],1,"A [[anemia megaloblástica]] por falta de folato impede a síntese de DNA e a divisão celular, e o tubo neural se forma nas primeiras semanas; por isso a suplementação é antes e no início da gestação. A falta de B12 também causa anemia megaloblástica, mas o risco gestacional do tubo neural é do folato."],[[2],"Um homem com dieta pobre em proteínas de boa qualidade tem dermatite em áreas expostas ao sol, diarreia e confusão mental. Qual interpretação é mais coerente?",["Deficiência de vitamina C, porque a lactona se oxidou","Deficiência de vitamina K, porque a coagulação está falhando","Excesso de piridoxina, porque a hemoglobina aumentou muito","Deficiência de niacina, sem triptofano suficiente para compensar"],3,"Dermatite, diarreia e demência (3 D) caracterizam a [[pelagra]]. A niacina também é formada a partir do [[triptofano]], então a qualidade proteica pesa. Como a niacina é muito estável ao calor, a falta vem da dieta, não do preparo."],[[2],"Uma pessoa bebe várias claras de ovo cruas por dia há meses e os exames indicam carência de biotina, apesar de dieta variada. Qual a explicação mais provável?",["A avidina da clara crua prendeu a biotina no intestino","O calor do preparo destruiu a biotina da clara","A biotina é lipossolúvel e ficou retida no fígado","Faltou vitamina K para as reações de carboxilação"],0,"A [[avidina]] atua na clara crua e deixa a biotina indisponível. A biotina é estável ao calor, à luz e ao O₂, então a causa é a ligação no intestino. Ela participa de carboxilações, c const TM=[
["Conceito, Determinação em Mufla (550 °C), Pilares e DRIs",`<p>Os <b>[[minerais]]</b> são elementos químicos inorgânicos essenciais que não fornecem energia metabólica direta e não contêm carbono, hidrogênio, oxigênio ou nitrogênio em sua composição elementar. No laboratório de bromatologia, a determinação do teor total de minerais é realizada pela determinação de <b>[[cinzas totais]]</b> via incineração em <b>forno mufla a 550 °C</b> por 4 a 6 horas (utilizando cerca de 5 g de amostra seca em cadinho de porcelana previamente calcinado). Todo o material orgânico queima e volatiliza na forma de CO₂, H₂O e NO₂; o resíduo inorgânico branco-acinzentado restante no fundo do cadinho corresponde rigorosamente à fração mineral.</p><p class=n><b>Alerta de Volatilização:</b> a calcinação a 550 °C quantifica a quase totalidade dos minerais, porém elementos ultratraço altamente voláteis como o <b>[[mercúrio]] (Hg)</b> e frações de arsênio e selênio sublimam e perdem-se termicamente na fumaça da mufla, exigindo digestão ácida úmida fechada por micro-ondas para sua dosagem analítica.</p><h3>Os Três Pilares Funcionais dos Minerais</h3>`+tb(["Pilar Funcional","Papel Fisiológico","Minerais Representativos e Mecanismo"],[["<b>[[Estrutural]]</b>","Sustentação mecânica de tecidos duros e contração muscular","<b>Cálcio (Ca)</b> e <b>Fósforo (P)</b> na hidroxiapatita óssea; Cálcio e Magnésio no sarcômero"],["<b>[[Osmótico]]</b>","Pressão coloidosmótica, balanço hídrico e equilíbrio ácido-básico","<b>Sódio (Na⁺)</b> e <b>Cloreto (Cl⁻)</b> extracelulares; <b>Potássio (K⁺)</b> intracelular"],["<b>[[Enzimático]]</b>","Cofatores catalíticos e componentes de metaloenzimas vitais","<b>Zinco (Zn)</b> na anidrase carbônica; <b>Ferro (Fe)</b> nos citocromos e catalase; <b>Selênio (Se)</b> na GPx"]])+`<h3>O Soro Caseiro e o Co-transporte SGLT-1</h3><p>Na clínica e saúde pública, o pilar osmótico dos eletrólitos é a base do salvamento na desidratação infantil por cólera ou diarreia aguda via <b>[[soro caseiro]]</b> (solução de reidratação oral recomendada pela OMS: 3,5 g de NaCl + 20 g de glicose por litro de água). No enterócito intestinal, o transportador <b>[[SGLT-1]]</b> realiza o co-transporte acoplado obrigatório de 2 íons Na⁺ para cada 1 molécula de glicose a favor do gradiente osmótico, arrastando passivamente centenas de moléculas de água para a circulação. <i>Sem a glicose na proporção exata, o sódio não é absorvido e a diarreia osmótica piora</i>.</p><h3>Classificação por Demanda Diária e DRIs</h3>`+tb(["Categoria Fisiológica","Faixa de Demanda Diária","Minerais Representativos"],[["<b>[[Macroelementos]]</b>","Ordem de gramas (<b>> 100 mg/dia</b>)","Cálcio (Ca), Fósforo (P), Magnésio (Mg), Sódio (Na), Potássio (K), Cloro (Cl)"],["<b>[[Microelementos]]</b>","Ordem de miligramas (<b>< 100 mg/dia</b>)","Ferro (Fe), Zinco (Zn), Cobre (Cu), Manganês (Mn)"],["<b>[[Elementos-traço]]</b>","Ordem de microgramas ou nanogramas (<b>< 1 mg/dia</b>)","Selênio (Se), Iodo (I), Cromo (Cr), Molibdênio (Mo), Cobalto (Co)"]])+`<p class=w2><b>As DRIs (Dietary Reference Intakes):</b> a <b>[[EAR]]</b> (Estimated Average Requirement) cobre as necessidades de 50% dos indivíduos saudáveis; a <b>[[RDA]]</b> (EAR + 2 desvios-padrão) cobre 97% a 98% da população; e o <b>[[UL]]</b> (Tolerable Upper Intake Level) representa o teto máximo de ingestão segura sem risco de toxicidade. A faixa terapêutica ideal situa-se entre a RDA e o UL.</p>`+pg([["Achar que minerais fornecem calorias para o corpo.","São inorgânicos e desprovidos de calorias; atuam como estrutura, osmorreguladores e cofatores."],["Acreditar que a mufla a 550 °C retém todos os minerais sem perda.","Metais voláteis como o mercúrio sublimam e perdem-se na fumaça; exigem digestão ácida fechada."],["Oferecer água pura com sal para tratar desidratação infantil severa.","Sem glicose para acionar o transportador SGLT-1, o sódio e a água não são absorvidos no intestino."]]),["Minerais ficam nas cinzas a 550 °C (exceto Hg volátil); atuam em 3 pilares: estrutural, osmótico e enzimático","Soro caseiro usa o co-transporte SGLT-1 (2 Na⁺ : 1 Glicose) para reidratação intestinal rápida"],"A mufla a 550 °C volatiliza elementos como mercúrio; na clínica, o soro caseiro exige glicose para que o SGLT-1 absorva o sódio e a água.",[["Como se determina em laboratório o teor mineral total de um alimento e qual a exceção?", "Por incineração da amostra seca a 550 °C em forno mufla em cadinho de porcelana (cinzas totais); a matéria orgânica queima em gases e restam os minerais. Exceção: mercúrio (Hg) e compostos voláteis sublimam e perdem-se.", "A determinação de cinzas totais expressa a fração inorgânica mineral bruta."],["Quais são os três pilares funcionais dos minerais na fisiologia humana?", "1) Estrutural (ossos, dentes e citoesqueleto: Ca, P, Mg); 2) Osmótico (pressão coloidosmótica e equilíbrio ácido-básico: Na, K, Cl); e 3) Enzimático (cofatores e metaloenzimas: Zn, Fe, Cu, Se).", "Os minerais sustentam a mecânica, a volemia celular e a catálise biológica."],["Qual é a base molecular do soro caseiro no tratamento da desidratação infantil?", "O transportador intestinal SGLT-1 realiza o co-transporte ativo secundário de 2 íons Na⁺ acoplados a 1 molécula de glicose, arrastando água osmoticamente para os vasos e revertendo a desidratação.", "A proporção estrita entre sódio e glicose é o motor biofísico da reidratação oral."],["Como se classificam os minerais de acordo com a exigência diária estabelecida pelas DRIs?", "Macroelementos (> 100 mg/dia: Ca, P, Mg, Na, K, Cl); Microelementos (< 100 mg/dia: Fe, Zn, Cu, Mn); e Elementos-traço (< 1 mg/dia ou µg: Se, I, Cr, Mo).", "A essencialidade independe da quantidade: um traço é tão vital quanto um macroelemento."],["Diferencie os conceitos de EAR, RDA e UL na prescrição nutricional de minerais.", "EAR cobre 50% dos indivíduos saudáveis; RDA cobre 97-98% da população saudável (meta individual); e UL é o nível máximo tolerável sem efeitos adversos tóxicos.", "A ingestão diária segura deve situar-se rigorosamente entre a RDA e o UL."]]],
["Homeostase, Toxicidade e Contaminações Culinárias e Ambientais",`<p>Na curva da <b>[[homeostase]]</b> biológica dos minerais identificam-se três zonas fisiológicas: <b>zona deficiente</b> (risco de colapso metabólico), <b>zona segura e adequada</b> (entre a RDA e o UL) e <b>zona tóxica</b> (risco de dano tecidual cumulativo). Nenhum mineral escapa ao princípio de Paracelso: <i>a dose define o veneno</i>. Alguns elementos inorgânicos pesados não possuem qualquer função fisiológica conhecida e acumulam-se no corpo gerando patologias graves: o <b>[[cádmio]] (Cd)</b> é nefrotóxico e destrói os túbulos renais; o <b>[[chumbo]] (Pb)</b> cruza a barreira hematoencefálica e deprime o desenvolvimento cognitivo e o QI infantil; o <b>[[mercúrio]] (Hg)</b> causa lesões neurológicas irreversíveis; o <b>[[alumínio]] (Al)</b> associa-se a neurotoxicidade; e o <b>[[arsênio]] (As)</b> é carcinogênico comprovado.</p><h3>Pesquisa Acadêmica de Mestrado do Prof. Bruno: Alface na Região Metropolitana de BH</h3><p class=n>A dissertação de mestrado do Prof. Bruno analisou a contaminação de alfaces cultivadas próximas a rodovias de tráfego intenso e à Ceasa na Grande Belo Horizonte. A fuligem do escapamento veicular e do asfalto depositava partículas microscópicas de <b>[[chumbo]] (Pb)</b> e <b>[[cádmio]] (Cd)</b> sobre a superfície rugosa das folhas de alface. A descoberta bromatológica revelou que a simples <b>lavagem com água corrente com fricção mecânica removeu quase 100% dos metais pesados</b>, enquanto a simples imersão estática em hipoclorito de sódio (água sanitária) apenas sanitizou bactérias, mantendo os metais tóxicos aderidos se não houvesse o enxágue vigoroso.</p><h3>Pesquisa Acadêmica de Doutorado do Prof. Bruno e Profa. Flávia: Tachos de Cobre</h3><p>No doutorado conjunto do Prof. Bruno com a Profa. Flávia Custódio na pesquisa docente, investigou-se a secular tradição mineira de cozinhar doces em <b>tachos de cobre puro</b>:</p>`+tb(["Preparação Culinária Tradicional","Reação Físico-Química com o Cobre","Impacto Bromatológico e Tecnológico"],[["<b>Doce de figo e mamão verde</b>","O cobre <b>Cu²⁺</b> do tacho substitui o magnésio (<b>Mg²⁺</b>) no anel porfirínico da <b>[[clorofila]]</b>","Forma complexo <b>cobre-feofitina verde-esmeralda termoestável</b> brilhante; risco toxicológico se o cobre migrar em excesso"],["<b>Doce de leite mineiro</b>","O cobre iônico atua como <b>catalisador de óxido-redução</b> acelerando a <b>[[Reação de Maillard]]</b>","Acelera o escurecimento marrom atraente e caramelização, mas oxida lipídeos se a cocção for descontrolada"]])+`<p class=w2><b>Competição Iônica no DMT-1 (Cálcio x Ferro):</b> o transportador intestinal de metais divalentes (<b>[[DMT-1]]</b>) é compartilhado por cátions semelhantes. Quando se consome uma sobremesa láctea concentrada em <b>Ca²⁺</b> (pudim de leite, queijo) imediatamente após uma refeição rica em carne, o cálcio livre compete pelos mesmos carreadores intestinais do <b>Fe²⁺</b>, deprimindo a absorção do ferro não-heme em até 50%.</p>`+pg([["Achar que sanitizar alface com hipoclorito elimina contaminação por chumbo.","Hipoclorito mata bactérias; remover metais pesados exige fricção mecânica sob água corrente."],["Acreditar que doce verde feito em tacho de cobre tem cor natural da fruta.","O Cu²⁺ do tacho substituiu o Mg²⁺ da clorofila, criando um pigmento artificial termoestável."],["Oferecer sobremesa láctea imediatamente após almoço para paciente anêmico.","O Ca²⁺ do leite compete diretamente com o Fe²⁺ nos transportadores DMT-1 do intestino delgado."]]),["Mestrado Prof. Bruno: Fricção com água corrente remove Pb/Cd da alface; hipoclorito só mata bactéria","Doutorado Prof. Bruno/Profa. Flávia: Tacho de cobre insere Cu²⁺ na clorofila (verde brilhante) e catalisa Maillard no doce de leite"],"A fricção mecânica sob água corrente é obrigatória para remover chumbo e cádmio da alface; hipoclorito só atua sobre microrganismos.",[["Qual foi a descoberta da dissertação de mestrado do Prof. Bruno sobre alfaces na RMBH?", "A fuligem veicular depositava chumbo e cádmio nas folhas; a fricção mecânica sob água corrente removeu quase 100% dos metais, enquanto o hipoclorito sozinho apenas agiu sobre microrganismos.", "A limpeza mecânica física é indispensável para eliminar metais pesados particulados."],["Como os tachos de cobre alteram a cor dos doces de figo verde segundo as pesquisas acadêmicas?", "Os íons Cu²⁺ liberados do tacho substituem o átomo central de Mg²⁺ da clorofila, gerando um complexo de cobre-feofitina verde-esmeralda brilhante e resistente ao calor.", "O cobre confere verde artificialmente estável aos doces tradicionais."],["Por que o uso culinário do tacho de cobre é restrito pela vigilância sanitária moderna?", "Porque se o alimento for ácido ou permanecer estocado no tacho, migram doses elevadas de íons Cu²⁺ para a matriz, ultrapassando o UL e induzindo intoxicação gastrintestinal aguda e hepática.", "Tachos culinários de cobre exigem estanhagem interna protetora para uso seguro."],["O que ocorre molecularmente no transportador DMT-1 após ingestão simultânea de carne e sobremesa láctea?", "O excesso de íons Ca²⁺ do leite compete diretamente pelos mesmos sítios de ligação do transportador DMT-1 com os íons Fe²⁺, diminuindo significativamente a taxa de absorção do ferro.", "Recomenda-se espaçar sobremesas lácteas das principais refeições em anêmicos."],["Cite duas manifestações patológicas graves induzidas por metais pesados tóxicos.", "O cádmio (Cd) induz nefrotoxicidade com necrose tubular renal; o chumbo (Pb) acumula-se no sistema nervoso central provocando retardo cognitivo e queda de QI em crianças.", "Metais pesados tóxicos não possuem margem fisiológica segura e acumulam-se nos tecidos."]]],
["Origem dos Alimentos: Solo vs. Homeostase Animal e Fome Oculta Global",`<p>A concentração mineral nos alimentos depende da sua origem biológica. Nos vegetais, o teor depende da composição do solo, da absorção radicular e de variáveis agronômicas. Elementos como <b>flúor (F), selênio (Se) e iodo (I) não são essenciais para a maioria das plantas</b>; assim, um vegetal cultivado em solo pobre em iodo ou selênio cresce viçoso e saudável, mas entrega teor praticamente zero desses minerais na dieta humana.</p><h3>O Impacto Decisivo do pH do Solo na Captação Mineral</h3>`+tb(["Faixa de pH do Solo","Comportamento Químico dos Minerais","Disponibilidade Agronômica para a Planta"],[["<b>Solo Ácido</b> (pH < 6,0)","Maior solubilidade de cátions metálicos divalentes","↑ Absorção de <b>Ferro (Fe)</b>, <b>Zinco (Zn)</b>, <b>Manganês (Mn)</b> e <b>Níquel (Ni)</b>"],["<b>Solo Alcalino ou Calcário</b> (pH > 7,5)","Cátions precipitam como hidróxidos insolúveis; ânions solubilizam","<b>↓ Drástica de Fe, Zn e Mn</b>; e <b>↑ de Molibdênio (Mo) e Selênio (Se)</b>"]])+`<h3>Homeostase Animal: Composição Constante</h3><p>Diferentemente dos vegetais, os animais de corte e leite possuem rigorosos mecanismos endócrinos de <b>[[homeostase]] tecidual</b> (bomba de cálcio, paratormônio, calcitonina, ferritina tecidual) que mantêm as concentrações minerais em faixas fisiológicas fixas: <b>carnes são universalmente ricas em ferro heme e pobres em cálcio</b> (com exceção do esqueleto ósseo e de terneiros jovens alimentados só com leite, cuja carne é pálida); e o <b>leite é naturalmente riquíssimo em cálcio e pobre em ferro</b>.</p><h3>O Panorama Global da Fome Oculta (SOFI, 2024)</h3><p class=w2>A <b>[[fome oculta]]</b> instala-se quando o indivíduo consome volume suficiente ou excessivo de calorias diárias (energia de carboidratos refinados e gorduras), mas sua dieta é deficiente em <b>micronutrientes essenciais</b> (ferro, zinco, iodo e vitamina A). O relatório <b>SOFI 2024 (ONU/FAO)</b> aponta que cerca de <b>2 bilhões de pessoas</b> sofrem de carências crônicas de ferro ou zinco, <b>733 milhões</b> enfrentam insegurança alimentar grave no mundo e <b>14,3 milhões de brasileiros</b> permanecem nessa condição de vulnerabilidade nutricional.</p>`+pg([["Achar que planta verde bonita é necessariamente rica em iodo e selênio.","Plantas não precisam de iodo e selênio para viver; se o solo não tiver, o vegetal não entrega o mineral."],["Dizer que leite de vaca supre as necessidades de ferro do lactente.","O leite de vaca é rico em cálcio, mas naturalmente muito pobre em ferro."],["Acreditar que a fome oculta só atinge pessoas abaixo do peso.","Atinge obesos e eutróficos com dietas ultraprocessadas hipercalóricas pobres em micronutrientes."]]),["Solo alcalino reduz Fe, Zn e Mn na planta; carnes são ricas em Fe e pobres em Ca; leite é o oposto","Fome oculta: calorias suficientes com carência de ferro, zinco e iodo (atinge 2 bilhões no mundo)"],"Solos alcalinos reduzem drasticamente a absorção vegetal de Fe, Zn e Mn; a carne é rica em Fe e pobre em Ca, e o leite é o oposto.",[["Por que um alimento vegetal pode crescer perfeitamente viçoso e saudável mesmo desprovido de iodo e selênio?", "Porque iodo e selênio não são elementos essenciais para a fisiologia vegetal; a planta desenvolve-se normalmente sem captá-los se o solo for deficiente, entregando zero teor na alimentação humana.", "A composição vegetal reflete a riqueza do solo, não as necessidades humanas."],["Como o pH do solo agrícola modula a disponibilidade de minerais para as culturas alimentares?", "Solos com pH ácido elevam a disponibilidade de Fe, Zn, Mn e Ni; solos com pH alcalino forçam a precipitação insolúvel desses cátions, porém solubilizam ânions como molibdênio e selênio.", "O manejo químico da fertilidade do solo dita o teor mineral final do grão."],["Por que o perfil mineral de carnes e leite é muito mais constante do que o de folhosos e grãos?", "Porque os animais possuem sistemas neuroendócrinos de regulação homeostática que mantêm as concentrações teciduais em limites vitais estritos antes do abate ou da lactação.", "A homeostase animal atua como um tampão estabilizador da densidade nutricional."],["O que caracteriza o quadro de fome oculta segundo o relatório SOFI 2024 da ONU?", "Consumo calórico e energético adequado ou em excesso associado à privação crônica de micronutrientes essenciais como ferro, zinco, vitamina A e iodo em cerca de 2 bilhões de indivíduos.", "A fome oculta é invisível aos olhos e não se confunde com magreza extrema."],["Qual é a exceção cárnea clássica ao alto teor de ferro da musculatura de mamíferos?", "A carne de vitela (terneiros jovens alimentados exclusivamente com dietas líquidas lácteas pobres em ferro), mantendo musculatura clara com baixa concentração de mioglobina.", "O manejo zootécnico restritivo intencional suprime a deposição de ferro no terneiro."]]],
["Biodisponibilidade vs. Bioacessibilidade e o Paradoxo do Cálcio",`<p>A simples leitura do teor de mineral na tabela de composição de alimentos pode induzir a erros graves na clínica. A <b>[[bioacessibilidade]]</b> expressa a fração do mineral que é solubilizada e liberada da matriz alimentar durante a digestão no trato gastrintestinal, tornando-se disponível para absorção; a <b>[[biodisponibilidade]]</b> é a porcentagem efetivamente absorvida pelos enterócitos e utilizada pelo organismo (variando de <b>menos de 1% a mais de 90%</b> dependendo do mineral e da matriz).</p><h3>O Paradoxo do Cálcio (Muleya et al., 2024)</h3><p>O estudo seminal de Muleya et al. (2024) exemplifica com dados exatos por que tabelas puras são enganosas na prescrição de fontes de cálcio para adultos (RDA de 700 a 1.200 mg/dia):</p>`+tb(["Matriz Alimentar Avaliada","Teor Total de Cálcio","% Bioacessibilidade Real","Porções para Igualar 1 Copo de Leite Desnatado"],[["<b>Leite Desnatado</b> (200 mL)","242,0 mg / porção","<b>29,90%</b> (72,4 mg absorvíveis)","<b>1,0 porção de referência</b> (padrão ouro com lactose)"],["<b>Couve Refogada</b> (*Brassica*)","328,0 mg / porção","<b>42,70%</b> (140,0 mg absorvíveis)","<b>0,2 porção</b> (apenas 2 colheres já entregam o cálcio de 1 copo)"],["<b>Espinafre Cozido</b>","134,8 mg / porção","<b>Apenas 0,13%</b> (0,17 mg absorvíveis)","<b>352 PORÇÕES DIÁRIAS!</b> (inviável; sequestrado por oxalatos)"],["<b>Bebida de Amêndoas</b> (200 mL)","132,4 mg / porção","<b>Apenas 3,59%</b> (4,75 mg absorvíveis)","<b>15,2 porções</b> (precisa de fortificação sintética)"]])+`<p class=w2><b>Alerta Clínico: Litíase Renal por Suco Verde Concentrado de Espinafre:</b> o espinafre possui altíssima carga de <b>[[oxalatos]]</b> livres que formam cristais insolúveis de oxalato de cálcio. A ingestão diária de 'sucos detox' concentrados com espinafre cru satura os rins, elevando exponencialmente o risco de <b>litíase renal (cálculos renais de oxalato de cálcio)</b> e retenção fecal, enquanto entrega cálcio zero ao esqueleto.</p>`+pg([["Prescrever espinafre como fonte rica de cálcio biodisponível.","O espinafre tem 0,13% de bioacessibilidade; seriam precisas 352 porções para igualar 1 copo de leite!"],["Achar que couve tem cálcio de baixa absorção por ser vegetal.","A couve tem 42,7% de bioacessibilidade (superior ao leite), sendo excelente fonte vegetal de Ca."],["Orientar suco verde diário de espinafre cru concentrado para pacientes litiásicos.","A altíssima carga de oxalato livre satura os túbulos renais induzindo cálculos renais severos."]]),["Couve tem 42,7% de bioacessibilidade de Ca (0,2 porção = 1 leite); espinafre tem só 0,13% (exige 352 porções!)","Sucos verdes concentrados de espinafre cru precipitam oxalato de cálcio causando litíase renal"],"A couve supera o leite em bioacessibilidade de cálcio (42,7% vs 29,9%), enquanto o espinafre cru retém 99,8% do cálcio e precipita cálculos renais.",[["O que diferencia conceitualmente bioacessibilidade de biodisponibilidade de um mineral?", "Bioacessibilidade é a fração liberada da matriz alimentar na fase líquida do lúmen intestinal pronta para captação celular; biodisponibilidade é o percentual absorvido e funcionalmente aproveitado pelo organismo.", "A bioacessibilidade no lúmen é o pré-requisito mandatório para a absorção biológica."],["Explique o Paradoxo do Cálcio demonstrado por Muleya et al. (2024) entre couve e leite desnatado.", "Embora o leite seja tido como a fonte padrão (29,9% de bioacessibilidade), a couve apresenta bioacessibilidade superior de 42,7%, bastando 0,2 porção para fornecer o cálcio aproveitável de um copo de leite.", "A família Brassica conjuga alto teor de cálcio com ausência de oxalatos inibidores."],["Por que o espinafre é considerado uma fonte ilusória de cálcio na dietoterapia?", "Porque contém concentrações massivas de ácido oxálico que complexam o cálcio em oxalato de cálcio insolúvel, reduzindo a bioacessibilidade a 0,13% e exigindo 352 porções para equivaler ao leite.", "O espinafre aprisiona o cálcio em matriz mineral insolúvel indegradável."],["Qual o perigo clínico da prescrição habitual de sucos verdes com alta concentração de espinafre cru?", "A enorme ingestão de oxalatos solúveis ultrapassa a capacidade de ligação intestinal, sendo absorvida e excretada na urina, onde cristaliza com cálcio renal formando cálculos de litíase renal.", "O oxalato livre absorvido é um potente promotor de nefrolitíase tubular."],["Por que bebidas vegetais de amêndoas precisam ser fortificadas artificialmente pela indústria?", "Porque o cálcio natural da amêndoa possui bioacessibilidade de apenas 3,59% devido à presença de fitatos e fibras que impedem a liberação luminal eficiente.", "Sem fosfato tricálcico ou carbonato de cálcio adicionados, a bebida não supre as necessidades diárias."]]],
["Facilitadores vs. Inibidores Luminais e a 'Gaiola do Fitato'",`<p>A absorção de minerais no intestino delgado depende da disputa físico-química entre compostos <b>facilitadores</b> e <b>inibidores</b> presentes no bolo alimentar. Dentre os facilitadores destacam-se os ácidos orgânicos (cítrico, málico e lático) e as <b>proteínas</b> (que liberam aminoácidos quelantes que aceleram o fluxo da borda em escova, elevando a absorção de ferro e zinco em até <b>+15%</b>).</p><h3>A 'Gaiola' do Fitato e o Resgate pelo Ácido Ascórbico</h3><p>O <b>[[fitato]]</b> (ácido fítico ou hexafosfato de mio-inositol) acumula 6 grupos fosfato com forte densidade de carga negativa em pH neutro ou alcalino. Esses grupamentos coordenam simultaneamente cátions divalentes (Fe²⁺, Zn²⁺, Ca²⁺, Mg²⁺), formando um complexo quelato octaédrico insolúvel — uma verdadeira <b>'gaiola molecular'</b> que sequestra o mineral e impede o acesso aos transportadores epiteliais.</p>`+tb(["Alimento Avaliado","Teor Total de Zinco","Zinco Efetivamente Disponível","% Perda pela Gaiola do Fitato"],[["<b>Amêndoa</b>","1,50 mg / 100 g","0,03 mg / 100 g","<b>Perda catastrófica de 98,00%</b>"],["<b>Noz</b>","1,80 mg / 100 g","0,21 mg / 100 g","<b>Perda de 88,30%</b>"],["<b>Castanha-do-Brasil</b>","2,40 mg / 100 g","0,50 mg / 100 g","<b>Perda de 79,20%</b>"],["<b>Lentilha</b>","2,30 mg / 100 g","2,10 mg / 100 g","<b>Perda de apenas 8,70% (Excelente fonte!)</b>"]])+`<p class=w2><b>O Resgate pelo Ácido Ascórbico:</b> o <b>[[ácido ascórbico]] (Vitamina C)</b> atua como o salvador do ferro vegetal na digestão duodenal por dois mecanismos simultâneos: 1) é um agente redutor que reduz o ferro férrico (<b>Fe³⁺</b> insolúvel) para o estado ferroso (<b>Fe²⁺</b> solúvel); e 2) atua como ligante quelante bidentado que forma um <b>quelato solúvel de ascorbato-ferroso</b> mais estável que o complexo de fitato, impedindo a formação da gaiola insolúvel.</p><p class=n><b>Taninos do Chá e Café:</b> os <b>[[taninos]]</b> (polifenóis condensados de café, chá-preto e mate) quelam o ferro não-heme gerando tanatos insolúveis escuros que <b>deprimem a absorção de ferro em 50% a 70%</b> se ingeridos junto com a refeição.</p>`+pg([["Achar que amêndoa e lentilha com o mesmo teor de zinco entregam a mesma dose.","A amêndoa perde 98% do zinco na gaiola do fitato; a lentilha preserva mais de 91% do zinco livre."],["Acreditar que a vitamina C só ajuda o ferro por acidificar o estômago.","Ela reduz quimicamente Fe³⁺ para Fe²⁺ e forma quelatos solúveis estáveis que barram o fitato."],["Tomar café com leite ou chá-preto logo após almoço rico em feijão e vegetais.","Taninos reduzem a absorção do ferro vegetal em até 70% por precipitação insolúvel."]]),["Fitato quela cátions formando gaiola insolúvel (amêndoa perde 98% do Zn vs lentilha perde só 8,7%)","Vitamina C resgata o ferro reduzindo Fe³⁺ para Fe²⁺ e formando quelatos solúveis protetores"],"Fitatos sequestram cátions divalentes em complexos insolúveis; a vitamina C resgata o ferro mantendo-o na forma solúvel Fe²⁺.",[["Como a molécula de fitato consegue sequestrar minerais divalentes de forma tão eficaz no intestino?", "Possui 6 grupamentos fosfato ionizados negativamente que se coordenam fortemente a íons bivalentes (Fe, Zn, Ca), gerando complexos quelatos octaédricos poliméricos totalmente insolúveis em pH luminal.", "A conformação espacial do hexafosfato de mio-inositol imobiliza os metais."],["Por que a lentilha supera castanhas e nozes como fonte prática de zinco dietético?", "Porque a amêndoa perde 98% do zinco e a noz perde 88% aprisionados por fitatos, enquanto a lentilha apresenta estrutura de fácil liberação, perdendo apenas 8,7% de zinco na digestão.", "A matriz da lentilha permite excelente bioacessibilidade do zinco ingerido."],["Quais são os dois mecanismos químicos pelos quais o ácido ascórbico resgata o ferro não-heme?", "1) Redução química de Fe³⁺ para a forma Fe²⁺ assimilável; e 2) Formação de um quelato bidentado solúvel de ascorbato de ferro que impede a ligação competitiva de fitatos e polifenóis.", "O ácido ascórbico supera a constante de estabilidade do fitato mantendo o ferro solúvel."],["Qual é o impacto bromatológico do consumo de café e chá-preto concentrados durante o almoço?", "Os taninos e polifenóis condensados reagem com o ferro vegetal formando complexos de tanato férrico coloidais e insolúveis, deprimindo a taxa de absorção de ferro não-heme em até 70%.", "Recomenda-se espaçar café e chás ricos em taninos em pelo menos 1 a 2 horas das refeições."],["Como a presença de proteínas de origem animal facilita a absorção de minerais associados?", "A hidrólise proteica libera aminoácidos livres (cisteína e histidina) que formam quelatos peptídicos solúveis e aceleram o trânsito da borda em escova, elevando a absorção de Fe e Zn em +15%.", "O chamado 'fator carne' otimiza a absorção de minerais vegetais concomitantes."]]],
["O Fator X: O Papel Dual da Microbiota Colônica na Absorção",`<p>Na visão médica tradicional, o cólon sempre foi considerado mero órgão de trânsito fecal e reabsorção passiva de água e sódio. A bromatologia moderna comprova que o <b>[[Fator X]] — a microbiota colônica</b> — desempenha papel ativo e determinante na biodisponibilidade de micronutrientes minerais, atuando por uma via <b>estritamente dual</b>:</p><h3>A Rota Benéfica: Super-Resgate do Ferro (Aumento de 1,3 a 1,8x)</h3><p>Quando carboidratos prebióticos não digeríveis e fibras solúveis (frutooligossacarídeos, inulina e amido resistente) atingem as bactérias sacarolíticas do ceco e cólon proximal (*Bifidobacterium* e *Lactobacillus*), sofrem fermentação anaeróbica gerando <b>ácidos graxos de cadeia curta (AGCC)</b> — principalmente acetato, propionato e <b>butirato</b>. Esse acúmulo de ácidos orgânicos <b>declina o pH intraluminal colônico de 7,0 para 5,5 a 6,0</b>. A acidez local redissolve precipitados minerais residuais e ativa enzimas fitases bacterianas endógenas, promovendo <b>elevação de 1,3 a 1,8 vezes na bioacessibilidade e absorção transmucosa do ferro</b>.</p><h3>A Rota Inibidora: Bloqueio do Zinco, Cobre e Manganês no Cólon</h3>`+tb(["Mineral Afetado","Mecanismo Bioquímico no Lúmen Colônico","Consequência Fisiológica e Absorção"],[["<b>Zinco (Zn)</b> e <b>Cobre (Cu)</b>","Bactérias redutoras de sulfato geram <b>gás sulfídrico (H₂S)</b> que reage formando <b>ZnS e CuS insolúveis</b>","Precipitação química total em sais insolúveis; <b>queda drástica na absorção</b>"],["<b>Manganês (Mn)</b>","<b>Sequestro microbiano ativo</b> para compor enzimas antioxidantes bacterianas (Mn-SOD)","O mineral é incorporado na biomassa fecal bacteriana e excretado nas fezes"]])+`<p class=w2><b>Conclusão Científica do Fator X:</b> a microbiota não pode ser considerada benéfica ou maléfica de modo genérico para os minerais: <i>ela resgata o ferro colônico enquanto compete avidamente ou precipita zinco, cobre e manganês</i>.</p>`+pg([["Achar que o intestino grosso não participa da absorção de minerais.","O cólon realiza fermentação que resgata até 1,8x mais ferro biodisponível."],["Acreditar que a microbiota colônica aumenta a absorção de todos os minerais.","Ela eleva o ferro, mas precipita zinco e cobre como sulfetos insolúveis e sequestra manganês."],["Dizer que o butirato atua apenas na saúde dos colonócitos.","O butirato acidifica o lúmen, promovendo a dissolução de fosfatos e fitatos insolúveis de ferro."]]),["Microbiota colônica tem papel dual: fermentação gera AGCC que baixam pH e elevam absorção de Fe em 1,3 a 1,8x","Em contrapartida, sulfetos bacterianos precipitam Zn e Cu (ZnS, CuS) e manganês é sequestrado na biomassa fecal"],"A microbiota colônica acidifica o lúmen e eleva a absorção de ferro em 1,3 a 1,8x, mas precipita zinco e cobre como sulfetos insolúveis.",[["Por que a microbiota colônica é denominada de 'Fator X' na absorção mineral moderna?", "Porque quebrou o dogma de que o cólon apenas absorve água; a fermentação microbiana atua como um compartimento ativo que redefine a biodisponibilidade final de minerais residuais.", "A ecologia bacteriana do intestino grosso interfere ativamente na absorção tecidual."],["Como a fermentação bacteriana de fibras prebióticas consegue resgatar o ferro no cólon?", "Gera ácidos graxos de cadeia curta (butirato, acetato) que acidificam o lúmen para pH 5,5-6,0; essa acidez redissolve o ferro insolúvel e ativa fitases bacterianas, elevando o Fe absorvível em 1,3 a 1,8 vezes.", "A acidificação colônica é a chave biológica do resgate do ferro fecal."],["Qual o mecanismo químico pelo qual a microbiota intestinal inibe a absorção de zinco e cobre?", "Bactérias fermentadoras proteolíticas liberam sulfeto de hidrogênio (H₂S) que se combina com íons Zn²⁺ e Cu²⁺, gerando sulfeto de zinco (ZnS) e sulfeto de cobre (CuS) quimicamente insolúveis.", "A sulfetação luminal sequestra o zinco e cobre em sais inertes não absorvíveis."],["O que ocorre com o manganês na luz intestinal em contato com a flora colônica?", "O manganês sofre incorporação e sequestro ativo pela própria biomassa bacteriana colônica para estruturar a metaloenzima superóxido dismutase dependente de manganês (Mn-SOD), sendo excretado.", "As bactérias competem diretamente com o hospedeiro pelo manganês dietético."],["Qual a relevância clínica de associar prebióticos na dieta de pacientes com carência de ferro?", "Os prebióticos estimulam a produção endógena de AGCC no cólon, restaurando a bioacessibilidade do ferro residual que escapou da digestão no intestino delgado.", "Potencializa a resposta terapêutica em quadros de anemia ferropriva resistente."]]],
["Efeitos do Processamento: Moagem, Fermentação, Caju com Starmerella e Fórmulas",`<p>As operações culinárias e industriais de processamento alteram drasticamente a matriz alimentar e a oferta líquida de minerais biodisponíveis:</p><h3>A Devastação Nutricional da Moagem Industrial de Cereais</h3><p>Nos grãos de cereais (trigo, arroz, aveia), os minerais acumulam-se concentrados na <b>camada de aleurona, no pericarpo (farelo) e no gérmen embrionário</b>, enquanto o endosperma amiláceo central é praticamente desprovido de cátions. Quando o trigo integral é submetido à moagem mecânica para produzir a farinha de trigo refinada branca, perdem-se <b>76% de todo o ferro</b> e <b>78% de todo o zinco</b> originais com a remoção dos subprodutos.</p><h3>Fermentação Natural vs. Pesquisa com Bagaço de Caju (*Starmerella*)</h3>`+tb(["Processo Biotecnológico","Agente Biológico","Ação Bioquímica e Impacto na Biodisponibilidade"],[["<b>Fermentação de Pães</b> (<i>Sourdough</i>)","Bactérias láticas e leveduras","Síntese de <b>fitases endógenas</b> ativadas pelo pH ácido (4,5) que quebram o fitato, liberando Ca, Fe e Zn livres"],["<b>Pesquisa de Fermentação</b>","Levedura <i><b>Starmerella meliponinorum</b></i>","Aplicada ao bagaço de caju: <b>degradou 56% dos taninos totais</b>, eliminando a adstringência e liberando minerais"]])+`<h3>Alerta Bromatológico em Fórmulas Enterais (Galán & Drago, 2014)</h3><p class=w2>O estudo de Galán e Drago (2014) avaliou a estabilidade de fórmulas nutricionais hospitalares para nutrição enteral e infantil submetidas a aquecimento térmico prolongado. A temperatura elevada acelerou a <b>oxidação e destruição irreversível do ácido ascórbico adicionado</b>; sem o 'resgate' da vitamina C para manter o ferro na forma Fe²⁺ solúvel, os íons <b>ferro e zinco formaram complexos insolúveis com fosfatos e proteínas</b>, despencando vertiginosamente a bioacessibilidade do produto servido aos pacientes acamados.</p>`+pg([["Achar que farinha de trigo branca refinada tem o mesmo valor mineral do grão integral.","A moagem mecânica descarta o farelo e gérmen, drenando 76% do ferro e 78% do zinco."],["Acreditar que ferver fórmulas enterais no hospital melhora a absorção mineral.","O calor destrói o ácido ascórbico; sem o resgate, ferro e zinco precipitam em complexos insolúveis."],["Dizer que o bagaço de caju é resíduo fibroso inútil para a nutrição.","A pesquisa acadêmica com Starmerella meliponinorum hidrolisou 56% dos taninos, agregando alto valor mineral."]]),["Moagem do trigo para farinha branca drena 76% do Fe e 78% do Zn (retirados com o farelo e gérmen)","Pesquisa: Starmerella meliponinorum degrada 56% dos taninos no caju; calor excessivo em fórmulas destrói vitamina C e precipita minerais"],"A moagem refinada do trigo elimina 76% do ferro e 78% do zinco; aquecer fórmulas enterais quebra a vitamina C e precipita minerais.",[["Qual a perda percentual de ferro e zinco quando o trigo integral é refinado para farinha branca?", "Ocorre a perda drástica de 76% do ferro total e de 78% do zinco total, eliminados juntamente com o farelo externo e o gérmen na moagem.", "O refino mecânico desmineraliza quase completamente os cereais amiláceos."],["Por que pães de fermentação natural prolongada (sourdough) entregam mais minerais do que pães industriais rápidos?", "Porque as bactérias láticas acidificam a massa ativando enzimas fitases que hidrolisam os grupamentos fosfato do fitato, quebrando a gaiola e liberando Ca, Fe e Zn assimiláveis.", "A fermentação lenta quebra biologicamente os antinutrientes do farelo."],["Qual foi o resultado da pesquisa de fermentação de bagaço de caju conduzida na pesquisa docente?", "O uso da levedura Starmerella meliponinorum hidrolisou 56% dos taninos totais condensados, atenuando a adstringência e liberando minerais sequestrados.", "Biotecnologia microbiológica permite converter coprodutos em matrizes minerais nobres."],["O que relataram Galán e Drago (2014) sobre o aquecimento excessivo de fórmulas enterais hospitalares?", "O calor excessivo destruiu termicamente o ácido ascórbico protetor; sem a vitamina C, o ferro e zinco formaram sais insolúveis com fosfatos da fórmula despencando a bioacessibilidade.", "O choque térmico hospitalar pode transformar fórmulas enriquecidas em dietas indisponíveis."],["Qual o duplo papel da cocção úmida tradicional sobre as leguminosas (feijão e grão-de-bico)?", "Por um lado, a água e calor solubilizam e inativam antinutrientes termolábeis e taninos; por outro, fibras solúveis hidratadas podem aprisionar minerais e a água de descarte drena íons livres.", "O cozimento exige equilíbrio entre inativação de inibidores e preservação de eletrólitos."]]],
["Políticas Globais contra Fome Oculta e Tecnologias com Cálcio e Alumínio",`<p>Para combater a carência crônica de minerais em populações vulneráveis, a saúde pública e a indústria bromatológica implementam <b>três estratégias consolidadas</b> em pontos distintos da cadeia de suprimento:</p>`+tb(["Estratégia de Intervenção","Ponto de Aplicação","Fundamento Técnico-Científico","Exemplos Brasileiros de Sucesso"],[["<b>[[Biofortificação]]</b>","<b>No Campo</b> (Agronômica)","Melhoramento genético vegetal clássico ou transgenia para gerar cultivares com sementes densas em minerais","Embrapa: <b>feijão BRS Aracê</b> (rico em Fe/Zn) e milho biofortificado"],["<b>[[Fortificação]]</b>","<b>Na Fábrica</b> (Industrial)","Adição tecnológica de compostos minerais durante a moagem ou formulação fabril pós-colheita","<b>Lei Federal da Farinha de Trigo/Milho</b> com sulfato ferroso e ácido fólico; sal iodado"],["<b>[[Suplementação]]</b>","<b>No Prato</b> (Clínica Direta)","Administração farmacológica de minerais quelados puros em comprimidos ou gotas para grupos de risco","Gotas de sulfato ferroso para lactentes e gestantes na atenção primária (SUS)"]])+`<h3>Tecnologia do Cálcio: O Fenômeno 'Egg-Box' com Pectina BTM</h3><p>Além da nutrição, os minerais desempenham papéis de engenharia física em alimentos. Na indústria vegetal e de doces tradicionais (doce de abóbora em pedaços), adiciona-se <b>cloreto de cálcio ([[CaCl₂]])</b> em imersão prévia. Os íons divalentes <b>Ca²⁺</b> intercalam-se eletrostaticamente entre as cadeias carboxílicas da <b>[[pectina de baixo teor de metoxilação]] (BTM)</b> da lamela média vegetal, formando a clássica estrutura em <b>'caixa de ovos' ([[Egg-Box]])</b>. Essa reticulação rígida impede o desmoronamento celular, mantendo os pedaços de abóbora firmes e crocantes por fora mesmo após cozimento em calda açucarada fervente. Na queijaria, o CaCl₂ é compulsório para restaurar a integridade micelar da caseína no leite pasteurizado antes do corte da coalhada.</p><h3>Tecnologia do Alumínio na Panificação Química</h3><p class=n>O <b>sulfato de sódio e alumínio</b> e o <b>fosfato de sódio e alumínio</b> atuam como <b>fermentos químicos de dupla ação</b>: um ácido residual reage friamente na batedeira liberando CO₂ inicial, enquanto o sal de alumínio só reage sob temperaturas superiores a 60-70 °C no interior do forno, promovendo o salto térmico de aeração da massa do bolo.</p>`+pg([["Confundir biofortificação com fortificação tradicional.","Biofortificação ocorre na planta viva no campo; fortificação é adição de pó químico na fábrica."],["Achar que cloreto de cálcio em doce de abóbora serve para adoçar.","O Ca²⁺ reticula a pectina BTM em conformação Egg-Box, criando a casquinha firme e crocante."],["Dizer que todo fermento químico age exclusivamente no forno quente.","Fermentos com sais de alumínio são de dupla ação: agem um pouco a frio e expandem no forno."]]),["3 estratégias: Biofortificação (campo: feijão BRS Aracê), Fortificação (fábrica: lei das farinhas) e Suplementação (prato: gotas SUS)","CaCl₂ em doce de abóbora e queijos forma Egg-Box com pectina BTM conferindo rigidez; Al atua em fermentos químicos"],"O cloreto de cálcio forma conformação Egg-Box com a pectina BTM em doces e queijos; o sal de alumínio expande bolos no forno quente.",[["Diferencie com precisão as três estratégias de combate à fome oculta: biofortificação, fortificação e suplementação.", "Biofortificação atua no campo via melhoramento genético na planta viva (feijão BRS Aracê); fortificação atua na fábrica por adição física em produtos de consumo em massa (farinha com ferro); suplementação atua no prato com comprimidos/gotas em grupos clínicos.", "As três iniciativas atacam a desnutrição na semente, na indústria e no indivíduo."],["Como a adição de CaCl₂ mantém a firmeza de pedaços de abóbora em calda na culinária tradicional?", "Os íons Ca²⁺ ligam-se aos grupamentos carboxílicos desmetoxilados da pectina BTM formando a junção Egg-Box, reticulando a parede celular e criando uma crosta firme que não desmancha ao calor.", "A tecnologia iônica do cálcio preserva a textura geométrica de doces em pedaços."],["Por que a indústria de laticínios adiciona cloreto de cálcio ao leite pasteurizado antes da coagulação do queijo?", "Porque a pasteurização térmica precipita parte do cálcio solúvel nativo na forma de fosfato tricálcico; a reposição de CaCl₂ reconstitui as pontes de cálcio entre as micelas de caseína garantindo coalhada firme.", "Sem cálcio livre, a quimosina enzimática não consegue formar o gel do queijo."],["Como funcionam os sais de alumínio nos fermentos químicos de dupla ação na confeitaria?", "O sal de alumínio (sulfato ou fosfato de sódio e alumínio) atua em alta temperatura (>60 °C) no forno, reagindo com o bicarbonato e liberando CO₂ volumoso que expande o bolo assado.", "Garante aeração progressiva sem perda precoce dos gases na batedeira."],["Qual o cuidado exigido quanto ao consumo cumulativo de sais de alumínio em pós de panificação?", "O alumínio acumula-se lentamente nos tecidos biológicos e pode ultrapassar o UL, sendo investigado por toxicidade neuronal crônica e estresse oxidativo tecidual.", "Agências sanitárias monitoram os limites máximos de aditivos de alumínio no mercado."]]],
["Aplicações Bromatológicas Específicas: Cor da Carne, Sulfitos e Alambiques de Cobre",`<p>No segmento agroindustrial e cárneo, os minerais protagonizam reações físico-químicas de impacto comercial absoluto:</p><h3>O Ferro Heme e os Três Estados de Cor da Carne Bovina</h3>`+tb(["Estado Químico da Mioglobina","Valência do Ferro Central","Sexto Sítio de Coordenação","Aspecto Visual e Presença Comercial"],[["<b>[[Desoximioglobina]]</b>","Ferro ferroso <b>Fe²⁺</b>","<b>Vazio</b> (sem oxigênio molecular)","<b>Vermelho-púrpura escura</b>; típica do interior de músculos e peças sob vácuo"],["<b>[[Oximioglobina]]</b>","Ferro ferroso <b>Fe²⁺</b>","<b>O₂ coordenado</b> reversivelmente","<b>Vermelho-vivo brilhante atraente</b>; após 15-30 min ao ar (<b>bloom</b>)"],["<b>[[Metamioglobina]]</b>","Ferro férrico oxidado <b>Fe³⁺</b>","<b>Molécula de H₂O coordenada</b>","<b>Marrom-parda desagradável</b>; oxidação após esgotamento de NADH redutores"]])+`<h3>Tecnologia de Sulfitos (SO₂) e o Alerta Sanitário aos Asmáticos</h3><p class=w2>Os aditivos sulfurados derivados do enxofre inorgânico (<b>[[sulfitos]]</b>, metabissulfito de sódio e dióxido de enxofre — SO₂) atuam em sucos de frutas, vinhos e camarões por dois mecanismos primordiais: 1) são <b>fortes agentes redutores químicos</b> que reagem com o-quinonas reduzindo-as de volta a difenóis incolores, inibindo o escurecimento enzimático da polifenoloxidase; e 2) exercem <b>ação bacteriostática e fungistática</b>. Contudo, a ANVISA e o FDA exigem declaração mandatória em letras garrafais no rótulo (<i>'Contém Sulfitos'</i>), pois a inalação de gás SO₂ livre residual volatilizado dispara <b>broncoespasmo severo e crises agudas de asma com choque anafilactoide</b> em indivíduos hipersensíveis desprovidos da enzima sulfito oxidase.</p><h3>Alambiques de Cobre na Produção da Cachaça de Alambique Artesanal</h3><p>Na destilação da cana-de-açúcar fermentada para produção da genuína cachaça mineira, o uso do <b>alambique de cobre puro</b> é insubstituível. As leveduras fermentativas geram compostos voláteis indesejáveis de enxofre — principalmente <b>[[mercaptanas]]</b> (etanotiol) e <b>sulfeto de hidrogênio (H₂S)</b> —, responsáveis por repugnante aroma de repolho podre ou ovo podre. Durante a evaporação e condensação na coluna do alambique, as paredes de cobre metálico oxidam-se reagindo quimicamente com esses compostos de enxofre, formando <b>sulfeto de cobre ([[CuS]])</b> — um precipitado sólido insolúvel escuro que fica incrustado nas paredes da caldeira. O destilado purificado escorre límpido, frutado e aromático.</p>`+pg([["Achar que carne marrom (metamioglobina) está podre e tóxica.","A metamioglobina é oxidação química inorgânica do ferro; a carne só está estragada se houver proliferação microbiana."],["Ignorar alerta de sulfito em rótulo de vinho ao servir um asmático.","O sulfito livre libera SO₂ que desencadeia crises agudas de asma com insuficiência respiratória severa."],["Dizer que alambique de inox produz a mesma cachaça que o alambique de cobre.","O inox é inerte e não remove mercaptanas; a cachaça fica com odor desagradável sulfuroso."]]),["Cor da carne: Desoximioglobina (Fe²⁺ púrpura) -> Oximioglobina (Fe²⁺-O₂ vermelho) -> Metamioglobina (Fe³⁺ marrom)","Sulfitos barram escurecimento enzimático mas disparam asma; alambique de cobre retira H₂S e mercaptanas como CuS insolúvel"],"A metamioglobina marrom resulta da oxidação do ferro heme para Fe³⁺; sulfitos bloqueiam escurecimento mas disparam crises de asma.",[["Como o estado de oxidação e o ligante do átomo de ferro da mioglobina determinam as três cores da carne fresca?", "Fe²⁺ desprovido de ligante gasoso gera desoximioglobina púrpura (vácuo); Fe²⁺ coordenado a oxigênio diatômico gera oximioglobina vermelho-vivo (bloom); e a oxidação para Fe³⁺ ligado à água gera metamioglobina marrom.", "A alteração na camada de valência do ferro modula a absorção óptica da luz visível."],["Qual a dupla função tecnológica dos sulfitos (SO₂) e por que a ANVISA exige declaração ostensiva em rótulos?", "Atuam como redutores de quinonas impedindo o escurecimento enzimático e como conservantes antimicrobianos; exigem rotulagem obrigatória por deflagrarem broncoespasmo agudo grave em asmáticos.", "O dióxido de enxofre livre atua como potente desencadeador de broncoconstrição alérgica."],["Como o cobre do alambique artesanal purifica quimicamente o aroma da cachaça de alambique?", "O cobre das paredes reage com as mercaptanas voláteis e H₂S fétidos originados da fermentação, precipitando sulfeto de cobre (CuS) insolúvel e purificando sensorialmente o destilado.", "O alambique de cobre atua como um reator catalítico purificador de compostos de enxofre."],["O que é o fenômeno do bloom em balcões de autosserviço de açougues?", "É a conversão espontânea da desoximioglobina vermelho-púrpura da carne em oximioglobina vermelho-cereja brillante após 15 a 30 minutos de contato direto com o oxigênio do ar.", "O bloom reconstitui o apelo visual de frescor da carne sem adicionar corantes químicos."],["Qual o impacto da metamioglobina redutase muscular sobre a vida de prateleira da carne refrigerada?", "Enquanto houver reservas celulares de coenzima NADH, essa enzima reduz o ferro Fe³⁺ de volta para Fe²⁺; quando o NADH esgota-se post mortem, a carne escurece irreversivelmente em metamioglobina.", "O pool de equivalentes redutores celulares define a resistência do corte ao escurecimento marrom."]]],
];

const GMN={
